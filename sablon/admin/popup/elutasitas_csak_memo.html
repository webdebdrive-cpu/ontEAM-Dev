<h2>Adja meg az elutasítás okát</h2>
<form id="elutasitasForm" class="popupForm" method="post" onsubmit="return bejegyzesElutasitas( this, 'csak memó' );">
    <div class="kozep">
        <div class="dt">
            <div class="dtr">
                <div class="dtc form_bal">Elutasítás oka:</div>
                <div class="dtc form_jobb">
                    <textarea name="elutasitas_memo" id="elutasitas_memo" onkeyup="if( $(this).val().trim()=='' ){ $(this).val(''); }"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
    </div>
</form>
