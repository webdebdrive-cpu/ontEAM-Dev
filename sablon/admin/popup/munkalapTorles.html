<h2>Munkalap törlése</h2>
<form action="" class="popupForm" method="post" onsubmit="return munkalapTorles();">
    <div class="kozep">
        <div id="torles_kerdes" class="b" style="margin-bottom: 1rem;"></div>
        <div class="dt">
            <div class="dtr">
                <div class="dtc form_bal">Indoklás</div>
                <div class="dtc form_jobb">
                    <textarea name="torles_memo" id="torles_memo" class="csillag" onkeyup="if( $(this).val().trim()=='' ){ $(this).val(''); }"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Igen">
        <input type="button" name="megsem" class="gombb_alert" value="Nem" onclick="popupZar();">
    </div>
</form>
<script>
$(document).ready(function(){
    $.ajax({
        url : 'munkalap.php',
        type: 'POST',
        data: {
            id              : _get('id'),
            get_ml_torles   : Date.now()
        },
        success: function(response){
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if(response) {
                response = JSON.parse(response);
                $('#torles_kerdes').html(response.kerdes);
            }
        }
    });
});
    
function munkalapTorles(mehet){

    szurkit();
    
    /* Indoklás ellenőzése */
    var indoklas = $('#torles_memo').val().trim();
    if(!indoklas){
        alert2('Kérem adja meg a törlés indoklását!', '', 'Hiba');
        $('#torles_memo').assClass('hibas_ide_focus');
        return false;
    }
    
    /* Majd egy GET hívás. Ugyanaz törétnik, mint más menüpontoknál: a get_kibont_torol() függvény által előállított címre lépünk, csak itt a háttérben */
    $.ajax({
        url : 'munkalap.php',
        type: 'GET',
        data: {
            lista       : 1,
            munkalaptid : _get('id'),
            indoklas    : indoklas
        },
        success: function(response){
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            location.reload();
        }
    });

    return false;
}
</script>
