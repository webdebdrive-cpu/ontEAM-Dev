<h2>Tételek kezelése</h2>

<style>
    /* A specifikáció sortörései a cella szövegében maradnak (szerkesztéskor innen kerülnek vissza a textarea-ba), itt csak megjelenítjük őket */
    #pop_tetelek .pop_spec {
        white-space: pre-line;
    }
</style>

<div class="kozep" style="min-height: 30rem">
    <div id="osszesito" style="margin-bottom: 1rem; font-weight: 600;">
        Igényelt nettó összesen: <span id="tetel_ossz_netto">0</span> <span id="tetel_ossz_netto_penznem"></span>
    </div>

    <div id="tetel_form" class="dn">
        <!-- Bal oldalon a mezők, mellettük jobbra a három sor magas Specifikáció -->
        <div style="display: flex; gap: 2rem; align-items: flex-start;">
            <div class="dt">
                <div class="dtr">
                    <div class="dtc form_bal">Név:</div>
                    <div class="dtc form_jobb"><input type="text" id="pop_nev" class="oriasi csillag" maxlength="60"></div>
                </div>
                <div class="dtr">
                    <div class="dtc form_bal">Cikkszám:</div>
                    <div class="dtc form_jobb"><input type="text" id="pop_csz" class="oriasi" maxlength="20"></div>
                </div>
                <div class="dtr">
                    <div class="dtc form_bal">Ig. menny.:</div>
                    <div class="dtc form_jobb nowrap">
                        <input type="text" id="pop_igmen" class="f_num f_csak_pozitiv csillag" data-tort="0" style="width: 8rem;"> db
                        <span class="form_bal" style="margin-left: 2rem;">Ig. eár.:</span>
                        <input type="text" id="pop_igar" class="f_num f_csak_pozitiv csillag" data-tort="0" style="width: 10rem;"> <span id="pop_igar_penznem"></span>
                    </div>
                </div>
            </div>
            <div class="dt">
                <div class="dtr">
                    <div class="dtc form_bal" style="vertical-align: top;">Specifikáció:</div>
                    <div class="dtc form_jobb"><textarea id="pop_spec" rows="3" maxlength="2000" style="width: 25rem;"></textarea></div>
                </div>
            </div>
        </div>
        <input type="hidden" id="pop_tetel_id" value="">
        <br><input type="button" id="tetel_hozzaad_gomb" class="gomb" value="Új tétel hozzáadása" onclick="tetel_hozzaadasa()">
        <input type="button" id="tetel_hozzaad_megsem_gomb" class="gomb piros dn" value="Mégsem" onclick="tetel_form_urit()">
    </div>

    <table class="csikos" id="pop_tetelek" style="margin-top: 1rem;">
        <thead>
        <tr>
            <th class="l">Név</th>
            <th class="l">Specifikáció</th>
            <th class="l">Cikkszám</th>
            <th class="r">Igényelt menny.</th>
            <th class="r" id="tetel_th_igar">Igényelt egységár</th>
            <th class="r" id="tetel_th_ignetto">Igényelt nettó</th>
            <th id="tetel_th_szerk"></th>
            <th id="tetel_th_torol"></th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
<div class="kuldes">
    <input type="button" id="tetel_mentes_gomb" class="gomb zold dn" value="Mentés" onclick="tetel_sorok_ment()">
    <input type="button" class="gomb piros" value="Mégsem" onclick="bezar_gomb();">
</div>
<script>

var van_valtozas     = false;
var torolt_sorok     = [];
var szerkesztheto_e  = false;
// A tétel nettó egységára és a táblázat mindig a rendelés pénznemében van: HUF-os igénylésnél Ft, devizásnál a fej pénzneme (pl. EUR), a felületen forintnál is pénznem kód (HUF) jelenik meg -
// tehát a fenntartasi_szamla_tetel dev_net mezőjének mintájára itt sincs Ft-ra váltás/vissza a felületen, ezt a szerver végzi mentéskor.
var deviza_e      = false;
var penznem_kiir  = 'HUF';
var tort          = 0;

$(document).ready(function(){
    tetel_lista_betolt();
});

function tetel_lista_betolt() {
    $.ajax({
        url : 'eszkozigenyles.php',
        type: 'POST',
        data: {
            id                  : _get('id'),
            tetel_lista_feltolt : Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);
                if( response.hiba ) {
                    alert2(response.hiba, response.gomb, response.title);
                    return false;
                }

                deviza_e     = response.deviza ? true : false;
                penznem_kiir = response.kcs_21_nev || 'HUF';
                tort         = deviza_e ? 2 : 0;

                $('#pop_igar_penznem').html(penznem_kiir);
                $('#pop_igar').attr('data-tort', tort);
                $('#tetel_th_igar'   ).html('Igényelt egységár ('+penznem_kiir+')');
                $('#tetel_th_ignetto').html('Igényelt nettó ('+penznem_kiir+')');
                $('#tetel_ossz_netto_penznem').html(penznem_kiir);

                $('#pop_tetelek tbody').html(response.html);

                szerkesztheto_e = response.szerkesztheto ? true : false;
                if( szerkesztheto_e ) {
                    $('#tetel_form').removeClass('dn');
                    $('#tetel_mentes_gomb').removeClass('dn');
                    $('#tetel_th_szerk, #tetel_th_torol').html('Szerkesztés');
                    $('#tetel_th_torol').html('Törlés');
                } else {
                    $('#tetel_form').addClass('dn');
                }
                tetel_osszesito_frissit();
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
}

function tetel_osszesito_frissit() {
    var osszeg = 0;
    $('#pop_tetelek .pop_ignetto').each(function() {
        osszeg += Number($(this).text().replace(/\s/g, '').replace(',', '.'));
    });
    $('#tetel_ossz_netto').html(number_format(osszeg, tort, ',', ' '));
}

function tetel_form_urit() {
    $('#pop_nev').val('');
    $('#pop_spec').val('');
    $('#pop_csz').val('');
    $('#pop_igmen').val('');
    $('#pop_igar').val('');
    $('#pop_tetel_id').val('');
    $('#tetel_hozzaad_gomb').val('Új tétel hozzáadása');
    $('#tetel_hozzaad_megsem_gomb').addClass('dn');
}

// Tétel szerkesztése: a sor celláinak tartalmát betöltjük a form mezőkbe (a táblázat már a helyes pénznemben mutatja az egységárat, nincs átváltás)
function tetel_sor_szerk(sor_id) {
    var sor = $('.'+sor_id);
    $('#pop_nev'  ).val( sor.find('.pop_nev'  ).text() );
    $('#pop_spec' ).val( sor.find('.pop_spec' ).text() );
    $('#pop_csz'  ).val( sor.find('.pop_csz'  ).text() );
    $('#pop_igmen').val( sor.find('.pop_igmen').text() );
    $('#pop_igar' ).val( sor.find('.pop_igar' ).text() );

    $('#pop_tetel_id').val(sor_id);
    $('#tetel_hozzaad_gomb').val('Tétel mentése');
    $('#tetel_hozzaad_megsem_gomb').removeClass('dn');
    $('#pop_nev').focus();
}

// Tétel sor törlése a táblázatból (DB-be csak a popup Mentés gombjára íródik)
function tetel_sor_torol(sor_id, mehet) {
    if( !mehet ) {
        alert2('Biztosan törli ezt a tételt?', '<input type="button" class="gomb zold" value="Igen" onclick="tetel_sor_torol(\''+sor_id+'\', \'mehet\'); alert2();"><input type="button" class="gomb piros" value="Nem" onclick="alert2();">', 'Kérdés');
        return false;
    }

    van_valtozas = true;

    var recid = $('.'+sor_id+' .pop_recid').val();
    if( recid ) {
        torolt_sorok.push(recid);
    }

    $('.'+sor_id).fadeOut('slow', function(){
        $('.'+sor_id).remove();
        tetel_osszesito_frissit();
    });

    tetel_form_urit();
}

// Tétel hozzáadása / a szerkesztett tétel sor frissítése a táblázatban (még csak a böngészőben, DB-be csak Mentéskor kerül)
function tetel_hozzaadasa() {

    var nev   = $('#pop_nev'  ).val().trim();
    var spec  = $('#pop_spec' ).val().trim();
    var csz   = $('#pop_csz'  ).val().trim();
    var igmen = $('#pop_igmen').val().replace(/\s/g, '').replace(',', '.');
    var igar  = $('#pop_igar' ).val().replace(/\s/g, '').replace(',', '.');
    var sor_id = $('#pop_tetel_id').val();

    if( !nev ) {
        alert2('Kérem töltse ki a tétel nevét!', '', 'Hiba');
        $('#pop_nev').addClass('hibas_ide_focus');
        return false;
    }
    if( !igmen || igmen<=0 ) {
        alert2('Kérem töltse ki az igényelt mennyiséget!', '', 'Hiba');
        $('#pop_igmen').addClass('hibas_ide_focus');
        return false;
    }
    if( igar==='' || igar<0 ) {
        alert2('Kérem töltse ki az igényelt egységárat!', '', 'Hiba');
        $('#pop_igar').addClass('hibas_ide_focus');
        return false;
    }

    van_valtozas = true;

    var ignetto    = number_format(igmen*igar, tort, ',', ' ');
    var igmen_kiir = number_format(igmen, 0, ',', ' ');
    var igar_kiir  = number_format(igar,  tort, ',', ' ');

    // Ha ismert a sor_id, akkor a meglévő sort frissítjük
    if( sor_id ) {

        $('.'+sor_id+' .pop_nev'    ).text( nev       );
        $('.'+sor_id+' .pop_spec'   ).text( spec      );
        $('.'+sor_id+' .pop_csz'    ).text( csz       );
        $('.'+sor_id+' .pop_igmen'  ).text( igmen_kiir);
        $('.'+sor_id+' .pop_igar'   ).text( igar_kiir );
        $('.'+sor_id+' .pop_ignetto').text( ignetto   );

    // Egyébként új sor hozzáadása a táblázathoz
    } else {

        var id_tmp = 'uj_'+Date.now();
        var table_sor = '<tr class="pop_tetel_'+id_tmp+'">' +
                            '<td class="pop_nev l">'    + nev        + '</td>' +
                            '<td class="pop_spec l">'   + spec       + '</td>' +
                            '<td class="pop_csz l">'    + csz        + '</td>' +
                            '<td class="pop_igmen r nowrap">'   + igmen_kiir + '</td>' +
                            '<td class="pop_igar r nowrap">'    + igar_kiir  + '</td>' +
                            '<td class="pop_ignetto r nowrap">' + ignetto    + '</td>' +
                            '<td><a class="szerk" onclick="tetel_sor_szerk(\'pop_tetel_'+id_tmp+'\');">🖉</a></td>' +
                            '<td><a onclick="tetel_sor_torol(\'pop_tetel_'+id_tmp+'\');"><span class="icon"><i class="material-icons">delete</i></span></a>' +
                                '<input type="hidden" class="pop_recid" value="">' +
                            '</td>' +
                        '</tr>';

        $('#pop_tetelek tbody').append(table_sor);
    }

    tetel_osszesito_frissit();
    tetel_form_urit();
    $('#pop_nev').focus();
}

// A config.php minden $_POST értéken stripslashes()-t futtat, ami a JSON escape-jeit (pl. sortörésnél \n, idézőjelnél \") tönkretenné:
// a visszaperjeleket megduplázzuk, így a stripslashes() után pontosan az eredeti JSON érkezik meg a json_decode()-hoz
function tetel_json(adat) {
    return JSON.stringify(adat).replace(/\\/g, '\\\\');
}

// Popup Mentés gomb: a táblázatban jelenleg szereplő összes sort (és a törölt sorokat) egyben küldjük a szervernek.
// Az egységár itt még a táblázatban mutatott pénznemben megy (HUF vagy a fej devizája) - a Ft-ra váltást a szerver végzi, ő ismeri biztosan az igénylés pénznemét.
// Ha az utolsó (mentett) tételt is törölték, az igénylés tétel nélkülivé válik: rákérdezünk, a szerver pedig a törölt tétel adatait visszaírja a fejbe.
function tetel_sorok_ment(mehet) {

    var sorok = $('#pop_tetelek tbody tr');
    if( sorok.length < 1 ) {
        if( torolt_sorok.length < 1 ) {
            alert2('Legalább egy tételt fel kell venni!', '', 'Hiba');
            return false;
        }
        if( !mehet ) {
            alert2('Az összes tételt törölte, így az igénylés tétel nélkülivé válik:<br>Az utoljára törölt tétel mennyisége és egységára az igénylés adatlapjára kerül.<br>Folytatja?', '<input type="button" class="gomb zold" value="Igen" onclick="alert2(); tetel_sorok_ment(\'mehet\');"><input type="button" class="gomb piros" value="Nem" onclick="alert2();">', 'Kérdés');
            return false;
        }
    }

    var recidk  = [];
    var nevek   = [];
    var specek  = [];
    var cszk    = [];
    var igmenek = [];
    var igarok  = [];

    sorok.each(function() {
        recidk.push ( $(this).find('.pop_recid' ).val() );
        nevek.push  ( $(this).find('.pop_nev' ).text() );
        specek.push ( $(this).find('.pop_spec').text() );
        cszk.push   ( $(this).find('.pop_csz' ).text() );
        igmenek.push( $(this).find('.pop_igmen').text().replace(/\s/g, '').replace(',', '.') );
        igarok.push ( $(this).find('.pop_igar' ).text().replace(/\s/g, '').replace(',', '.') );
    });

    $.ajax({
        url : 'eszkozigenyles.php',
        type: 'POST',
        data: {
            id               : _get('id'),
            recidk           : tetel_json(recidk),
            nevek            : tetel_json(nevek),
            specek           : tetel_json(specek),
            cszk             : tetel_json(cszk),
            igmenek          : tetel_json(igmenek),
            igarok           : tetel_json(igarok),
            torolt_sorok     : tetel_json(torolt_sorok),
            tetel_sorok_ment : Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);
                if( response.hiba ) {
                    alert2(response.hiba, response.gomb, response.title);
                    return false;
                }
                van_valtozas = false;
                popupZar();
                if( $('#ossz_netto').length ) {
                    $('#ossz_netto').val(response.ossz_netto);
                }
                $('.muveletek').html(response.gombok);

                let ful = '';
                eszkoz_fulek.forEach(function(akt_ful) {
                    if( isset_get(akt_ful) ) {
                        ful = akt_ful;
                        return;
                    }
                });
                szamlaBetolt(_get('id'), baseName(location.href) + '.php', ful);
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
}

// Azért van külön függvénye, hogy rá lehessen kérdezni, ha volt mentetlen változás
function bezar_gomb(mehet) {
    if( van_valtozas && !mehet ) {
        alert2('A változások nincsenek mentve. Folytatja?', '<input type="button" class="gomb zold" value="Igen" onclick="bezar_gomb(\'mehet\')"><input type="button" class="gomb piros" value="Nem" onclick="alert2();">', 'Kérdés');
    } else {
        alert2();
        popupZar();
    }
}
</script>
