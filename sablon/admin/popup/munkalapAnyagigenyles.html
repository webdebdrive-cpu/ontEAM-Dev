<h2>Anyagigénylés munkalaphoz</h2>
<form action="" id="munkAnyagAnyagigenyles" class="popupForm" method="post">
    <div class="kozep" style="min-height: 40rem">
        <div class="dt">
            <div class="dtr"> 
                <div class="dtc form_bal">Cikk:</div>
                <div class="dtc form_jobb">
                    <input type="text" autocomplete="off" class="oriasi disableNav csillag focus" name="cikk_id_autocomp" id="cikk_id_autocomp" onblur="if(!$(this).val()){ $('#cikk_id').val(''); }" value="">
                    <input type="hidden" name="cikk_id" id="cikk_id" value="">
                    <input type="hidden" name="cikkid_origi" id="cikkid_origi" value="">
                    <script>
                        $(document).ready(function() {
                            $('#cikk_id_autocomp').autocomplete({
                                'php_fajl'      : '../autocomplete.php',
                                'tabla'         : 'cikktorzs',
                                'oszlop_keres'  : 'nev',
                                'oszlop_listaz' : 'nev',
                                'id_kiir'       : 'recid'
                            });
                        });
                    </script>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Felh. menny.:</div>
                <div class="dtc form_jobb wsn">
                    <input type="text" id="felh_menny" class="f_num" name="felh_menny" value="" placeholder="" autocomplete="off" style="min-width: 5rem; width: 5rem;">
                    <span class="insertMee"></span>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Szük. menny.:</div>
                <div class="dtc form_jobb wsn">
                    <input type="text" id="szuk_menny" class="f_num" name="szuk_menny" value="" placeholder="" autocomplete="off" style="min-width: 5rem; width: 5rem;">
                    <span class="insertMee"></span>
                </div>
            </div>
        </div>
        <div id="insertTable">
            <table class="csikos">
                <tr>
                    <th>Cikk</th>
                    <th>Név</th>
                    <th class="r">Felhasznált mennyiség</th>
                    <th class="r">Szükséges mennyiség</th>
                    <th>Mee</th>
                    <th>Anyag státusz</th>
                    <th class="torles"></th>
                </tr>
            </table>
        </div>
    </div>
    <div class="kuldes">
        <input type="button" class="gomb" onclick="munkAnyagHozzaad( '#munkAnyagAnyagigenyles', true );" value="Hozzáad">
        <input type="button" class="gomb zold" value="Mentés" onclick="munkAnyagIgenyles( this, 'csak kérdezünk még' )">
        <input type="button" class="gomb piros" value="Mégsem" onclick="popupZar();">
    </div>
</form>
<script>
/* Anyagigénylés táblázat sor hozzáadás */
function munkAnyagHozzaad( formID, igenyles ) {
    var form = $(formID);

    var cikknev     = form.find('input[name="cikk_id_autocomp"]'),
        cikkID      = form.find('input[name="cikk_id"]'),
        cikkid_origi= form.find('input[name="cikkid_origi"]'),
        felh_menny  = form.find('input[name="felh_menny"]'),
        szuk_menny  = form.find('input[name="szuk_menny"]'),
        cikkmee     = form.find('.insertMee').eq(0).text();

    var addCikkID = form.find('input[name="addCikkID[]"]').map(function(){return $(this).val();}).get();

    if( addCikkID.length ) {
        for(key in addCikkID) {
            if( addCikkID[key] == cikkID.val() ) {
                alert2('Ez az anyag már hozzá van adva a munkalap tételhez!', '', 'Hiba');

                cikkID.val('');
                cikknev.val('');
                felh_menny.val('');
                szuk_menny.val('');
                form.find('.insertMee').text('');

                document.getElementById('cikk_id_autocomp').select();

                return false;
            }
        }
    }

    if( cikknev.val() == '' || cikkID.val() == '' ) {
        alert2('Válassza ki a cikket!', '', 'Hiba');
        document.getElementById('cikk_id_autocomp').select();
        return false;
    }

    if( !igenyles && felh_menny.val() == '' ) {
        alert2('Adja meg a felhasznált mennyiséget!', '', 'Hiba');
        document.getElementById('felh_menny').select();
        return false;
    }

    if( igenyles ) {
        if( felh_menny.val() == '' && szuk_menny.val() == '' ) {
            alert2('Adja meg a felhasznált, vagy a szükséges mennyiséget!', '', 'Hiba');
            document.getElementById('felh_menny').select();
            return false;
        }
    }

    var sz_td = '';
    if( igenyles ) {
        sz_td = '<td class="c">' + szuk_menny.val() + '<input type="hidden" name="addCikkSzukMenny[]" value="' + szuk_menny.val() + '"></td>';
    }

    var table_sor = '<tr>' +
                        '<td>' + cikkid_origi.val() + '<input type="hidden" name="addCikkID[]" value="' + cikkid_origi.val() + '"><input type="hidden" name="addCikkUj[]" value="1"></td>' +
                        '<td>' + cikknev.val() + '</td>' +
                        '<td class="c">' + felh_menny.val() + '<input type="hidden" name="addCikkFelhMenny[]" value="' + felh_menny.val() + '"></td>' +
                        sz_td +
                        '<td>' + cikkmee + '</td>' +
                        '<td></td>' +
                        '<td><a onclick="munkAnyagTorol( false, this );"><span class="icon"><i class="material-icons">delete</i></span></a></td>' +
                    '</tr>';

    $('#insertTable table.csikos').append(table_sor);

    cikkID.val('');
    cikknev.val('');
    felh_menny.val('');
    szuk_menny.val('');
    form.find('.insertMee').text('');
    
    $('#cikk_id_autocomp').focus();

    return false;
}

/* Munkalap anyagigénylés mentése */
function munkAnyagIgenyles( that, csak_kerdezunk ) {
    var addCikkUj           = $(that).find('input[name="addCikkUj[]"]'),
        addCikkID           = $(that).find('input[name="addCikkID[]"]'),
        addCikkFelhMenny    = $(that).find('input[name="addCikkFelhMenny[]"]'),
        addCikkSzukMenny    = $(that).find('input[name="addCikkSzukMenny[]"]');

    if( addCikkID.length && addCikkFelhMenny.length ) {
        $.ajax({
         	url : 'munkalap.php',
         	type: 'POST',
         	data: {
                recid               : _get('id'),
                addCikkUj           : addCikkUj.serialize(),
                addCikkID           : addCikkID.serialize(),
                addCikkFelhMenny    : addCikkFelhMenny.serialize(),
                addCikkSzukMenny    : addCikkSzukMenny.serialize(),
                csak_kerdezunk      : csak_kerdezunk,
                munkAnyagIgenyles   : new Date().getTime()
            },
         	success: function(response) {
         		if(response) {
                    response = JSON.parse(response);

                    if( response.hiba ) {
                        alert2(response.hiba, response.gomb, response.title);
                        return false;
                    }

                    if( response.refresh ) {
                        location.href = get_get();
                        return false;
                    }

                    szamlaBetolt(_get('id'), baseName(location.href) + '.php', 'tetel');
                    popupZar();
                    alert2();
         		}
         	}
        });
    }else{
        $('#cikk_id_autocomp').addClass('hibas_ide_focus');
        alert2('Kérem előbb adjon hozzá legalább egy cikket!', '', 'Hiba');
    }

    return false;
}


</script>
