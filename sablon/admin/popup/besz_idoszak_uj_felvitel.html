<h2>Új időszak azonosítása</h2>
<form class="popupForm" method="post" onsubmit="uj_idoszak_ment(); return false;">
    <div class="kozep c">
        Évszám: <input type="text" id="idoszak_ev" maxlength="4" class="f_csakszam csillag" style="width: 4.5rem">
    </div>
    <div class="kuldes">
        <input type="button" class="gomb zold" value="Mentés" onclick="uj_idoszak_ment();">
        <input type="button" class="gomb piros" value="Mégsem" onclick="popupZar();" id="nem_gomb">
    </div>
</form>
<script>
$(document).ready(function(){
    $.ajax({
        url : PHP_SELF,
        type: 'POST',
        data: {
            get_idoszak_ev: Date.now()
        },
        success: function(response){
            if(response){
                response = JSON.parse(response);
                if(response.hiba){
                    alert2(response.hiba, response.gomb, response.title);
                    return false;
                }
                $('#idoszak_ev').val(response.ev);
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
});

// Új időszak mentése
function uj_idoszak_ment() {
    
    $.ajax({
        url : PHP_SELF,
        type: 'POST',
        data: {
            ev              : $('#idoszak_ev').val(),
            uj_idoszak_ment : Date.now()
        },
        success: function (response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if (response) {
                response = JSON.parse(response);
                if (response.hiba) {
                    alert2(response.hiba, response.gomb, response.title);
                    $('#idoszak_ev').select();
                    return false;
                }
                popupZar();
                location.href = 'besz_idoszak.php?uj';
            }
        },
        complete: function (xhr) {
            if (xhr.status != 200) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
}
</script>
