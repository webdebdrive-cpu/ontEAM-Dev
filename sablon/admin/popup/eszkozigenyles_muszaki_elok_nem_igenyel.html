<h2>Műszakilag nem érintett</h2>
<script>
    var MEGEROSITVE = 0;
</script>
<form id="elutasitasForm" class="popupForm" method="post" onsubmit="muszakilag_nem_erintett(MEGEROSITVE); return false;">
    <div class="kozep">
        Az igénylés műszakilag nem érintett.<br>Biztosan mehet igazgatói engedélyezésre?
        <br>
        <br>
        <br>
        <div class="dt">
            <div class="dtr">
                <div class="dtc form_bal">Szálloda:</div>
                <div class="dtc form_jobb">
                    <div id="popup_telephely"></div>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Termék megnevezés:</div>
                <div class="dtc form_jobb">
                    <div id="popup_nev"></div>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Indoklás:</div>
                <div class="dtc form_jobb">
                    <textarea id="igenyel_indok" onkeyup="if( $(this).val().trim()=='' ){ $(this).val(''); }" style="min-width: 0;"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Igen">
        <input type="button" name="megsem" class="gombb_alert" value="Nem" onclick="popupZar();">
    </div>
</form>
<script>
$(document).ready(function(){

    var akt_id = _get('id');
    
    if( $('#telephely_id').length ) {
        $('#popup_telephely').html( $('#telephely_id option:selected').text() );
    } else {
        $('#popup_telephely').html( $('#telephely_nev_db_'+akt_id).val() );
    }
    if( $('#nev').length ) {
        $('#popup_nev').html( $('#nev').val() );
    } else {
        $('#popup_nev').html( $('#nev_db_'+akt_id).val() );
    }
    if( $('#popup_ossz').length ) {
        $('#popup_ossz_netto').html( $('#ossz_netto').val() + ' Ft' );
    } else {
        $('#popup_ossz_netto').html( $('#ossz_netto_db_'+akt_id).val() + ' Ft' );
    }

    if( $('#kiv_kolts').length ) {
        $('#popup_kiv_kolts').val( $('#kiv_kolts').val() );
    } else {
        $('#popup_kiv_kolts').val( $('#kiv_kolts_db_'+akt_id).val() );
    }
    if( $('#becsult').length ) {
        if( $('#becsult').val() == 1 ) {
            $('#popup_becsult').prop( 'checked', true );
        }
    } else {
        if( $('#becsult_db_'+akt_id ).val() == 1 ) {
            $('#popup_becsult').prop( 'checked', true );
        }
    }

    // Mégse kerüljön be az indoklás mezőbe az adatbázis értéke, logolós működés kell ide
    // $('#igenyel_indok').val( $('#musz_indok_db_'+akt_id).val().replace(/<br\s*\/?>/g, '\n') );
    $('#popup_kiv_kolts').select();

    // Kérjük le a típust, mert azon múlik majd a függvényhívás paraméterezése
    $.ajax({
        url : PHP_SELF,
        type: 'POST',
        data: {
            id          : akt_id,
            get_igeny   : Date.now()
        },
        success: function(response){
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if(response){
                response = JSON.parse(response);
                if(response.hiba){
                    alert2(response.hiba, response.gomb, response.title);
                    return false;
                }
                if(response.tipus == 1){
                    MEGEROSITVE = '-tervezett-';
                }
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
});

// Műszakilag nem érintett gomb
function muszakilag_nem_erintett(mehet) {

    // globális változók frissítése az adott adatlap alapján
    eszkoz_valtozok_update();

    // if( !mehet ) {
    //     alert2('Az igénylés műszakilag nem érintett.<br>Biztosan mehet igazgatói engedélyezésre?', '<input type="button" class="gomb zold enter" value="Igen" onclick="muszakilag_nem_erintett(\'-mehet-\')"> <input type="button" class="gomb piros" value="Nem" onclick="alert2()">', 'Kérdés');
    //     return false;
    // }

    $.ajax({
        url : PHP_SELF+eszkoz_url_kieg,
        type: 'POST',
        data: {
            id                      : eszkoz_id,
            indok                   : $('#igenyel_indok').val(),
            muszakilag_nem_erintett : Date.now()
        },
        success: function (response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if (response) {
                response = JSON.parse(response);
                if (response.hiba) {
                    alert2(response.hiba, response.gomb, response.title);
                    return false;
                }

                popupZar();

                // Táblázat alatt a sort frissítjük
                if( isset_get('tablazat') ) {
                    $('.musz_el_ig_'    +eszkoz_id  ).html(response.pipa     );
                    $('.stat_'          +eszkoz_id  ).html(response.statusz  );
                    $('.kiv_kolts_'     +eszkoz_id  ).html('0');
                    $('#kiv_kolts_db_'  +eszkoz_id  ).val ('0');
                    $('#musz_indok_db_' +eszkoz_id  ).val ('');
                    $('.gombok_'        +eszkoz_id  ).html(response.gombok   );

                    // Megjegyzések számát is, mert ha volt értesítés küldés, akkor bővülhetett
                    $('.gombok_'        +eszkoz_id  ).data('megj_db', response.megj_db    );
                    // Fülön is
                    let megj_ful_txt = 'Megjegyzések';
                    if( response.megj_db>0 ) {
                        megj_ful_txt = 'Megjegyzések ('+response.megj_db+')';
                    }
                    $('#szamlaFulek a[data-oldal="megjegyzesek"]').html(megj_ful_txt);

                    // Ha a mehet a '-tervezett-' igénylés miatt volt kitöltve, akkor lépünk a következő sorra. 
                    if( mehet == '-tervezett-' ) {
                        // Ilyet mégsem kérnek
                        // naviKov();
                        // Helyette a gombokat frissítsük
                        $('.muveletek').html(response.gombok);

                    // Egyébként a tényleges gombokat is cserélni kell
                    } else {
                        $('.muveletek').html(response.gombok);
                    }
                
                // Egyébként az adatlapot töltsük be
                } else {

                    let ful   = '';
                    eszkoz_fulek.forEach(function(akt_ful) {
                        if( isset_get(akt_ful) ) {
                            ful = akt_ful;
                            return;
                        }
                    });
                    szamlaBetolt(_get('id'), baseName(location.href) + '.php', ful);

                    // Ha a mehet a '-tervezett-' igénylés miatt volt kitöltve, akkor lépünk a következő sorra. 
                    if( mehet == '-tervezett-' ) {
                        setTimeout(function(){
                            // Ilyet mégsem kérnek
                            // naviKov();
                        }, 1000);
                    }
                }
            }
        },
        complete: function (xhr) {
            if (xhr.status != 200) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
}
</script>
<style>
    #igenyel_indok {
        min-width: 47rem;
    }
</style>
