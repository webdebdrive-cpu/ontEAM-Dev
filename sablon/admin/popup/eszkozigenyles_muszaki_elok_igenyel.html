<!--
VIGYÁZZ! IDE KÉT FÉLEKÉPPEN IS EL TUDSZ JUNTI, RÁADÁSUL A NYOMÓGOMB FELIRAT IS UGYANAZ (Műszaki előkészítést igényel), 
(Tervezett igénylés + Új felvitel státusz ILLETVE Soron kívüli igénylés + Műszaki jóváhagyásra vár státusz.)
A működésük is eltér: Soron kívülinél a költség és indoklás kötelező mezők
-->
<h2>Műszaki előkészítést igényel</h2>
<form id="elutasitasForm" class="popupForm" method="post" onsubmit="return musz_elokeszitest_igenyel();">
    <div class="kozep">
        <div class="dt">
            <div class="dtr">
                <div class="dtc form_bal">Szálloda:</div>
                <div class="dtc form_jobb">
                    <div id="popup_telephely"></div>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Termék megnevezés:</div>
                <div class="dtc form_jobb">
                    <div id="popup_nev"></div>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Igényelt nettó érték:</div>
                <div class="dtc form_jobb">
                    <div id="popup_ossz_netto"></div>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Kivitelezési költség:</div>
                <div class="dtc form_jobb">
                    <input type="text" class="f_num" data-tort="0" id="popup_kiv_kolts" value=""> Ft
                    <span style="margin-left: 2rem;"></span>
                    Becsült érték:
                    <div class="cb">
                        <input type="checkbox" class="check" id="popup_becsult">
                        <label for="popup_becsult"></label>
                    </div>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Indoklás:</div>
                <div class="dtc form_jobb">
                    <textarea id="igenyel_indok" maxlength="900" onkeyup="if( $(this).val().trim()=='' ){ $(this).val(''); }"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
    </div>
</form>
<script>
$(document).ready(function(){

    var akt_id = _get('id');
    
    if( $('#telephely_id').length ) {
        $('#popup_telephely').html( $('#telephely_id option:selected').text() );
    } else {
        $('#popup_telephely').html( $('#telephely_nev_db_'+akt_id).val() );
    }
    if( $('#nev').length ) {
        $('#popup_nev').html( $('#nev').val() );
    } else {
        $('#popup_nev').html( $('#nev_db_'+akt_id).val() );
    }
    if( $('#popup_ossz').length ) {
        $('#popup_ossz_netto').html( $('#ossz_netto').val() + ' Ft' );
    } else {
        $('#popup_ossz_netto').html( $('#ossz_netto_db_'+akt_id).val() + ' Ft' );
    }

    if( $('#kiv_kolts').length ) {
        $('#popup_kiv_kolts').val( $('#kiv_kolts').val() );
    } else {
        $('#popup_kiv_kolts').val( $('#kiv_kolts_db_'+akt_id).val() );
    }
    if( $('#becsult').length ) {
        if( $('#becsult').is(':checked') ) {
            $('#popup_becsult').prop( 'checked', true );
        }
    } else {
        if( $('#becsult_db_'+akt_id ).val() == 1 ) {
            $('#popup_becsult').prop( 'checked', true );
        }
    }
    
    // Mégse kerüljön be az indoklás mezőbe az adatbázis értéke, logolós működés kell ide
    // $('#igenyel_indok').val( $('#musz_indok_db_'+akt_id).val().replace(/<br\s*\/?>/g, '\n') );
    $('#popup_kiv_kolts').select();

    // Ha az igénylés típusa nem tervezett, akkor a "Kivitelezési költség:" és "Indoklás:" mezők kötelezőek:
    if( $('#tipus_db_'+_get('id')).val() != 1 ) {
        $('#popup_kiv_kolts').addClass('csillag');
        $('#igenyel_indok'  ).addClass('csillag');
    }

});
function musz_elokeszitest_igenyel() {

    // globális változók frissítése az adott adatlap alapján
    eszkoz_valtozok_update();
    
    // Kivitelezési költség és indoklás kötelező, de csak soron kívüli igénylésnél kötelező
    if( $('#tipus_db_'+_get('id')).val() != 1 ) {
        if( !$('#popup_kiv_kolts').val() || $('#popup_kiv_kolts').val() == '0' ) {
            $('#popup input, #popup textarea, #popup select').removeClass('hibas_ide_focus');
            $('#popup_kiv_kolts').addClass('hibas_ide_focus');
            alert2('Kérem adja meg a kivitelezés költségét!', '<input type="button" class="link gomb" value="Ok" onclick="alert2();">', 'Hiba');
            return false;
        }
        if( !$('#igenyel_indok').val() ) {
            $('#popup input, #popup textarea, #popup select').removeClass('hibas_ide_focus');
            $('#igenyel_indok').addClass('hibas_ide_focus');
            alert2('Kérem töltse ki az indoklást!', '<input type="button" class="link gomb" value="Ok" onclick="alert2();">', 'Hiba');
            return false;
        }
    }

    $.ajax({
        url : 'eszkozigenyles.php',
        type: 'POST',
        data: {
            id                          : eszkoz_id,
            indok                       : $('#igenyel_indok'  ).val(),
            kiv_kolts                   : $('#popup_kiv_kolts').val(),
            becsult                     : $('#popup_becsult').prop('checked') ,
            musz_elokeszitest_igenyel   : new Date().getTime()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if(response) {
                response = JSON.parse(response);
                if( response.hiba ) {
                    setTimeout(function () {
                        alert2(response.hiba, response.gomb, response.title);
                    }, 500);
                    return false;
                }

                popupZar();

                // Táblázat alatt a sort frissítjük
                if( isset_get('tablazat') ) {
                    $('.musz_el_ig_'    +eszkoz_id  ).html(response.pipa     );
                    $('.stat_'          +eszkoz_id  ).html(response.statusz  );
                    $('.kiv_kolts_'     +eszkoz_id  ).html(response.kiv_kolts);
                    $('#kiv_kolts_db_'  +eszkoz_id  ).val (response.kiv_kolts);
                    $('#musz_indok_db_' +eszkoz_id  ).val (response.indok    );
                    $('.gombok_'        +eszkoz_id  ).html(response.gombok   );

                    // Megjegyzések számát is, mert ha volt értesítés küldés, akkor bővülhetett
                    $('.gombok_'        +eszkoz_id  ).data('megj_db', response.megj_db    );
                    // Fülön is
                    $('#szamlaFulek a[data-oldal="megjegyzesek"]').html('Megjegyzések ('+response.megj_db+')');

                    // Ha '-tervezett-' igénylés, akkor lépünk a következő sorra. 
                    if( $('#tipus_db_'+_get('id')).val() == 1 ) {
                        // Ez hívódik meg a lap tetején léptető gombnyomásra is.
                        // Ilyet mégsem kérnek
                        // naviKov();
                        // Helyette a gombokat frissítsük
                        $('.muveletek').html(response.gombok);

                    // Egyébként a tényleges gombokat is cserélni kell
                    } else {
                        $('.muveletek').html(response.gombok   );
                    }
                
                // Egyébként az adatlapot töltsük be
                } else {

                    let ful = '';
                    eszkoz_fulek.forEach(function(akt_ful) {
                        if( isset_get(akt_ful) ) {
                            ful = akt_ful;
                            return;
                        }
                    });
                    szamlaBetolt(_get('id'), baseName(location.href) + '.php', ful);
                }
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });

    return false;
}
</script>
<style>
    #igenyel_indok {
        min-width: 47rem;
    }
</style>
