<h2>Anyagigénylés leírás hozzáadása</h2>
<form action="" id="elutasitasForm" class="popupForm" method="post">
    <div class="kozep">
        
        <div class="dt">
            <div class="dtr">
                <div class="dtc form_bal">Leírás:</div>
                <div class="dtc form_jobb">
                    <textarea name="anyagigenyles_leiras" id="anyagigenyles_leiras" class="csillag" onkeyup="if( $(this).val().trim()=='' ){ $(this).val(''); }"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="button" name="elkuld" class="gomb zold" value="Mentés" onclick="anyagigenylesLeirasHozzaadas();">
        <input type="button" name="megsem" class="gomb piros" value="Mégsem" onclick="popupZar();">
    </div>
</form>
<script>

/* Tartalom betöltés */
$(document).ready(function(){
    
    if(!_get('id')){
        
        oldal_nev = 'anyagigénylést';
        if( _get('anyagrend') ){
            oldal_nev = 'anyagrendelést';
        }
        
        alert2('Kérjük válassza ki a szerkeszteni kívánt '+oldal_nev+'!', '', 'Hiba');
        setTimeout(function(){ popupZar(); }, 100);
    }else{
    
        $.ajax({
            url : 'anyagigenyles.php',
            type: 'POST',
            data: {
                id          : _get('id'),
                get_leiras  : Date.now()
            },
            success: function(response){
                if(response){
                    response = JSON.parse(response);

                    if( response.hiba ) {
                        alert2(response.hiba, response.gomb, 'Hiba');
                        return false;
                    }

                    $('#anyagigenyles_leiras').val(response.txt);
                }
            }
        });
    }
});
/* Anyagigénylés leírás hozzáadása */
function anyagigenylesLeirasHozzaadas() {

    if(balnav_kijelol_ell()){
        szamlaSorok = $('#szamlaList li.szamla_sor.kijelolve');

        if( szamlaSorok.length ) {
            idk = {};

            var i = 1;
            szamlaSorok.each(function() {
                var id = $(this).attr('data-recid');

                idk[i] = id;
                i++;
            });

            if( objLength(idk) ) {
                var page = $('#szamlaBetolt').attr('data-page');

                $.ajax({
                    url : 'anyagigenyles.php',
                    type: 'POST',
                    data: {
                        idk             : JSON.stringify(idk),
                        page            : page,
                        indok           : $('#anyagigenyles_leiras').val(),
                        anyagigenylesLeirasHozzaadas: new Date().getTime()
                    },
                    success: function(response) {
                        if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
                        if(response) {
                            response = JSON.parse(response);

                            if( response.hiba ) {
                                alert2(response.hiba, response.gomb, 'Hiba');
                                return false;
                            }

                            /*kijelolesEltavolit();*/
                            if( _get('modosit') ){
                                szamlaBetolt(_get('id'), baseName(location.href) + '.php', 'modosit');
                            }
                            /* navpanel frissítése (minden kijelölt sort) */
                            /*szamlaSorok.each(function() {
                                szamlaSorFrissit(page, $(this).attr('data-recid'));
                            });*/
                            popupZar();
                        }
                    }
                });
            } else {
                alert2('Nincsenek kijelölt sorok!', '', 'Hiba');
            }
        }
    }
}
</script>
