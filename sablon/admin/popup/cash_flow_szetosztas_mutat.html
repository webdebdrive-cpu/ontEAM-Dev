<h2>Szétosztásra váró számla tételek</h2>
<div class="kozep">
    <div id="szamla_tetelek_tablazat" style="margin-bottom: 2rem"></div>
    <div id="excel_export"></div>
    <div class="c">
        <input type="button" class="gomb piros" value="Bezár" onclick="popupZar();">
    </div>
</div>
<script>
$(document).ready(function(){
    $.ajax({
        url : PHP_SELF,
        type: 'POST',
        data: {
            cash_flow_szetosztasra_mutat : Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if (response) {
                response = JSON.parse(response);
                if (response.hiba) {
                    alert2(response.hiba, response.gomb, response.title)
                    return false;
                }
                
                $('#szamla_tetelek_tablazat').html(response.html);
                $('#excel_export').html(response.excel_html);
            }
        }
    });
});
</script>
