<h2>Anyagigénylés sztornózása</h2>
<form class="popupForm" method="post" onsubmit="return anyagigenylesSztornoz();">
    <div class="b" style="padding: 2rem 2.5rem 0 2.5rem; line-height: 2.2rem" id="adatok">
    </div>
    <div class="kozep">
        <div class="dt">
            <div class="dtr">
                <div class="dtc form_bal b">Indoklás</div>
                <div class="dtc form_jobb">
                    <textarea name="sztorno_memo" id="sztorno_memo" class="csillag" onkeyup="if( $(this).val().trim()=='' ){ $(this).val(''); }"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
    </div>
</form>
<script>
    
    $(document).ready(function(){
        
        if( $('.szamla_sor.kijelolve').length>1 ){
            alert2('Egyszerre csak egy anyagigénylés szornózható!', '', 'Hiba');
            setTimeout(function(){ popupZar(); }, 100);
            return false;
        }
        
        $.ajax({
            url : 'anyagigenyles.php',
            type: 'POST',
            data: {
                id          : _get('id'),
                get_adatok  : Date.now()
            },
            success: function(response) {
                if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
                if(response){
                    $('#adatok').html(response);
                }
            },
            complete: function(xhr) {
                if( xhr.status != 200 ) {
                    alert2(xhr.responseText, '', 'Hiba');
                }
            }
        });
    });
    
	function anyagigenylesSztornoz(){
        
        szurkit();
        
        $.ajax({
            url : 'anyagigenyles.php',
            type: 'POST',
            data: {
                recid                   : _get('id'),
                memo                    : $('#sztorno_memo').val(),
                anyagigenylesSztornoz   : new Date().getTime()
            },
            success: function(response) {
                if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
                if(response) {
                    
                    response = JSON.parse(response);

                    if( response.hiba ) {
                        alert2(response.hiba, response.gomb, response.title);
                        if(response.focus){
                            $('#'+response.focus).addClass('hibas_ide_focus');
                        }
                        return false;
                    }

                    // Ajax lefutott, de a szürkítés vissza kell tenni a reload miatt
                    setTimeout(function(){ szurkit(); }, 100);
                    // location.href='anyagigenyles.php?id='+_get('id')+'&modosit&anyagrend';

                    // Ne a sztornózott adatlapjra menjünk, mert az úgy sem fog betölteni (alapértelmezetten a legfrissebb anyagrendelések jelennek meg, problémás adott adatlapot betölteni)
                    location.href='anyagigenyles.php?mezo=stat_id&op=equal&felt=05&tablazat';

                }
            },
            complete: function(xhr) {
                if( xhr.status != 200 ) {
                    alert2(xhr.responseText, '', 'Hiba');
                }
            }
        });

        return false;
    }
</script>
