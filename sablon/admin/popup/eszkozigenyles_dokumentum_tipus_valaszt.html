<h2>Dokumentum típus kiválasztása</h2>
<form id="dokumentum_tipus_valaszt" class="popupForm" method="post" onsubmit="return false;">

    <div class="padd" style="padding-bottom: 16rem">
        <div id="fajl_adatok">
            Fájl fetöltése előtt kérem válassza ki a dokumentum tipusát: 
        </div>
        <input type="text" autocomplete="off" class="oriasi disableNav focus" name="pop_tipus_autocomp" id="pop_tipus_autocomp" onblur="if(!$(this).val()){ $('#pop_tipus').val(''); }" value="" style="margin-top: 0.3rem;">
        <input type="hidden" name="pop_tipus" id="pop_tipus" value="">
        <script>
            $(document).ready(function() {
                $('#pop_tipus_autocomp').autocomplete({
                    'php_fajl'      : '../autocomplete.php',
                    'tabla'         : 'erteklista',
                    'oszlop_keres'  : 'info',
                    'oszlop_listaz' : 'info',
                    'csoport'       : 39,        /* Dokumentum tipus */
                    /* 'menupont_szuro': 'projekt', Szerződés típusú minősítés nem lesz így kiválasztható - ez itt nem is fog kelleni */
                    'id_kiir'       : 'id',
                });
            });
        </script>
    </div>
    
    <div class="kuldes">
        <input type="button" name="elkuld" class="gomb zold" value="Mentés" onclick="dok_tipus_ment();">
        <input type="button" name="megsem" class="gomb piros" value="Mégsem" onclick="popupZar();">
    </div>
</form>

<style>
    #fajl_adatok {
        margin: 1rem 0;
        line-height: 1.2;
    }
</style>

<script>
function dok_tipus_ment() {
    $('#dok_tipus_feltolt').val( $('#pop_tipus').val() );
    $('.jsff input[type="file"]').click();
    popupZar();
}
</script>
