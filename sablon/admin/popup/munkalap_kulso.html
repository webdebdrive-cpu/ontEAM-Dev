<form action="" id="munkalapKulso" class="popupForm" method="post" onsubmit="return false;">

        <div class="dtr">

                <input type="text" autocomplete="off" class="oriasi disableNav csillag" name="torzsadat_id_autocomp" id="torzsadat_id_autocomp" onblur="if(!$(this).val()){ $('#torzsadat_id').val(''); }" value="">

                     $(document).ready(function() {
                         $('#torzsadat_id_autocomp').autocomplete({
                             'php_fajl'         : '../autocomplete.php',
                             'tabla'            : 'szallito',
                             'oszlop_keres'     : 'nev',
                             'oszlop_listaz'    : 'nev',

                             'csoport'          : 0,
                             'id_kiir'          : 'recid'
                         });
                    });
                </script>
            </div>
        </div>
    </div>
    <p>vagy átadás hozzárendelt személyzetnek:</p>

        <div class="dtr">
            <div class="dtc form_jobb">
                <select class="" name="">
                    <option value="">- Válassz -</option>
                    <option value="">Adminisztrátor</option>
                    <option value="">Műszaki vezető</option>
                    <option value="">Területi vezető </option>
                    <option value="">Diszpécser központ vezető</option>
                </select>
            </div>
        </div>

    <div class="kuldes">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">

</form>
