<h2>Munkalap átadása</h2>
<form action="" id="munkalapKulso" class="popupForm" method="post" onsubmit="return munkalapKulso();">
    <div class="kozep" style="min-height: 20rem">
        <p>Válasszon külső kivitelezőt:</p>
        <div class="dt">
            <div class="dtr"> 
                <div class="dtc form_jobb plr0">
                    <input type="text" autocomplete="off" class="oriasi disableNav csillag" name="szallito_id_autocomp" id="szallito_id_autocomp" onblur="if(!$(this).val()){ $('#szallito_id').val(''); }" value="">
                    <input type="hidden" name="szallito_id" id="szallito_id" value="">
                    <script>
                         $(document).ready(function() {
                             $('#szallito_id_autocomp').autocomplete({
                                 'php_fajl'         : '../autocomplete.php',
                                 'tabla'            : 'szallito',
                                 'oszlop_keres'     : 'nev',
                                 'oszlop_listaz'    : 'nev',
                                 'rkat'             : 0,
                                 'csoport'          : 0,
                                 'id_kiir'          : 'id'
                             });
                        });
                    </script>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
    </div>
</form>
<script>
/* Munkalap átadása külső csoportnak */
function munkalapKulso() {

    if(balnav_kijelol_ell()){

        var szallito_id         = $('#szallito_id'),
        szallito_id_autocomp    = $('#szallito_id_autocomp');

        if( !szallito_id.val() ) {
            alert2('Válasszon külső kivitelezőt!', '', 'Hiba');
            document.getElementById('szallito_id_autocomp').focus();
            return false;
        }

        $.ajax({
            url : 'munkalap.php',
            type: 'POST',
            data: {
                recid        : _get('id'),
                szallito_id  : szallito_id.val(),
                munkalapKulso: new Date().getTime()
            },
            success: function(response) {
                if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
                if(response) {
                    response = JSON.parse(response);

                    if( response.hiba ) {
                        alert2(response.hiba, response.gomb, response.title);
                        return false;
                    }

                    szamlaBetolt(_get('id'), baseName(location.href) + '.php', 'modosit');
                    popupZar();
                }
            }
        });

    }

    return false;
}
</script>
