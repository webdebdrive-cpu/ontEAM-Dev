<h2>Munkalap átadása</h2>
<form action="" id="munkalapKulso" class="popupForm" method="post" onsubmit="return munkalapKulso();">
    <div class="kozep" style="min-height: 20rem">
        <p>Válasszon külső kivitelezőt:</p>
        <div class="dt">
            <div class="dtr"> 
                <div class="dtc form_jobb plr0">
                    <input type="text" autocomplete="off" class="oriasi disableNav csillag" name="szallito_id_autocomp" id="szallito_id_autocomp" onblur="if(!$(this).val()){ $('#szallito_id').val(''); }" value="">
                    <input type="hidden" name="szallito_id" id="szallito_id" value="">
                    <script>
                         $(document).ready(function() {
                             $('#szallito_id_autocomp').autocomplete({
                                 'php_fajl'         : '../autocomplete.php',
                                 'tabla'            : 'szallito',
                                 'oszlop_keres'     : 'nev',
                                 'oszlop_listaz'    : 'nev',
                                 'rkat'             : 0,
                                 'csoport'          : 0,
                                 'id_kiir'          : 'id',
                                 complete           : function() { get_szallito_mailcim( $(this) ); }
                             });
                        });
                    </script>
                    <br>
                    <br><strong>Várható érkezés:</strong>
                    <br><input type="text" autocomplete="off" class="datetimepicker pop_datetimepicker popup_input_margo" name="pop_varh_erk" id="pop_varh_erk">
                    <br>
                    <br><strong>Email megrendelés adatai:</strong>
                    <br>Címzett kiválasztása: <input type="text" autocomplete="off" class="oriasi disableNav csillag" name="pop_cimzett_loginbol_autocomp" id="pop_cimzett_loginbol_autocomp" onblur="if(!$(this).val()){ $('#pop_cimzett_loginbol').val(''); }" value="" style="width: 30rem">
                    <input type="hidden" name="pop_cimzett_loginbol" id="pop_cimzett_loginbol" value="">
                    <script>
                         $(document).ready(function() {
                             $('#pop_cimzett_loginbol_autocomp').autocomplete({
                                 'php_fajl'         : '../autocomplete.php',
                                 'tabla'            : 'login',
                                 'oszlop_keres'     : 'nev',
                                 'oszlop_listaz'    : 'teljes_nev',
                                 'rkat'             : 0,
                                 'csoport'          : 0,
                                 'id_kiir'          : 'usermail',
                             });
                        });
                    </script>
                    <input type="button" class="gomb alacsony zold" value="Címzett" onclick="cimzett_add('cimzett')">
                    <input type="button" class="gomb alacsony kek" value="Másolat" onclick="cimzett_add('masolat')">
                    <br><strong>Címzett:</strong>
                    <br><input type="text" id="pop_cimzett" class="oriasi disableNav popup_input_margo" maxlength="250">
                    <br><strong>Másolat:</strong>
                    <br><input type="text" id="pop_masolat" class="oriasi disableNav popup_input_margo" maxlength="250">
                    <br><strong>Tárgy:</strong>
                    <br><input type="text" id="pop_targy" class="oriasi disableNav popup_input_margo" maxlength="250">
                    <br><strong>Üzenet:</strong>
                    <br><textarea id="pop_uzenet" class="popup_input_margo level_szoveg"></textarea>
                    <br>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="hidden" id="email_kuldessel" value="0">
        <input type="hidden" id="mehet_mail_nelkul" value="0">
        <input type="button" class="gomb popup_input_margo" onclick="$('#email_kuldessel').val('1'); $('#munkalapKulso').submit();" value="Email küldése partnernek">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
    </div>
</form>
<script>
$(document).ready(function(){
    
    /* Külső kivitelező hozzárendelés popup inputjait be kell állítani, alapértemlezett értékekkel feltölteni *//* Levélküldés mezőinek alapértelmezett értékének beállítsa */
    get_kulso_hozzarendeles_input_tartalmak();
    
});
    
/* Munkalap átadása külső csoportnak */
function munkalapKulso() {

    if(balnav_kijelol_ell()){

        var szallito_id         = $('#szallito_id'),
        varh_erk                = $('#pop_varh_erk');

        if( !szallito_id.val() ) {
            alert2('Válasszon külső kivitelezőt!', '', 'Hiba');
            document.getElementById('szallito_id_autocomp').focus();
            return false;
        }

        $.ajax({
            url : 'munkalap.php',
            type: 'POST',
            data: {
                recid        : _get('id'),
                szallito_id  : szallito_id.val(),
                varh_erk     : varh_erk.val(),
                email        : $('#email_kuldessel').val(),
                mehet        : $('#mehet_mail_nelkul').val(),
                cimzett      : $('#pop_cimzett').val(),
                masolat      : $('#pop_masolat').val(),
                targy        : $('#pop_targy').val(),
                uzenet       : $('#pop_uzenet').val(),
                munkalapKulso: new Date().getTime()
            },
            success: function(response) {
                if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
                if(response) {
                    response = JSON.parse(response);

                    if( response.hiba ) {
                        alert2(response.hiba, response.gomb, response.title);
                        if(response.focus){
                            $('#'+response.focus).focus();
                        }
                        $('#email_kuldessel').val('0');
                        return false;
                    }

                    szamlaBetolt(_get('id'), baseName(location.href) + '.php', 'modosit');
                    popupZar();
                }
            }
        });

    }

    return false;
}

/* Címzett/másolat mezőhöz adjuk a kiválasztott mailcímet */
function cimzett_add( mezo ){
    
    if(!$('#pop_cimzett_loginbol_autocomp').val()){
        alert2('Kérem válasszon előbb válasszon címzettet!');
        return false;
    }
    
    if(!$('#pop_cimzett_loginbol').val()){
        alert2($('#pop_login_autocomp').val()+' felhasználónak nem ismert a mailcíme!');
    }
    
    if(mezo=='cimzett'){
        var cimzett = '';
        if($('#pop_cimzett').val()){
            cimzett = ', ';
        }
        cimzett += $('#pop_cimzett_loginbol').val();
        $('#pop_cimzett').val( $('#pop_cimzett').val()+cimzett );
    }
    if(mezo=='masolat'){
        var masolat = '';
        if($('#pop_masolat').val()){
            masolat = ', ';
        }
        masolat += $('#pop_cimzett_loginbol').val();
        $('#pop_masolat').val( $('#pop_masolat').val()+masolat );
    }
    
    $('#pop_cimzett_loginbol').val('');
    $('#pop_cimzett_loginbol_autocomp').val('');
    
}
</script>
