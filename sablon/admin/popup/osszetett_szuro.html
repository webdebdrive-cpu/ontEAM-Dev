<div style="width: 70rem">
    <h2>Összetett szűrés</h2>
    <div class="kozep" style="min-height: 30rem">
        <div id="o_szures"></div>  
        <div id="o_feltetel_halmaz" class="dt" class="dt" style="margin-top: 1rem"></div>

        <div id="o_szures_mondat" style="margin-top: 2rem"></div>
        <div class="dt" style="margin-top: 1rem">
            <div id="o_sures_t" class="dtc w33"></div>
            <div id="o_sures_ft" class="dtc c w33"></div>
            <div id="o_sures" class="dtc r w33"></div>
        </div>
        <script>
            $(document).ready(function(){
                
                /* Fontos, hogy anyagigénylésnél az anyagrend paraméter is megjelenjen az URL-ben, ha anyagrendelés felületen volnánk, mert az $_SESSION['elozo_oldal'] kiszámításához (összetett szűrő) kell */
                var url = baseName(location.href)+'.php';
                if(baseName(location.href)=='anyagigenyles'){
                    if( _get('anyagrend') ){
                        url += '?anyagrend';
                    }
                }
                $.ajax({
                    url : url,
                    type: 'POST',
                    data: {
                        o_szures: new Date().getTime()
                    },
                    success: function (response) {
                        if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
                        response = JSON.parse(response);
                        $('#o_szures').html(response.inputok);
                        $('#o_feltetel_halmaz').html(response.html);

                        if($('#o_feltetel_halmaz').html()){
                            $('#o_sures_t').html('<input type="button" class="gomb kis_gomb piros f_o_szures_torol" value="Szűrés vége">');
                            $('#o_sures_ft').html('<input type="button" class="gomb kis_gomb piros f_o_szures_ftorol" value="Feltételek törlése">');
                            o_szures_gomb_mutat();
                        }

                    }
                });
            });
        </script>
    </div>
</div>
