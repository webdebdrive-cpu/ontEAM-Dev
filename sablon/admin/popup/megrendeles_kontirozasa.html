<script>

akt_penznem = $('#penznem_db').val();

// JS-el figyeljük, hogy volt-e bármi változás. Ha igen, akkor Mégsem/Bezár gombra rákérdezünk, hogy biztos-e?
var van_valtozas = false;
var torolt_sorok = '';

$(document).ready(function () {
    
    // Popup bezár gombjára visszatesszük az eredeti funkciót, mert a kapcsoló popban felülírtuk egy csoportMuvelet-es utasítással
    $('#popup .bezar').attr('onclick', '');
    
    // f_penznem class-ú elemek lecserélése a pénznemre
    $('.f_penznem').each(function () {
        $(this).replaceWith(akt_penznem);
    });

    // Új tétel hozzáadásánál mi legyen a tizedesek hossza
    var tizedesek   = 0;
    if( akt_penznem && akt_penznem != 'HUF' ) {
        tizedesek   = 2;
    }
    $('#pop_szla_varh_ert').attr('data-tort', tizedesek);

    var kiv_hat = $('#kiv_hat').val();
    if( kiv_hat == '\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0' ) {
        kiv_hat = $('#kiv_hat_db').val();
    }
    $('#pop_szla_varh_erk').val( kiv_hat.replace(/-/g, '.') );
    
    // datepicker_matol felkonfigolása
    $('.datepicker_matol').datetimepicker({
        closeOnDateSelect   : true,
        format              :'Y.m.d',
        mask                : '\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0',
        timepicker          : false,
        validateOnBlur      : false,
        scrollInput         : false,
        minDate             : '-1970/01/02'
    });
    
    $('.datepicker').datetimepicker({
        closeOnDateSelect   : true,
        format              :'Y.m.d',
        mask                : '\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0',
        timepicker          : false,
        validateOnBlur      : false,
        scrollInput         : false,
        onChangeDateTime    : function(){ }
    });
    
    pop_tetelek_feltolt();
    
});

// Tételt hozzáadó függvény
function tetel_hozzaadasa() {
    
    var pop_targy       = $('#pop_targy'            ).val().trim();
    var pop_varh_erk    = $('#pop_szla_varh_erk'    ).val().trim();
    var pop_varh_ert    = $('#pop_szla_varh_ert'    ).val().trim();
    var jogcim_txt      = $('#jogcim_id_autocomp'   ).val().trim();
    var ktgnem_txt      = $('#ktgnem_id_autocomp'   ).val().trim();
    var ktghely_txt     = $('#ktghely_id_autocomp'  ).val().trim();
    var jogcim_id       = $('#jogcim_id'            ).val().trim();
    var ktgnem_id       = $('#ktgnem_id'            ).val().trim();
    var ktghely_id      = $('#ktghely_id'           ).val().trim();
    var sor_id          = $('#tetel_sor_id'         ).val().trim();

    van_valtozas = true;

    // Üres adatok ellenőrzése
    if( !pop_targy ){
        alert2('Kérem töltse ki a tárgy mezőt!', '', 'Hiba');
        $('#pop_targy').addClass('hibas_ide_focus');
        return false;
    }

    if( !pop_varh_erk || pop_varh_erk == '0000.00.00' || pop_varh_erk == '0000-00-00' || pop_varh_erk == '.\xa0\xa0.' ) {
        alert2('Kérem töltse ki a várható érkezést!', '', 'Hiba');
        $('#pop_szla_varh_erk').addClass('hibas_ide_focus');
        return false;
    }

    var datum = new Date().toISOString();
    datum = datum.substring(0, 10).replace(/-/g, '.');
    if( pop_varh_erk < datum ) {
        alert2('A várható érkezés nem lehet a múltban!', '', 'Hiba');
        $('#pop_szla_varh_erk').addClass('hibas_ide_focus');
        return false;
    }

    if( !pop_varh_ert || pop_varh_ert=='0' ) {
        alert2('Kérem töltse ki a várható értéket!', '', 'Hiba');
        $('#pop_szla_varh_ert').addClass('hibas_ide_focus');
        return false;
    }

    if( !jogcim_id ){
        alert2('Kérem töltse ki a jogcímet!', '', 'Hiba');
        $('#jogcim_id_autocomp').addClass('hibas_ide_focus');
        return false;
    }

    var id_tmp = new Date().getTime();
    
    // Ha ismert a sor_id, akkor update
    if( sor_id ) {

        $('.pop_tetel_'+sor_id+' .pop_targy'            ).html( pop_targy   );
        $('.pop_tetel_'+sor_id+' .pop_varh_erk'         ).html( pop_varh_erk);
        $('.pop_tetel_'+sor_id+' .pop_varh_ert'         ).html( pop_varh_ert);
        $('.pop_tetel_'+sor_id+' .pop_jogcim_autocomp'  ).html( jogcim_txt  );
        $('.pop_tetel_'+sor_id+' .pop_jogcim'           ).val ( jogcim_id   );
        $('.pop_tetel_'+sor_id+' .pop_ktgnem_autocomp'  ).html( ktgnem_txt  );
        $('.pop_tetel_'+sor_id+' .pop_ktghely_autocomp' ).html( ktghely_txt );

    // Egyébként új sor hozzáadása
    } else {
        
        var table_sor = '<tr class="pop_tetel_'+id_tmp+'">'+
                            '<td class="pop_targy l">'+pop_targy + '</td>'+
                            '<td class="pop_varh_erk l">'+pop_varh_erk + '</td>'+
                            '<td class="pop_varh_ert r">'+pop_varh_ert + '</td>'+
                            '<td class="pop_jogcim_autocomp l">'+jogcim_txt+'</td>' +
                            '<td class="pop_ktgnem_autocomp l">'+ktgnem_txt+'</td>' +
                            '<td class="pop_ktghely_autocomp l">'+ktghely_txt+ '</td>' +
                            /*'<td><a class="szerk" onclick="popup_tetel_sor_szerk(\'pop_tetel_'+id_tmp+'\');">🖉</a></td>'+*/
                            '<td><a onclick="popup_tetel_sor_torol(\'pop_tetel_'+id_tmp+'\');"><span class="icon"><i class="material-icons">delete</i></span></a>'+
                                '<input type="hidden" class="pop_jogcim" name="pop_jogcim_id" value="'+jogcim_id+'">' +
                                '<input type="hidden" class="pop_recid" name="recid" value="'+sor_id+'">'+        
                            '</td>' +
                        '</tr>';

        $('#pop_tetelek tbody').append( table_sor );
        $('#pop_tetelek').removeClass('dn');
        
    }

    $('#pop_targy'          ).val('');
    $('#pop_szla_varh_erk'  ).val('\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0');
    $('#pop_szla_varh_ert'  ).val('');
    $('#jogcim_id_autocomp' ).val('');
    $('#jogcim_id'          ).val('');
    $('#ktgnem_id_autocomp' ).val('');
    $('#ktgnem_id'          ).val('');
    $('#ktghely_id_autocomp').val('');
    $('#ktghely_id'         ).val('');
    $('#tetel_sor_id'       ).val('');
    $('#hozzaad_gomb'       ).val('Új tétel hozzáadása');

    $('#pop_targy').focus();
    
    $('.pop_mentes_megsem').removeClass('dn');
    
    tetelek_kiszamol();
    
    // A tétel sorokat csak Session-ba, kimentjük. DB-be még nem menethetünk csak, ha a Mentés gombra kattintottak.

}

// Tétel sor törlése
function popup_tetel_sor_torol(sor_id, mehet){
    
    van_valtozas = true;
    
    $('.'+sor_id).addClass('torles_elott');
    if(!mehet){
        alert2( 
                'Számla várh. érk: '    + $('.'+sor_id+' .pop_varh_erk').html() +'<br>' +
                'Számla várh. értéke: ' + $('.'+sor_id+' .pop_varh_ert').html() +' ' + akt_penznem + '<br>' +
                'Biztosan törli a tételt?', '<input type="button" class="gomb zold" value="Igen" onclick="popup_tetel_sor_torol(\''+sor_id+'\', \'mehet\'); alert2();"><input type="button" class="gomb piros escapes_megsem" value="Nem" onclick="alert2(); $(\'.torles_elott\').removeClass(\'torles_elott\');">');
        return false;
    }
    
    // Sor törlése, újraszámolás
    $('.'+sor_id).fadeOut('slow', function(){
        $('.'+sor_id).remove();
        tetelek_kiszamol();
    });
    
    // Popup mentésekor ez alapján töröljük ki majd a sort
    torolt_sorok += sor_id;
    
    $('#pop_targy').focus();
    
    $('.pop_mentes_megsem').removeClass('dn');
    
    // A tétel sorokat csak Session-ba, kimentjük. DB-be még nem menethetünk csak, ha a Mentés gombra kattintottak.
}

// Tétel szerkesztése
function popup_tetel_sor_szerk(sor_id){
    
    // Sor törlése, újraszámolás
    $('#pop_targy'          ).val( $('.'+sor_id+' .pop_targy'           ).html() );
    $('#pop_szla_varh_erk'  ).val( $('.'+sor_id+' .pop_varh_erk'        ).html() );
    $('#pop_szla_varh_ert'  ).val( $('.'+sor_id+' .pop_varh_ert'        ).html() );
    $('#jogcim_id_autocomp' ).val( $('.'+sor_id+' .pop_jogcim_autocomp' ).html().replace(/&amp;/g, '&') );
    $('#jogcim_id'          ).val( $('.'+sor_id+' .pop_jogcim'          ).val () );
    $('#ktgnem_id_autocomp' ).val( $('.'+sor_id+' .pop_ktgnem_autocomp' ).html().replace(/&amp;/g, '&') );
    $('#ktgnem_id'          ).val( $('.'+sor_id+' .pop_ktgnem'          ).val () );
    $('#ktghely_id_autocomp').val( $('.'+sor_id+' .pop_ktghely_autocomp').html().replace(/&amp;/g, '&') );
    $('#ktghely_id'         ).val( $('.'+sor_id+' .pop_ktghely'         ).val () );
    $('#tetel_sor_id'       ).val( sor_id.replace('pop_tetel_', ''      )        );
    
    $('#hozzaad_gomb').val('Tétel mentése');
    
    $('#pop_telephely_id').focus();
    
}

// Tétel sor táblázat mentése
function tetel_sorok_ment(){
    
    var recidk = [];
    $('.pop_recid').each(function() {
        recidk.push( $(this).val() );
    });
    var targy = [];
    $('.pop_targy').each(function() {
        targy.push( json_spec_karakterek($(this).html()) );
    });
    var varh_erk = [];
    $('.pop_varh_erk').each(function() {
        varh_erk.push( $(this).html() );
    });
    var varh_ert = [];
    $('.pop_varh_ert').each(function() {
        varh_ert.push( $(this).html() );
    });
    var jogcimek = [];
    $('.pop_jogcim').each(function() {
        jogcimek.push( $(this).val() );
    });
    
    var adatok = [
                    ['recidk',    recidk    ],
                    ['targy',     targy     ],
                    ['varh_erk',  varh_erk  ],
                    ['varh_ert',  varh_ert  ],
                    ['jogcimek',  jogcimek  ]
                ];
    
    // A Jóváhagyott érték mező
    // De ha nem az adatlapon vagyunk, akkor meg egy rejtett inputban megtaláljuk, hogy a DB-ben mi van letárolva
    var jh_ert_dev = '';
    if( $('#jh_ert_dev').length ){
        jh_ert_dev = $('#jh_ert_dev').val();
    } else {
        jh_ert_dev = $('#jh_ert_dev_db').val();
    }

    $.ajax({
        url : 'munkalap.php',
        type: 'POST',
        data: {
            adatok              : JSON.stringify(adatok).replace(/\\"/g, '"'),
            recid               : _get('id'),
            torolt_sorok        : torolt_sorok,
            jh_ert_dev          : jh_ert_dev,
            tetel_sorok_ment    : Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);
                if( response.hiba ) {
                    alert2(response.hiba, response.gomb, response.title);
                } else {
                    
                    // Adatlapot csak akkor frissítünk, és popupot csak akkor zárunk ha DB-be is elmentjük
                    if( _get('tetel') ){
                        szamlaBetolt(_get('id'), 'munkalap.php');
                    }
                    popupZar();
                    $('#ossz_jh_ert_dev').val( response.tetelek_osszege );
                    
                    // Ennek köszönhetően lehet majd az adatlapot egyáltalán menteni (új feltöltéskor)
                    $('#van_tetel').val('1');
                    
                }
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });

}

// Ha van SESSION-ban adatunk, akkor abból töltsük fel a sorokat
function pop_tetelek_feltolt(){
    
    $.ajax({
        url : 'munkalap.php',
        type: 'POST',
        data: {
            id                  : _get('id'),
            pop_tetelek_feltolt : Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);
                
                if(response.hiba){
                    alert2(response.hiba, response.gomb, response.title);
                    if( response.focus ){
                        $('#'+response.focus).addClass('hibas_ide_focus');
                    }
                    popupZar();
                    return false;
                }
                
                if(response.html){
                    $('#pop_tetelek tbody').append(response.html);
                    $('#pop_tetelek').removeClass('dn');
                }
                if(response.pr_tetelek){
                    $('#projekt_tetelek').html(response.pr_tetelek);
                }
                tetelek_kiszamol();
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
}

    // Ha volt változtatás, és nem volt még kérdés
    if( van_valtozas && !mehet ){

    } else {
        csoportMuvelet('megrendeles_kontirozasa');

}

function bezar_gomb( mehet ) {
    
    // Ha volt változtatás, és nem volt még kérdés
    if( van_valtozas && !mehet ){
        alert2('A változások nincsenek mentve. Folytatja?', '<input type="button" class="gomb zold" value="Igen" onclick="bezar_gomb(\'mehet\')"><input type="button" class="gomb piros escapes_megsem" value="Nem" onclick="alert2();">', 'Kérdés');
    } else {
        alert2();

        // szamlaBetolt(_get('id'), 'projektszamla.php', 'modosit');
    }
    
}

// Tételek kiszámítása, lássuk hol járunk a szerződéses összeghez képest
function tetelek_kiszamol() {
    
    if( akt_penznem == null ) {
        akt_penznem = '';
    }

    var osszeg_mezo = 'jh_ert_dev';

    // HUF esetén nem törtet írunk ki, deviza esetén viszont törtet
    var tizedesek   = 0;
    var vesszo      = '';
    if( akt_penznem && akt_penznem != 'HUF' ) {
        tizedesek   = 2;
        vesszo      = ',';
    }
    
    if( $('#'+osszeg_mezo).length ) {
        szerzodes_osszege = $('#'+osszeg_mezo).val().replace(/ /g, '').replace(/,/g, '.');
    }else{
        szerzodes_osszege = $('#'+osszeg_mezo+'_db').val().replace(/ /g, '').replace(/,/g, '.');
    }

    $('#pop_ml_jh_ert').html( ezresek(szerzodes_osszege, tizedesek, vesszo, ' ', '-nullát is írd ki-')+' '+akt_penznem );
    
    tetelek_ossz = 0;
    $('.pop_varh_ert').each(function() {
        tetelek_ossz += Number( $(this).html().replace(/ /g, '').replace(/,/g, '.') );
    });
    $('#pop_tetelek_ossz').html( ezresek(tetelek_ossz, tizedesek, vesszo, ' ', '-nullát is írd ki-')+' '+akt_penznem );

    kulonbseg = Number(szerzodes_osszege) - Number(tetelek_ossz);
    if( !kulonbseg ) {
        kulonbseg = '0';
    }
    
    $('#pop_kulonbseg').html( ezresek(kulonbseg, tizedesek, vesszo, ' ', '-nullát is írd ki-')+' '+akt_penznem );
    $('#pop_kulonbseg').removeClass('piros');
    if( kulonbseg!=0 && kulonbseg!='0,00' ) {
        $('#pop_kulonbseg').addClass('piros');
    }
}

</script>
