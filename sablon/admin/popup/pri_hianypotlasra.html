<h2>Pótlás alatti adatok leírása</h2>
<form action="" id="addHianypotlas" class="popupForm" method="post" onsubmit="return addHianypotlas()">
    <div class="kozep">
        <div class="dt">
            <div class="dtr"> 
                <div class="dtc form_bal">Pótlás alatti<br>adatok leírása:</div>
                <div class="dtc form_jobb">
                    <textarea name="hianypotlas_megj" id="hianypotlas_megj" class="gombm disableNav focus csillag" onkeyup="if( $(this).val().trim()=='' ){ $(this).val(''); }"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
    </div>
</form>
<script>
/* Hiánypótlás indokolása */
function addHianypotlas() {
    var megj = $('#hianypotlas_megj').val();

    recid = $('#szamlaList li.szamla_sor.kijelolve').attr('data-recid');
    var ajax = $.ajax({
        url : 'projektigenyles.php',
        type: 'POST',
        data: {
            recid         : recid,
            megj          : megj,
            addHianypotlas: new Date().getTime()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);

                if( response.hiba ) {
                    alert2(response.hiba, response.gomb, 'Hiba');
                    return false;
                }

                szamlaBetolt(recid, baseName(location.href) + '.php', 'modosit').done(function() {
                    $('#naploSor-' + response.kapcsID).addClass('uj');
                });

                popupZar();
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });

    return false;
}
</script>
