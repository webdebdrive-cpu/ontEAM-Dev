<h2>Anyagok érkeztetése</h2>
<form action="" id="anyagErkForm" class="popupForm" method="post" onsubmit="return anyagigenyles_erkeztet();">
    <div class="kozep"> 
        <div> 
            <span id="erkeztet_uzi">Adjon meg egy rendelésszámot!</span>
            <table>
                <tr>
                    <td class="r form_bal" style="width: 12rem">Rendelés szám:</td>
                    <td class="l form_jobb"><input type="text" id="rsz" autocomplete="off" maxlength="8" class="csillag" style="width: 6.9rem"></td>
                </tr>
                <tr id="szallito_sor" class="dn">
                    <td class="r form_bal">Szállító:</td>
                    <td class="l form_jobb">
                        <input type="text" id="pop_szallito" style="width: 100%">
                    </td>
                </tr>
            </table>

        </div>
        <div id="rendeles_tetelek" style="max-height: 30rem; overflow-y: auto"></div>
    </div>
    <div class="kuldes">
        <input name="elkuld" value="Ok" type="submit">
        <input name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();" type="button">
    </div>
</form>
