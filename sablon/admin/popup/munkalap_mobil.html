<h2>Munkalapok hozzárendelése mobil személyzethez</h2>
<form action="" id="munkalapMobil" class="popupForm" method="post" onsubmit="return munkalapMobil();">
    <table class="mobilTable">
        <tr>
            <td class="mtb">
                <p>Hozzárendelt munkalapok beosztás nélkül</p>
                <div id="hozzBeosztasNelkul" class="mobilkeret"></div>
                <div class="clearFix">
                    <button type="button" name="button" class="flr" style="margin-top: 1rem;" onclick="">Vissza a bejelentések közé</button>
                </div>
                <p>Személyzethez rendelt munkalapok</p>
                <div id="szemRendelt" class="mobilkeret"></div>
                <div class="clearFix">
                    <button type="button" name="button" class="flr" style="margin-top: 1rem;" onclick="">Hozzárendelés megszüntetése</button>
                </div>
            </td>
            <td class="mtj">
                <input type="text" autocomplete="off" class="oriasi disableNav csillag" name="torzsadat_id_autocomp" id="torzsadat_id_autocomp" onblur="if(!$(this).val()){ $('#torzsadat_id').val(''); }" value="">
                <input type="hidden" name="torzsadat_id" id="torzsadat_id" value="">
                <script>
                    $(document).ready(function() {
                        $('#torzsadat_id_autocomp').autocomplete({
                            'php_fajl'      : '../autocomplete.php',
                            'tabla'         : 'torzsadat',
                            'oszlop_keres'  : 'nev',
                            'oszlop_listaz' : 'nev',
                            'rkat'          : 0,
                            'csoport'       : 0,
                            'id_kiir'       : 'recid'
                        });
                    });
                </script>
                <button type="button" name="button" style="margin-top: 1rem;" onclick="">Hozzárendelés személyzethez</button>
            </td>
        </tr>
    </table>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
    </div>
</form>
