<h2>Munkalapok hozzárendelése mobil személyzethez</h2>

<script>
    $(function() {
        $('ul.droptrue').sortable({
            connectWith: 'ul.dropItem',
            start: function( event, ui ) {
                $(ui.item[0]).css('max-width', '17.9rem');
            },
            stop: function( event, ui ) {
                $(ui.item[0]).css('max-width', '100%');
            }
        });

        $('ul.dropfalse').sortable({
            connectWith: 'ul.dropItem',
            dropOnEmpty: false
        });

        $('.dropItem').disableSelection();
    });
</script>

<form action="" id="munkalapMobil" class="popupForm" method="post" onsubmit="return munkalapMobil( this );">

</form>
