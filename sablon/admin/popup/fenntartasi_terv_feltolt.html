<h2>Új terv feltöltése</h2>

<div class="kozep">
    Adja meg a terv készítéséhez szükséges évet!
    <br>
    <div class="kozep">
        <div class="dt">
                
            <div class="dtr" id="fterv_szalloda">
                
            </div>
            <div class="dtr">
                <div class="dtc p">
                    Évszám: 
                </div>
                <div class="dtc p">
                    <input type="text" id="popup_ev" maxlength="4" class="f_plus_minus csillag" style="width: 4.5rem; min-width: 4.5rem"> (év választás +/- billentyűk)
                </div>
            </div>
        </div>
    </div>
    
    <div class="c" style="margin-top: 2rem">
        <input type="button" class="gomb" value="Új munkaközi terv (üres)" onclick="terv_keszit()">
        <br><input type="button" class="gomb dn" value="Új munkaközi terv (kijelölt alapján)" onclick="terv_keszit('kijelolt')" id="kijelolt_alapjan">
    </div>
</div>
<div class="kuldes">
    <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
</div>

<script>
    $(document).ready(function(){
        
        /* Évszám alapértelmezett értéke */
        $('#popup_ev').val( new Date().getFullYear() + 1);
        
        /* Szálloda select betöltése */
        $.ajax({
            url : 'fenntartasi_terv.php',
            type: 'POST',
            data: {
                recid           : _get('id'),
                get_szalloda    : Date.now()
            },
            success: function(response) {
                if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
                if(response){
                    response = JSON.parse(response);
                    $('#fterv_szalloda').html(response.telephely_select);
                    if(response.munkakozi=='0'){
                        $('#kijelolt_alapjan').removeClass('dn');
                    }
                    $('#'+response.focus).addClass('hibas_ide_focus');
                }
            },
            complete: function(xhr) {
                if( xhr.status != 200 ) {
                    alert2(xhr.responseText, '', 'Hiba');
                }
            }
        });
        
    });
    
    function terv_keszit( kijelolt ){
        
        $('#popup_telephely').removeClass('hibas_ide_focus');
        $('#popup_ev').removeClass('hibas_ide_focus');
        
        $.ajax({
            url : 'fenntartasi_terv.php',
            type: 'POST',
            data: {
                recid       : _get('id'),
                kijelolt    : kijelolt,
                telephely   : $('#popup_telephely').val(),
                ev          : $('#popup_ev').val(),
                terv_keszit : Date.now()
            },
            success: function(response) {
                if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
                response = JSON.parse(response);
                if( response.hiba ) {
                    alert2(response.hiba, response.gomb, response.title);
                    $('#'+response.focus).addClass('hibas_ide_focus');
                    return false;
                }else{
                    if(response.uzenet){
                        alert2(response.uzenet, '<input type="button" class="gomb" value="Ok" onclick="szurkit(); location.href=\'fenntartasi_terv.php?modosit&id='+response.id+'\'">', 'Üzenet');
                    }else{
                        szurkit();
                        location.href='fenntartasi_terv.php?modosit&id='+response.id;
                    }
                }
            },
            complete: function(xhr) {
                if( xhr.status != 200 ) {
                    alert2(xhr.responseText, '', 'Hiba');
                }
            }
        });
        
    }
    
    /* Az egységára fülre lépünk */
    function egysegar_fulre_lep(){
        szamlaBetolt(_get('id'), 'fenntartasi_terv.php', 'egysegarak');
    }
</script>
