<h2>Javaslattétel</h2>
<form action="" id="munkalapKulso" class="popupForm dn" method="post" onsubmit="return false;">
    <div class="kozep" style="min-height: 30rem">

        <strong>Válasszon külső kivitelezőt:</strong>
        <br><input type="text" style="margin: 0.2rem 0 0.8rem 0" autocomplete="off" class="oriasi disableNav csillag" name="pop_szallito_id_autocomp" id="pop_szallito_id_autocomp" onblur="if(!$(this).val()){ $('#szallito_id').val(''); }" value="">
        <input type="hidden" name="pop_szallito_id" id="pop_szallito_id" value="">
        <script>
             $(document).ready(function() {
                 $('#pop_szallito_id_autocomp').autocomplete({
                     'php_fajl'         : '../autocomplete.php',
                     'tabla'            : 'szallito',
                     'oszlop_keres'     : 'nev',
                     'oszlop_listaz'    : 'nev',
                     'rkat'             : 0,
                     'csoport'          : 0,
                     'id_kiir'          : 'id'
                 });
            });
        </script>

        <br><strong>Jóváhagyott érték:</strong>
        <br><input type="text" style="margin: 0.2rem 0 0.8rem 0" autocomplete="off" data-tort="0" class="oriasi disableNav csillag f_num" name="pop_jh_ert" id="pop_jh_ert"> Ft + Áfa

        <br><strong>Becsült érték:</strong>
        <div class="cb">
        	<input type="checkbox" class="check" name="pop_becsult_ertek" id="pop_becsult_ertek">
        	<label for="pop_becsult_ertek"></label>
        </div><br>

        <br><strong>Várható érkezés:</strong>
        <br><input type="text" style="margin: 0.2rem 0 0.8rem 0" autocomplete="off" class="datetimepicker pop_datetimepicker" name="pop_varh_erk" id="pop_varh_erk">

        <script>
        $(document).ready(function(){
            $('.pop_datetimepicker').datetimepicker({
                closeOnDateSelect   : false,
                format              :'Y.m.d H:i',
                mask                : '\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0\xa0\xa0:\xa0\xa0',
                timepicker          : true,
                step                : 60,
                validateOnBlur      : false,
                scrollInput         : false,
                defaultTime         : '08:00',
                minDate             : 0,
                onChangeDateTime    : function(dp, $input){
                    /* Órapontosak vagyunk */
                    $input.val( $input.val().substring(0, 14)+'00' );
                }
            });
        });
        </script>

        <br><strong>Dokumentumok hozzáadása:</strong>
        <div id="jsff_javaslattetel_popup" class="jsff">
            <span class="uzenet">
                <span class="f15">Húzza ide a fájlokat</span>
                <br>vagy tallózza be az alábbi gombbal:
            </span>
            <span class="hiba"></span>
            <br>
            <div class="talloz">
                <div>
                    <span>Tallózás</span> <input type="file" name="files[]" multiple="" onchange="beolvasas_javaslattetel_popup(this.files, false);">
                </div>
            </div>
        </div>
        <ul id="feltoltott_fajl" data-tabla="munkalap_dok" data-mellek="dokumentumok"></ul>

        <script>
        var jsff_javaslattetel_popup = document.getElementById('jsff_javaslattetel_popup'),
            tests_javaslattetel_popup = {
                filereader  : typeof FileReader != 'undefined',
                dnd         : 'draggable' in document.createElement('span'),
                formdata    : !!window.FormData,
                progress    : 'upload' in new XMLHttpRequest
            },
            kepformatumok_javaslattetel_popup = {
                'image/png' : true,
                'image/jpeg': true,
                'image/gif' : true
            };

        /* Előnézet */
        function elonezet_javaslattetel_popup(file){

            /* Ha van filereader, és képelemről van szó, akkor készítünk egy thumbnailt */
            if (tests_javaslattetel_popup.filereader === true && kepformatumok_javaslattetel_popup[file.type] === true) {
                var reader = new FileReader();
                reader.onload = function (event) {
                    var image   = new Image();
                    image.src   = event.target.result;
                    jsff_javaslattetel_popup.appendChild(image);
                };
                reader.readAsDataURL(file);

            /* Egyébként csak egy sort írunk */
            }else{
                jsff_javaslattetel_popup.innerHTML += 'Feltöltve ' + file.name + ' ' + (file.size ? (file.size/1024|0) + 'K' : '') + '<br>';
            }

        }

        /* Beolvasás */
        function beolvasas_javaslattetel_popup(fajlok, ellenorzes_kihagy) {

            var voltmar = [];

            var formData        = tests_javaslattetel_popup.formdata ? new FormData() : null;
            var fajlok_kesz     = 0;

            for (var i = 0; i < fajlok.length; i++){

                formData.append('file', fajlok[i]);
                /* Kép megjelenítése egyből: */
                /*elonezet_javaslattetel_popup(fajlok[i]);*/

                fajl = fajlok[i];

                var progress_id = 'jsff_javaslattetel_popup_' + i;
                var pg = $('<progress id="'+progress_id+'" min="0" max="100" value="0">0</progress>');
                $('#jsff_javaslattetel_popup').append(pg);

                var xhr = new XMLHttpRequest();
                xhr.open('POST', 'tobb_kep.php');

                (function(progress_id, fajl, i){
                    xhr.upload.onprogress = function(e){
                        var percent = parseInt(e.loaded / e.total * 100);
                        $('#' + progress_id).val(percent);
                    };
                    xhr.onload = function(){
                        fajlok_kesz++;
                        $('#' + progress_id).val(100);
                        $('#' + progress_id).fadeOut(2000, function(){ $('#' + progress_id).next('br').remove(); });

                        if( this.responseText == 'frissit' ) {
                            if(fajlok_kesz == fajlok.length) {
                                szamlaBetolt(_get('id'), 'munkalap.php', 'dokumentumok');
                                $('#jsff_javaslattetel_popup progress').hide();
                            }
                        } else {
                            if(this.responseText.substring(0,5)=='Hiba!') {
                                if( this.responseText.substring(5) == 'A fájl létezik!' ) {
                                    voltmar[i] = fajl;
                                } else {
                                    alert2(this.responseText.substring(5), '', 'Hiba');
                                }
                            }else{
                                $('#feltoltott_fajl').append(this.responseText);
                                $('#jsff_javaslattetel_popup progress').hide();
                                if (fajlok_kesz == fajlok.length){
                                    minden_fajl_kesz_javaslattetel_popup();
                                }
                            }

                            if(fajlok_kesz == fajlok.length){
                                if( voltmar.length ) {
                                    fajl_feluliras_alert_javaslattetel_popup(voltmar);
                                    $('#jsff_javaslattetel_popup progress').hide();
                                }
                            }
                        }
                    };
                }(progress_id, fajl, i));

                var parameterek = {'megnevezes':'javaslattetel_popup', 'konyvtar' : 'munkalap', 'tabla':'munkalap_dok', 'oszlop' : 'munkalap_id', 'sorid':_get('id')};
                $.each(parameterek, function(kulcs, ertek){
                    formData.append(kulcs, ertek);
                });

                formData.append('ellenorzes_kihagy', ellenorzes_kihagy);

                xhr.send(formData);

            }

            if( ellenorzes_kihagy ) {
                alert2('');
            }
        }
        felulirando_fajlok = false;
        function fajl_feluliras_alert_javaslattetel_popup(tomb) {
            if( tomb ) {
                nevek = 'A következő fájlok már léteznek, felülírja őket?';
                for (var i = 0; i < tomb.length; i++){
                    nevek += '<p>' + tomb[i].name + '</p>';
                }
                
                $('#jsff_javaslattetel_popup progress').hide();

                felulirando_fajlok = tomb;
                alert2(nevek, '<input class="gomb zold" value="Igen" onclick="fajl_feluliras_javaslattetel_popup();" type="button"><input class="gomb piros" value="Nem" onclick="alert2()" type="button">', 'Hiba');
            }
        }

        function fajl_feluliras_javaslattetel_popup() {
            beolvasas_javaslattetel_popup(felulirando_fajlok, true);

            felulirando_fajlok = false;
        }

        /* Ha minden fájl feltöltése kész, akkor itt adhat meg további utasítás */
        function minden_fajl_kesz_javaslattetel_popup(){

            $('#jsff_javaslattetel_popup').find('progress').fadeOut(2000, function(){ $('#' + progress_id).next('br').remove(); });

        }

        /* Ha működik a drag&drop, akkor a CSS class-t megváltoztatjuk draghoverre */
        if(tests_javaslattetel_popup.dnd){

            jsff_javaslattetel_popup.ondragover = function(){
                this.className = 'jsff hover';
                return false;
            };

            jsff_javaslattetel_popup.ondragleave = function(){
                this.className = 'jsff';
                return false;
            };

            jsff_javaslattetel_popup.ondrop = function(e){
                this.className = 'jsff';
                e.preventDefault();
                beolvasas_javaslattetel_popup(e.dataTransfer.files, false);
            };

        }
        </script>

    </div>
    <div class="kuldes">
        <input type="button" name="elkuld" class="gomb zold" value="Mentés" onclick="kulsokivHozzarend()">
        <input type="button" name="megsem" class="gomb piros" value="Mégsem" onclick="popupZar();">
    </div>
</form>

<div class="kozep dn f16 b" id="mar_volt_kerdes" style="line-height: 2.3rem">

</div>
<script>
/* A popup tartalma nem biztos, hogy megjelenik, mert lehet, hogy adott munkalap volt már korábban Döntésre vár státuszban, és ekkor előbb kérdezünk. */
$(document).ready(function(){
    $.ajax({
        url : 'munkalap.php',
        type: 'POST',
        data: {
            recid                   : _get('id'),
            volt_mar_dontesre_var   : Date.now()
        },
        success: function(response){
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if(response){
                response = JSON.parse(response);

                if(response.mehet){
                    $('#munkalapKulso').show();
                }
                if(response.kerdes){
                    $('#mar_volt_kerdes').html(response.kerdes);
                    $('#mar_volt_kerdes').show();
                }
            }
        }
    });
});

/* Külső kivitelező hozzárendelése */
function kulsokivHozzarend() {

    $.ajax({
        url : 'munkalap.php',
        type: 'POST',
        data: {
            recid            : _get('id'),
            validate         : 'false',
            szallito_id      : $('#pop_szallito_id').val(),
            jh_ert           : $('#pop_jh_ert').val(),
            varh_erk         : $('#pop_varh_erk').val(),
            becsult_ertek    : $('#pop_becsult_ertek').prop('checked'),
            javaslattetel    : 1,
            kulsokivHozzarend: new Date().getTime()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if(response) {
                response = JSON.parse(response);

                if( response.hiba ) {
                    alert2(response.hiba, response.gomb, response.title);
                    return false;
                }

                szamlaBetolt(_get('id'), baseName(location.href) + '.php', 'modosit');
                popupZar();
            }
        }
    });

    return false;
}
</script>
