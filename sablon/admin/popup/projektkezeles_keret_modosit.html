<h2>Projekt keret módosítás</h2>
<form class="popupForm" method="post" onsubmit="return projektkezeles_keret_modosit();">
    <div class="kozep b">
        <div id="keret_modosit_felirat"></div>
        <div class="dt">
            <div class="dtr">
                <div class="dtc form_bal">Új keret:</div>
                <div class="dtc form_jobb">
                    <input type="text" autocomplete="off" class="oriasi f_num csillag nincs_tobb_blurozas" data-tort="0" name="popup_jkolt" id="popup_jkolt" style="width: 10rem;"> Ft
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
    </div>
</form>
<script>
$(document).ready(function(){
    $.ajax({
        url : 'projektkezeles.php',
        type: 'POST',
        data: {
            recid               : _get('id'),
            jkotl_is            : 1,
            get_projektkezeles  : Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            $('#keret_modosit_felirat').html(response);
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
});

/* Projekt keret módosítás */
function projektkezeles_keret_modosit(){
    
    $.ajax({
        url : 'projektkezeles.php',
        type: 'POST',
        data: {
            recid                       : _get('id'),
            popup_jkolt                 : $('#popup_jkolt').val(),
            projektkezeles_keret_modosit: Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);
                if(response.hiba){
                    alert2(response.hiba, response.gomb, response.title);
                    $('#'+response.focus).addClass('hibas_ide_focus');
                    return false;
                }
                popupZar();
                szamlaBetolt(_get('id'), PHP_SELF, 'modosit');
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
    
    return false;
}
</script>
