<h2>Szerződés tételek kezelése</h2>

<div class="kozep">
    <div class="grid2o" style="width: 28rem">
        <div class="b">Szerződés összege:</div>
        <div class="b r"><span id="pop_szerz_ossz"></span></div>
        <div class="b">Tételek összege:</div>
        <div class="b r"><span id="pop_tetelek_ossz"></span></div>
        <div class="b">Különbség:</div>
        <div class="b r"><span id="pop_kulonbseg"></span></div>
    </div>
    
    <br>Tárgy:
    <br><input type="text" id="pop_targy" class="oriasi csillag">
    <br>Számla várh. érk.
    <br><input type="text" id="pop_szla_varh_erk" class="datepicker_matol csillag">
    <br>Számla várh. értéke:
    <br><input type="text" id="pop_szla_varh_ert" class="f_num csillag" data-tort="0"> <span class="f_penznem"></span>
    <br>Teljesítés:
    <br><input type="text" disabled>
    <br>Érték:
    <br><input type="text" disabled class="f_num" data-tort="0"> <span class="f_penznem"></span>
    <br><input type="button" class="gomb" value="Új tétel hozzáadása" style="margin-top: 0.3rem" onclick="tetel_hozzaadasa()">
    
    <form action="" enctype="multipart/form-data" method="" id="popup_tetel_sorok">
        <table class="csikos kijCont dn" id="pop_tetelek" style="cursor: default;">
            <thead>
            <tr>
                <th class="l" style="width: 18rem">Tárgy</th>
                <th>Számla várh. érk.</th>
                <th style="width: 10rem">Számla várh. értéke (<span class="f_penznem"></span>)</th>
                <th>Teljesítés</th>
                <th>Nettó érték (<span class="f_penznem"></span>)</th>
                <th>Törlés</th>
            </tr>
            </thead>

            <tbody>
            </tbody>
        </table>
    </form>
    
</div>
<div class="kuldes">
    <input type="button" class="gomb zold" value="Mentés" onclick="tetel_sorok_ment()">
    <input type="button" class="gomb piros escapes_megsem" value="Mégsem" onclick="popupZar();">
</div>
<script>
var akt_penznem = $('#kcs_21_autocomp').val();
if( !akt_penznem ) {
    akt_penznem = $('#kcs_21_autocomp_db').val();
}

var kcs_21 = $('#kcs_21').val();
if( !kcs_21 ) {
    kcs_21 = $('#kcs_21_db').val();
}

$(document).ready(function () {

    /* f_penznem class-ú elemek lecserélése a pénznemre */
    $('.f_penznem').each(function () {
        $(this).replaceWith(akt_penznem);
    });
    
    $('#pop_targy').focus();
    
    pop_tetelek_feltolt();
    
    /* datepicker_matol felkonfigolása */
    $('.datepicker_matol').datetimepicker({
        closeOnDateSelect   : true,
        format              :'Y.m.d',
        mask                : '\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0',
        timepicker          : false,
        validateOnBlur      : false,
        scrollInput         : false,
        minDate             : '-1970/01/02'
    });
});

/* Tételt hozzáadó függvény */
function tetel_hozzaadasa() {
    
    var targy           = $('#pop_targy').val().trim();
    var szla_varh_erk   = $('#pop_szla_varh_erk').val().trim();
    var szla_varh_ert   = $('#pop_szla_varh_ert').val().trim();

    /* Üres adatok ellenőrzése */
    if( !targy ) {
        alert2('Kérem töltse ki a tárgyat!', '', 'Hiba');
        $('#pop_targy').addClass('hibas_ide_focus');
        return false;
    }
    if( !szla_varh_erk || szla_varh_erk=='.\xa0\xa0.' ) {
        alert2('Kérem töltse ki a várható érkezést!', '', 'Hiba');
        $('#pop_szla_varh_erk').addClass('hibas_ide_focus');
        return false;
    }

    /* Valós dátum-e? */
    if( !valid_date($('#pop_szla_varh_erk'), 'true-val térj vissza') ){
        alert2('Kérem valós dátumot adjon meg várható érkezésnek!', '<input type="button" value="Ok" class="gomb escapes_megsem" onclick="alert2()">', 'Hiba');
        $('#pop_szla_varh_erk').addClass('hibas_ide_focus');
        return false;
    }
    
    /* Nem múltbeli dátum-e? */
    var datum = new Date().toISOString();
    datum = datum.substring(0, 10).replace(/-/g, '.');
    if( $('#pop_szla_varh_erk').val() < datum ) {
        alert2('A várható érkezés nem lehet múltbeli dátum!', '<input type="button" value="Ok" class="gomb escapes_megsem" onclick="alert2()">', 'Hiba');
        $('#pop_szla_varh_erk').addClass('hibas_ide_focus');
        return false;
    }
    
    /* Várható érték ha üres - 0 lehet! */
    if( !szla_varh_ert /*|| szla_varh_ert=='0' || szla_varh_ert=='0,00'*/ ){
        alert2('Kérem töltse ki a várható értéket!', '', 'Hiba');
        $('#pop_szla_varh_ert').addClass('hibas_ide_focus');
        return false;
    }
    
    /* Várható érték nem lehet negatív */
    /* De lehet!
     * if( Number(szla_varh_ert.replace(/ /g, '').replace(/,/g, '.'))<0 ){
        alert2('A számla várható értéke nem lehet 0 vagy ettől kisebb!', '', 'Hiba');
        $('#pop_szla_varh_ert').addClass('hibas_ide_focus');
        return false;
    }*/
    
    var id_tmp = new Date().getTime();

    var table_sor = '<tr class="pop_tetel_'+id_tmp+'">' +
                        '<td class="pop_targy l">' + targy + '</td>' +
                        '<td class="pop_varh_erk">' + szla_varh_erk + '</td>' +
                        '<td class="pop_varh_ert r">' + szla_varh_ert + '</td>' +
                        '<td></td>' +
                        '<td></td>' +
                        '<td><a onclick="popup_tetel_sor_torol(\'pop_tetel_'+id_tmp+'\');"><span class="icon"><i class="material-icons">delete</i></span></a></td>' +
                    '</tr>';
            
    $('#pop_tetelek tbody').append( table_sor );
    $('#pop_tetelek').removeClass('dn');
    
    $('#pop_targy').val('');
    $('#pop_szla_varh_erk').val('\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0');
    $('#pop_szla_varh_ert').val('');
    
    tetelek_kiszamol();
    
    $('#pop_targy').focus();
}

/* Tétel sor törlése */
function popup_tetel_sor_torol(sor_id, mehet) {
    
    $('.'+sor_id).addClass('torles_elott');
    if( !mehet ) {
        alert2( 'Tárgy: '       + $('.'+sor_id+' .pop_targy')   .html() +'<br>' +
                'Várh. érk.: '  + $('.'+sor_id+' .pop_varh_erk').html() +'<br>' +
                'Várh. ért.: '  + $('.'+sor_id+' .pop_varh_ert').html() +' ' + akt_penznem + '<br>' +
                'Biztosan törli a szerződés tételt?', '<input type="button" class="gomb zold" value="Igen" onclick="popup_tetel_sor_torol(\''+sor_id+'\', \'mehet\'); alert2();"><input type="button" class="gomb piros escapes_megsem" value="Nem" onclick="alert2(); $(\'.torles_elott\').removeClass(\'torles_elott\');">');
        return false;
    }
    
    /* Sor törlése, újraszámolás */
    $('.'+sor_id).fadeOut('slow', function(){
        $('.'+sor_id).remove();
        tetelek_kiszamol();
    });
    
    $('#pop_targy').focus();
}

/* Tétel sor táblázat mentése */
function tetel_sorok_ment() {

    var recidk = [];
    $('.pop_recid').each(function() {
        recidk.push( $(this).html() );
    });
    var targyak = [];
    $('.pop_targy').each(function() {
        targyak.push( $(this).html().replace(/"/g, '{IDEZOJEL}') );
    });
    var varh_erk = [];
    $('.pop_varh_erk').each(function() {
        varh_erk.push( $(this).html() );
    });
    var varh_ert = [];
    $('.pop_varh_ert').each(function() {
        varh_ert.push( $(this).html() );
    });

    var adatok = [
                    ['recidk',   recidk],
                    ['targyak',  targyak],
                    ['varh_erk', varh_erk],
                    ['varh_ert', varh_ert]
                ];
    
    /* A szerződése összege az Adatlapon található mező értéke 
     * De ha nem az adatlapon vagyunk, akkor meg egy rejtett inputban megtaláljuk, hogy a DB-ben mi van letárolva */
    var osszeg_mezo = 'szerz_ossz';
    if( akt_penznem && akt_penznem != 'HUF' ) {
        osszeg_mezo = 'dev_net';
    }
    
    if( $('#'+osszeg_mezo).length ) {
        szerzodes_osszege = $('#'+osszeg_mezo).val().replace(/ /g, '').replace(/,/g, '.');
    }else{
        szerzodes_osszege = $('#szerz_ossz_mindig_latszik').val().replace(/ /g, '').replace(/,/g, '.');
    }
    
    $.ajax({
        url     : 'projektszerzodes.php',
        type    : 'POST',
        data: {
            adatok              : JSON.stringify(adatok),
            recid               : _get('id'),
            kcs_21              : kcs_21,
            szerzodes_osszege   : szerzodes_osszege,
            tetel_sorok_ment    : Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);
                if( response.hiba ) {
                    alert2(response.hiba, response.gomb, response.title);
                } else {
                    popupZar();
                }
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });

}

/* Ha van SESSION-ban adatunk, akkor abból töltsük fel a sorokat */
function pop_tetelek_feltolt() {
    
    $.ajax({
        url : 'projektszerzodes.php',
        type: 'POST',
        data: {
            kcs_21              : kcs_21,
            pop_tetelek_feltolt : Date.now() 
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);
                if(response.html){
                    $('#pop_tetelek tbody').append(response.html);
                    $('#pop_tetelek').removeClass('dn');
                }
                tetelek_kiszamol();
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
}

/*  Tételek kiszámítása, lássuk hol járunk a szerződéses összeghez képest */
function tetelek_kiszamol() {
    
    /* HUF esetén nem törtet írunk ki, deviza esetén viszont törtet + "Számla várh. értéke" mező is törté kell alakítani */
    var osszeg_mezo = 'szerz_ossz';
    var tizedesek   = 0;
    if( akt_penznem && akt_penznem != 'HUF' ) {
        osszeg_mezo = 'dev_net';
        tizedesek   = 2;
        $('#pop_szla_varh_ert').attr('data-tort', '2');
    }
    
    if( $('#'+osszeg_mezo).length ) {
        szerzodes_osszege = $('#'+osszeg_mezo).val().replace(/ /g, '').replace(/,/g, '.');
    }else{
        szerzodes_osszege = $('#szerz_ossz_mindig_latszik').val().replace(/ /g, '').replace(/,/g, '.');
    }
    
    $('#pop_szerz_ossz').html( ezresek(szerzodes_osszege, tizedesek, ',', ' ')+' '+akt_penznem );
    
    tetelek_ossz = 0;
    $('.pop_varh_ert').each(function() {
        tetelek_ossz += Number( $(this).html().replace(/ /g, '').replace(/,/g, '.') );
    });
    $('#pop_tetelek_ossz').html( ezresek(tetelek_ossz, tizedesek, ',', ' ')+' '+akt_penznem );

    kulonbseg = Number(szerzodes_osszege) - Number(tetelek_ossz);
    if( !kulonbseg ) {
        kulonbseg = '0';
    }
    $('#pop_kulonbseg').html( ezresek(kulonbseg, tizedesek, ',', ' ')+' '+akt_penznem );
    $('#pop_kulonbseg').removeClass('piros');
    if( kulonbseg!=0 && kulonbseg!='0,00' ) {
        $('#pop_kulonbseg').addClass('piros');
    }
}


</script>
