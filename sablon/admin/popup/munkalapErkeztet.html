<h2>Anyag rendelkezésre áll</h2>

<div class="kozep">
    <div class="dt">
        <div class="dtr"> 
            <div class="dtc form_bal">Iktatószám:</div>
            <div class="dtc form_jobb">
                <input type="text" name="pop_ikt_szam" id="pop_ikt_szam" readonly>
                <input type="hidden" name="pop_recid" id="pop_recid" readonly>
            </div>
        </div>
        <div class="dtr">
            <div class="dtc form_bal">Szálloda:</div>
            <div class="dtc form_jobb">
                <input type="text" name="pop_telephely" id="pop_telephely" readonly>
            </div>
        </div>
    </div>

    <div id="pop_tablazat"></div>
</div>

<div class="kuldes" id="pop_gombok"></div>
<script>
    
	function munkalapErkeztetMent(mod) {

        idk = {};

        i = 0;
        $('.pop_cbok').each(function() {
            if( $(this).prop('checked') ) {
                idk[i] = $(this).attr('data-recid');
                i++;
            }
        });

        szurkit();
        $.ajax({
            url : 'munkalap.php',
            type: 'POST',
            data: {
                idk                  : JSON.stringify(idk),
                mod                  : mod,
                munkalapErkeztetMent : new Date().getTime()
            },
            success: function(response) {
                if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
                if( response ) {
                    response = JSON.parse(response);
                    if( response.hiba ) {
                        alert2(response.hiba, response.gomb, response.title);
                        szurkit_zar();
                        return false;
                    }
                }
                szurkit();
                location.reload();

            },
            complete: function(xhr) {
                if( xhr.status != 200 ) {
                    alert2(xhr.responseText, '', 'Hiba');
                }
            }
        });
    }
</script>
