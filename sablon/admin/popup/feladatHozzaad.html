<h2>Feladat hozzáadása</h2>
<form action="" id="elvegzettFeladatForm" class="popupForm" method="post">
    <div class="kozep">
        <div class="dt">
            <div class="dtr"> 
                <div class="dtc form_bal">Elvégzett feladat:</div>
                <div class="dtc form_jobb">
                    <input type="text" autocomplete="off" class="oriasi disableNav csillag focus" name="erteklista_id_autocomp" id="erteklista_id_autocomp" onblur="if(!$(this).val()){ $('#erteklista_id').val(''); }" value="">
                    <input type="hidden" name="erteklista_id" id="erteklista_id" value="">
                    <script>
                        $(document).ready(function() {
                            $('#erteklista_id_autocomp').autocomplete({
                                'php_fajl'      : '../autocomplete.php',
                                'tabla'         : 'erteklista',
                                'oszlop_keres'  : 'info',
                                'oszlop_listaz' : 'info',
                                'rkat'          : 0,
                                'csoport'       : 5,
                                'id_kiir'       : 'id'
                            });
                        });
                    </script>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Feladat leírása:</div>
                <div class="dtc form_jobb">
                    <textarea name="feladat_memo" id="feladat_memo"></textarea>
                </div>
            </div>
        </div>
        <div id="insertTable">
            <table class="csikos">
                <tr>
                    <th>Elvégzett feladat</th>
                    <th>Leírás</th>
                    <th class="torles"></th>
                </tr>
            </table>
        </div>
        <p>Hozzáadja az elvégzett feladatot a munkalaptételhez?</p>
    </div>
    <div class="kuldes">
        <input type="button" class="gomb zold" value="Igen" onclick="feladatHozzaadas();">
        <input type="button" class="gomb piros" value="Nem" onclick="popupZar();" id="nem_gomb">
    </div>
</form>
<script>
    
/* Nem gombon tabozva a feladat inputra érkezzünk vissza */
$(document).on('keydown', '#nem_gomb', function(event) {
    if( event.keyCode == KEY_TAB ) {
        $('#erteklista_id_autocomp').focus();
        return false;
    }
});
    
/* Feladat hozzáadása */
function feladatHozzaadas() {

    if(balnav_kijelol_ell()){

        var erteklista_id = $('#erteklista_id'),
                     memo = $('#feladat_memo');

        if( erteklista_id ) {
            $.ajax({
                url : 'munkalap.php',
                type: 'POST',
                data: {
                    recid           : _get('id'),
                    erteklista_id   : erteklista_id.val(),
                    memo            : memo.val(),
                    feladatHozzaadas: new Date().getTime()
                },
                success: function(response) {
                    if(response) {
                        response = JSON.parse(response);

                        if( response.hiba ) {
                            alert2(response.hiba, response.gomb, response.title);
                            $('#erteklista_id_autocomp').addClass('hibas_ide_focus');
                            return false;
                        }

                        szamlaBetolt(_get('id'), baseName(location.href) + '.php', 'tetel');
                        popupZar();
                    }
                }
            });
        } else {
            alert2('Adja meg az elvégzett munkát!', '', 'Hiba');
            $('#erteklista_id_autocomp').addClass('hibas_ide_focus');
        }
    }
    return false;
}
</script>
