<h2>Igénylés jóváhagyása</h2>
<form class="popupForm" method="post" onsubmit="szak_beleegyezes_inditas(); return false;">
    <div class="kozep">
        <div class="dt">
            <div class="dtr">
                <div class="dtc form_bal">Szálloda:</div>
                <div class="dtc form_jobb">
                    <div id="popup_telephely"></div>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Termék megnevezés:</div>
                <div class="dtc form_jobb">
                    <div id="popup_nev"></div>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Igényelt nettó érték:</div>
                <div class="dtc form_jobb">
                    <div id="popup_ossz_netto"></div>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Indoklás:</div>
                <div class="dtc form_jobb">
                    <textarea id="popup_szak_indok" onkeyup="if( $(this).val().trim()=='' ){ $(this).val(''); }"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
    </div>
</form>
<script>
$(document).ready(function(){

    var akt_id = _get('id');

    if( $('#telephely_id').length ) {
        $('#popup_telephely').html( $('#telephely_id option:selected').text() );
    } else {
        $('#popup_telephely').html( $('#telephely_nev_db_'+akt_id).val() );
    }
    if( $('#nev').length ) {
        $('#popup_nev').html( $('#nev').val() );
    } else {
        $('#popup_nev').html( $('#nev_db_'+akt_id).val() );
    }
    if( $('#ossz_netto').length ) {
        $('#popup_ossz_netto').html( $('#ossz_netto').val() + ' Ft' );
    } else {
        $('#popup_ossz_netto').html( $('#ossz_netto_db_'+akt_id).val() + ' Ft' );
    }
    
    // Mégse kerüljön be az indoklás mezőbe az adatbázis értéke, logolós működés kell ide
    // $('#popup_szak_indok').val( $('#szak_indok_db_'+akt_id).val().replace(/<br\s*\/?>/g, '\n') );
    $('#popup_szak_indok').select();

});

// A tényleges jóváhagyás előtt rákérdezünk, ha vannak tételek, hányat hagy jóvá velük együtt
function szak_beleegyezes_inditas() {

    var akt_id   = _get('id');
    var tetel_db = Number($('#tetel_db_'+akt_id).val()) || 0;

    if( tetel_db > 0 ) {
        var tetel_jh_db = Number($('#tetel_jh_db_'+akt_id).val()) || 0;
        alert2(tetel_jh_db+'/'+tetel_db+' db tétel jóváhagyására készül. Folytatja?', '<input type="button" class="gomb zold" value="Igen" onclick="szak_beleegyezes();"><input type="button" class="gomb piros" value="Nem" onclick="alert2();">', 'Kérdés');
        return false;
    }

    szak_beleegyezes();
}

// Szakmai vezetés jóváhagy
function szak_beleegyezes(mehet) {

    // globális változók frissítése az adott adatlap alapján
    eszkoz_valtozok_update();

    // Ez korábban csak egy sima alertes kérdés volt, most már popup, emiatt nem kell megerősítő kérdés
    // if( !mehet ) {
    //     alert2('Biztosan mehet felsővezetői jóváhagyásra az igénylés?', '<input type="button" class="gomb zold enter" value="Igen" onclick="szak_beleegyezes(\'-mehet-\')"> <input type="button" class="gomb piros" value="Nem" onclick="alert2()">', 'Kérdés');
    //     return false;
    // }

    $.ajax({
        url : PHP_SELF+eszkoz_url_kieg,
        type: 'POST',
        data: {
            id              : eszkoz_id,
            indok           : $('#popup_szak_indok').val(),
            szak_beleegyezes: Date.now()
        },
        success: function (response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if (response) {
                response = JSON.parse(response);
                if (response.hiba) {
                    alert2(response.hiba, response.gomb, response.title);
                    return false;
                }

                popupZar();

                // Táblázat alatt a sort frissítjük
                if( isset_get('tablazat') ) {
                    $('.szak_vel_'      +eszkoz_id  ).html(response.pipa     );
                    $('.stat_'          +eszkoz_id  ).html(response.statusz  );
                    $('#szak_indok_db_' +eszkoz_id  ).val ('');
                    $('.gombok_'        +eszkoz_id  ).html(response.gombok   );

                    // Megjegyzések számát is, mert ha volt értesítés küldés, akkor bővülhetett
                    $('.gombok_'        +eszkoz_id  ).data('megj_db', response.megj_db    );
                    // Fülön is
                    let megj_ful_txt = 'Megjegyzések';
                    if( response.megj_db>0 ) {
                        megj_ful_txt = 'Megjegyzések ('+response.megj_db+')';
                    }
                    $('#szamlaFulek a[data-oldal="megjegyzesek"]').html(megj_ful_txt);

                    // Ha a mehet a '-tervezett-' igénylés miatt volt kitöltve, akkor lépünk a következő sorra. 
                    if( response.naviKov ) {
                        // Ilyet mégsem kérnek
                        // naviKov();
                    }

                    // Tényleges gombokat is cserélni kell
                    $('.muveletek').html(response.gombok   );
                
                // Egyébként az adatlapot töltsük be
                } else {

                    let ful   = '';
                    eszkoz_fulek.forEach(function(akt_ful) {
                        if( isset_get(akt_ful) ) {
                            ful = akt_ful;
                            return;
                        }
                    });

                    szamlaBetolt(_get('id'), baseName(location.href) + '.php', ful);

                    // Ha a mehet a '-tervezett-' igénylés miatt volt kitöltve, akkor lépünk a következő sorra. 
                    if( response.naviKov ) {
                        setTimeout(function(){
                            // Ilyet mégsem kérnek
                            // naviKov();
                        }, 1000);
                    }

                }
            }
        },
        complete: function (xhr) {
            if (xhr.status != 200) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
}
</script>
