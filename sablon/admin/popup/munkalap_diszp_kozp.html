<h2>Diszp. központ vezetőnek</h2>
<form action="" class="popupForm" method="post" onsubmit="return munkalapDiszpKozp();">
    <div class="kozep" style="min-height: 20rem">
        <div class="dt">
            <div class="dtr"> 
                <div class="dtc form_bal">Törzsadat:</div>
                <div class="dtc form_jobb">
                    <input type="text" autocomplete="off" class="oriasi disableNav csillag" name="torzsadat_id_autocomp" id="torzsadat_id_autocomp" onblur="if(!$(this).val()){ $('#torzsadat_id').val(''); }" value="">
                    <input type="hidden" name="torzsadat_id" id="torzsadat_id" value="">
                    <script>
                        $(document).ready(function() {
                            $('#torzsadat_id_autocomp').autocomplete({
                                'php_fajl'      : '../autocomplete.php',
                                'tabla'         : 'torzsadat',
                                'oszlop_keres'  : 'nev',
                                'oszlop_listaz' : 'nev',
                                'rkat'          : 0,
                                'csoport'       : 0,
                                'id_kiir'       : 'recid'
                            });
                        });
                    </script>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
    </div>
</form>
<script>
function munkalapDiszpKozp() {
    if(balnav_kijelol_ell()){
        $.ajax({
            url : 'munkalap.php',
            type: 'POST',
            data: {
                recid               : _get('id'),
                munkalapDiszpKozp   : new Date().getTime()
            },
            success: function(response) {
                if(response) {
                    response = JSON.parse(response);

                    if( response.hiba ) {
                        alert2(response.hiba, response.gomb, response.title);
                        return false;
                    }

                    szamlaBetolt(_get('id'), baseName(location.href) + '.php', 'modosit');
                    popupZar();
                }
            }
        });
    }

    return false;
}
</script>
