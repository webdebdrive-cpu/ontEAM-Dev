<h2>Munkalap hozzáadása projekthez</h2>
<form class="popupForm" method="post" onsubmit="return munkalap_hozzaad();">
    <div class="kozep">
        <div id="popup_ml_tablazat"></div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Kiválaszt">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
    </div>
</form>
<script>
$(document).ready(function(){
    $.ajax({
        url : 'projektkezeles.php',
        type: 'POST',
        data: {
            recid       : _get('id'),
            get_ml_ok   : Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            response = JSON.parse(response);
            if( response.hiba ) {
                alert2(response.hiba, response.gomb, response.title);
                return false;
            }
            $('#popup_ml_tablazat').html(response.tablazat);
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
});

/* Munkalap hozzáadása */
function munkalap_hozzaad() {
    
    if( !$('#popup_ml_tablazat tr.kijelolve').length ) {
        alert2('Előbb válasszon ki egy munkalapot!', '', 'Hiba');
        return false;
    }
    
    $.ajax({
        url : 'projektkezeles.php',
        type: 'POST',
        data: {
            recid           : _get('id'),
            ml_id           : $('#popup_ml_tablazat tr.kijelolve').attr('data-recid'),
            munkalap_hozzaad: Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);
                if( response.hiba ) {
                    alert2(response.hiba, response.gomb, response.title);
                    return false;
                }
                popupZar();
                szamlaBetolt(_get('id'), PHP_SELF, 'munkalapok');
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
    
    return false;
}

function tabla_szur(tabla, kulcs, oszlop) {
    var $rows = tabla.find('tr');
    var val = $.trim(kulcs).replace(/ +/g, ' ').toLowerCase();

    $rows.show().filter(function() {
        var text = $(this).find('td:nth-of-type('+oszlop+')').text().replace(/\s+/g, ' ').toLowerCase();
        return !~text.indexOf(val);
    }).hide();
}
</script>
