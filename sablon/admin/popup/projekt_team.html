<h2>Projekt Team tag hozzáadása</h2>

            <tr>

    <div class="kuldes">
        <input type="submit" name="elkuld" value="Mentés">

</form>
<script>

                }else if(response.html){

});

}

/* Login táblázat egy sorára kattintva, adott login adataival feltöltjük a cellákat */
function pop_mezok_kitolt( tr ){
    $('#pop_nev').val( tr.find('.nev').html().replace(/&amp;/g, '&') );
    $('#pop_beosztas').val( tr.find('.beosztas').html().replace(/&amp;/g, '&') );
    $('#pop_usertel').val( tr.find('.telefon').val() );
    $('#pop_usermail').val( tr.find('.email').val() );
    $('#pop_recid').val( tr.find('.recid').val() );
    $('#pop_ceg').val( tr.find('.reszleg').html().replace(/&amp;/g, '&') );
}

/* Külsős hozzáadása gomb */
function pop_kulsos_hozzaadasa() {
    $('#pop_nev').val('');
    $('#pop_ceg').val('');
    $('#pop_usertel').val('');
    $('#pop_usermail').val('');
    $('#pop_beosztas').val('');
    $('#pop_szerepkor').val('');
    $('#pop_recid').val('');
    /* Végül a névre fókuszálunk, mint első mező */
    $('#pop_nev').focus();
}

/* Projekt team rögzítése */
function projekt_team_felvesz() {
    $.ajax({
        url : 'projektkezeles.php',
        type: 'POST',
        data: {
            recid       : _get('id'),
            nev         : $('#pop_nev').val(),
            ceg         : $('#pop_ceg').val(),
            usertel     : $('#pop_usertel').val(),
            usermail    : $('#pop_usermail').val(),
            beosztas    : $('#pop_beosztas').val(),
            szerepkor   : $('#pop_szerepkor').val(),
            login_recid : $('#pop_recid').val(),
            projekt_team_felvesz : Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);
                if( response.hiba ) {
                    if( response.hiba=='data-hiba' ) {
                        alert2($('#'+response.focus).attr('data-hiba'), response.gomb, response.title);
                    } else {
                        alert2(response.hiba, response.gomb, response.title);
                    }
                    if( response.focus ) {
                        $('#'+response.focus).addClass('hibas_ide_focus');
                    }
                    return false;
                } else {
                    
                    szamlaBetolt( _get('id'), PHP_SELF, 'projekt_team' );
                    popupZar();
                    
                    /* Arra az esetre, ha csak a levélküldéssel volt gond */
                    if( response.mail_hiba ) {
                        alert2(response.mail_hiba, response.gomb, 'Hiba');
                    }
                    
                }
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
    return false;
}
</script>
