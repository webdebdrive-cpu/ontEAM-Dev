<h2>Adja meg az elutasítás okát</h2>
<form id="elutasitasForm" class="popupForm" method="post" onsubmit="return munkalapKulsosElutasit();">
    <div class="kozep">
        <div id="pop_ml_adatok" style="margin-bottom: 1rem"></div>
        <div class="dt">
            <div class="dtr">
                <div class="dtc form_bal b">Elutasítás oka:</div>
                <div class="dtc form_jobb">
                    <textarea name="elutasitas_memo" class="csillag" id="elutasitas_memo" onkeyup="if( $(this).val().trim()=='' ){ $(this).val(''); }"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
    </div>
</form>
<script>
$(document).ready(function(){
    $.ajax({
        url : 'munkalap.php',
        type: 'POST',
        data: {
            recid           : _get('id'),
            get_ml_adatok   : Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);
                $('#pop_ml_adatok').html(response.html);
                
                if(response.hiba){
                    alert2(response.hiba, response.gomb, response.title);
                    popupZar();
                }
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
});
    
/* Munkalap külsős elutasítása */
function munkalapKulsosElutasit() {

    szurkit();
    /* Megjegyzés kötelező */
    if(!$('#elutasitas_memo').val()){
        $('#popup input, #popup textarea, #popup select').removeClass('hibas_ide_focus');
        $('#elutasitas_memo').addClass('hibas_ide_focus');
        alert2('Kérem indokolja az elutasítást!', '<input type="button" class="link gomb" value="Ok" onclick="alert2();">', 'Hiba');
        return false;
    }

    $.ajax({
        url : 'munkalap.php',
        type: 'POST',
        data: {
            recid                   : _get('id'),
            memo                    : $('#elutasitas_memo').val(),
            munkalapKulsosElutasit  : new Date().getTime()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);

                szurkit_zar();
                if( response.hiba ) {
                    alert2(response.hiba, response.gomb, response.title);
                    return false;
                }
                
                popupZar();
                szamlaBetolt(_get('id'), baseName(location.href) + '.php', 'modosit');
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });

    return false;
}
</script>
