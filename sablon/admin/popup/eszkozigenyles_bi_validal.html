<h2>Igénylés validálása</h2>
<script>
    var SZAKMAI_VEL_STATUSZBA = 0;
</script>
<form id="elutasitasForm" class="popupForm" method="post" onsubmit="bi_validal_inditas(SZAKMAI_VEL_STATUSZBA); return false;">
    <div class="kozep">
        <div class="dt">
            <div class="dtr">
                <div class="dtc form_bal">Szálloda:</div>
                <div class="dtc form_jobb">
                    <div id="popup_telephely"></div>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Termék megnevezés:</div>
                <div class="dtc form_jobb">
                    <div id="popup_nev"></div>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Igényelt nettó érték:</div>
                <div class="dtc form_jobb">
                    <div id="popup_ossz_netto"></div>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Indoklás:</div>
                <div class="dtc form_jobb">
                    <textarea id="popup_bi_indok" onkeyup="if( $(this).val().trim()=='' ){ $(this).val(''); }"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Igen">
        <input type="button" name="megsem" class="gombb_alert" value="Nem" onclick="popupZar();">
    </div>
</form>
<script>
$(document).ready(function(){

    var akt_id = _get('id');

    if( $('#telephely_id').length ) {
        $('#popup_telephely').html( $('#telephely_id option:selected').text() );
    } else {
        $('#popup_telephely').html( $('#telephely_nev_db_'+akt_id).val() );
    }
    if( $('#nev').length ) {
        $('#popup_nev').html( $('#nev').val() );
    } else {
        $('#popup_nev').html( $('#nev_db_'+akt_id).val() );
    }
    if( $('#ossz_netto').length ) {
        $('#popup_ossz_netto').html( $('#ossz_netto').val() + ' Ft' );
    } else {
        $('#popup_ossz_netto').html( $('#ossz_netto_db_'+akt_id).val() + ' Ft' );
    }
    
    // Mégse kerüljön be az indoklás mezőbe az adatbázis értéke, logolós működés kell ide
    // $('#popup_bi_indok').val( $('#bi_indok_db_'+akt_id).val().replace(/<br\s*\/?>/g, '\n') );
    $('#popup_bi_indok').select();

    // Kérjük le a típust, mert azon múlik majd a függvényhívás paraméterezése
    $.ajax({
        url : PHP_SELF,
        type: 'POST',
        data: {
            id          : akt_id,
            get_igeny   : Date.now()
        },
        success: function(response){
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if(response){
                response = JSON.parse(response);
                if(response.hiba){
                    alert2(response.hiba, response.gomb, response.title);
                    return false;
                }
                if(response.tipus == 1){
                    SZAKMAI_VEL_STATUSZBA = 1;
                }
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });

});

// A tényleges jóváhagyás előtt rákérdezünk, ha vannak tételek, hányat hagy jóvá velük együtt
function bi_validal_inditas(szakmai_vel) {

    var akt_id   = _get('id');
    var tetel_db = Number($('#tetel_db_'+akt_id).val()) || 0;

    if( tetel_db > 0 ) {
        var tetel_jh_db = Number($('#tetel_jh_db_'+akt_id).val()) || 0;
        // Ha egyetlen tétel sincs jóváhagyva, az nem jóváhagyás (elutasításra ott az Elutasítás gomb), ezért kérdés helyett hibaüzenet, mint tétel nélkül a Jóváhagyott mennyiség popupon
        if( tetel_jh_db == 0 ) {
            alert2('Kérem töltse ki a jóváhagyott mennyiséget!', '<input type="button" class="link gomb" value="Ok" onclick="alert2();">', 'Hiba');
            return false;
        }
        alert2(tetel_jh_db+'/'+tetel_db+' db tétel jóváhagyására készül. Folytatja?', '<input type="button" class="gomb zold" value="Igen" onclick="bi_validal(\'-mehet-\', '+JSON.stringify(szakmai_vel)+');"><input type="button" class="gomb piros" value="Nem" onclick="alert2();">', 'Kérdés');
        return false;
    }

    bi_validal('-mehet-', szakmai_vel);
}

// BI validál
function bi_validal(mehet, szakmai_vel = '') {

    // globális változók frissítése az adott adatlap alapján
    eszkoz_valtozok_update();

    // Ez korábban csak egy sima alertes kérdés volt, most már popup, emiatt nem kell megerősítő kérdés
    // if( !mehet ) {
    //     // 2025.09.25 Új működés szerint BI jóváhagyásra léptetejük, még a GM-eset is, nincs tehát továbbadva a kikuld paraméter sem
    //     // let kerdes = 'Biztosan mehet szakmai véleményezésre az igénylés?';
    //     let kerdes = 'Biztosan mehet BI jóváhagyásra az igénylés?';
    //     if( szakmai_vel ) {
    //         kerdes = 'Biztosan mehet szakmai véleményezésre az igénylés?';
    //     }
    //     alert2(kerdes, '<input type="button" class="gomb zold enter" value="Igen" onclick="bi_validal(\'-mehet-\', \''+szakmai_vel+'\')"> <input type="button" class="gomb piros" value="Nem" onclick="alert2()">', 'Kérdés');
    //     return false;
    // }

    // Jóváhagyás
    $.ajax({
        url : PHP_SELF+eszkoz_url_kieg,
        type: 'POST',
        data: {
            id          : eszkoz_id,
            szakmai_vel : szakmai_vel,
            indok       : $('#popup_bi_indok').val(),
            bi_validal  : Date.now()
        },
        success: function (response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if (response) {
                response = JSON.parse(response);
                if (response.hiba) {
                    alert2(response.hiba, response.gomb, response.title);
                    return false;
                }

                popupZar();

                // Táblázat alatt a sort frissítjük
                if( isset_get('tablazat') ) {
                    $('.bi_vel_'        +eszkoz_id  ).html(response.pipa     );
                    $('.stat_'          +eszkoz_id  ).html(response.statusz  );
                    $('#bi_indok_db_'   +eszkoz_id  ).val ('');
                    $('.gombok_'        +eszkoz_id  ).html(response.gombok   );

                    // Dokumentumok számát is, mert ha nem tervezett volt, akkor új dokumentummal is bővülhetett
                    $('.gombok_'        +eszkoz_id  ).data('dok_db', response.dok_db    );
                    // Fülön is
                    let dok_ful_txt = 'Dokumentumok';
                    if( response.megj_db>0 ) {
                        dok_ful_txt = 'Dokumentumok ('+response.dok_db+')';
                    }
                    $('#szamlaFulek a[data-oldal="dokumentumok"]').html(dok_ful_txt);

                    // Megjegyzések számát is, mert ha volt értesítés küldés, akkor bővülhetett
                    $('.gombok_'        +eszkoz_id  ).data('megj_db', response.megj_db    );
                    // Fülön is
                    let megj_ful_txt = 'Megjegyzések';
                    if( response.megj_db>0 ) {
                        megj_ful_txt = 'Megjegyzések ('+response.megj_db+')';
                    }
                    $('#szamlaFulek a[data-oldal="megjegyzesek"]').html(megj_ful_txt);

                    // Ha a mehet a '-tervezett-' igénylés miatt volt kitöltve, akkor lépünk a következő sorra. 
                    if( response.naviKov ) {
                        // Ilyet mégsem kérnek
                        // naviKov();
                    } 
                    
                    // A tényleges gombokat is cserélni kell
                    $('.muveletek').html(response.gombok   );
                
                // Egyébként az adatlapot töltsük be
                } else {

                    let ful   = '';
                    eszkoz_fulek.forEach(function(akt_ful) {
                        if( isset_get(akt_ful) ) {
                            ful = akt_ful;
                            return;
                        }
                    });
                    szamlaBetolt(_get('id'), baseName(location.href) + '.php', ful);

                    // Ha a mehet a '-tervezett-' igénylés miatt volt kitöltve, akkor lépünk a következő sorra. 
                    if( response.naviKov ) {
                        setTimeout(function(){
                            // Ilyet mégsem kérnek
                            // naviKov();
                        }, 1000);
                    } 
                }
            }
        },
        complete: function (xhr) {
            if (xhr.status != 200) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
}
</script>
