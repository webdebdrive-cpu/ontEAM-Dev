<h2>Anyag felhasználás</h2>
<form action="" id="munkAnyagVetelezForm" class="popupForm" method="post">
    <div class="kozep" style="min-height: 40rem">
        <div class="dt">
            <div class="dtr">
                <div class="dtc form_bal">Cikk:</div>
                <div class="dtc form_jobb">
                    <input type="text" autocomplete="off" class="oriasi disableNav csillag focus" name="cikk_id_autocomp" id="cikk_id_autocomp" onblur="if(!$(this).val()){ $('#cikk_id').val(''); }" value="">
                    <input type="hidden" name="cikk_id" id="cikk_id" value="">
                    <input type="hidden" name="cikkid_origi" id="cikkid_origi" value="">
                    <script>
                        $(document).ready(function() {
                            $('#cikk_id_autocomp').autocomplete({
                                'php_fajl'      : '../autocomplete.php',
                                'tabla'         : 'cikktorzs',
                                'oszlop_keres'  : 'id, nev',
                                'oszlop_listaz' : 'id, nev',
                                'id_kiir'       : 'recid'
                            });
                        });
                    </script>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Felh. menny.:</div>
                <div class="dtc form_jobb wsn">
                    <input type="text" id="felh_menny" class="f_num csillag" name="felh_menny" value="0,00" placeholder="" autocomplete="off" style="min-width: 7.5rem; width: 7.5rem;">
                    <span class="insertMee"></span>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Leírás:</div>
                <div class="dtc form_jobb">
                    <textarea id="igleir" name="igleir" class="oriasi" style="height: 4rem"></textarea>
                </div>
            </div>
        </div>
        <div id="insertTable">
            <table class="csikos">
                <tr>
                    <th>Cikk</th>
                    <th>Név</th>
                    <th class="r">Felhasznált mennyiség</th>
                    <th>Mee</th>
                    <th>Anyag státusz</th>
                    <th>Leírás</th>
                    <th class="torles"></th>
                </tr>
            </table>
        </div>
    </div>
    <div class="kuldes">
        <input type="button" class="gomb" onclick="munkAnyagHozzaad( '#munkAnyagVetelezForm', false );" value="Hozzáad" id="mukalapAnyagvetelezHozzaad">
        <input type="button" class="gomb zold" name="elkuld" value="Mentés" onclick="munkAnyagVetelezes()">
        <input type="button" class="gomb piros" value="Mégsem" onclick="popupZar();" id="nem_gomb">
    </div>
</form>
<script>
/* Felhasznált mennyiségre enterezve fusson le a hozzáadás */
$(document).on('keyup', '#felh_menny', function(e) {
    if (e.which == KEY_ENTER) {
        $('#cikk_id_autocomp').focus();
        $('#mukalapAnyagvetelezHozzaad').click();
    }
});

/* Mégsem gombon tabozva a feladat inputra érkezzünk vissza */
$(document).on('keydown', '#nem_gomb', function(event) {
    if( event.keyCode == KEY_TAB ) {
        $('#cikk_id_autocomp').focus();
        return false;
    }
});

function munkAnyagVetelezes() {

    that = $('#munkAnyagVetelezForm');

    var addCikkUj        = $(that).find('input[name="addCikkUj[]"]'),
        addCikkID        = $(that).find('input[name="addCikkID[]"]'),
        addCikkFelhMenny = $(that).find('input[name="addCikkFelhMenny[]"]'),
        addCikkIgleir    = $(that).find('input[name="addCikkIgleir[]"]');

    /* Van-e egyáltalán a táblázatnak sora */
    if($(that).find('#insertTable tr').length<=1){
        $('#cikk_id_autocomp').addClass('hibas_ide_focus');
        alert2('Kérem válasszon felhasznált mennyiséget!', '', 'Hiba');
    }

    if( addCikkID.length && addCikkFelhMenny.length ) {
        $.ajax({
         	url : 'munkalap.php',
         	type: 'POST',
         	data: {
                recid               : _get('id'),
                addCikkUj           : addCikkUj.serialize(),
                addCikkID           : addCikkID.serialize(),
                addCikkFelhMenny    : addCikkFelhMenny.serialize(),
                addCikkIgleir       : addCikkIgleir.serialize(),
                munkAnyagVetelezes  : new Date().getTime()
            },
         	success: function(response) {
                if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
         		if(response) {
                    response = JSON.parse(response);

                    if( response.hiba ) {
                        if( response.gomb ) {
                            alert2(response.hiba, response.gomb, response.title);
                        } else {
                            alert2(response.hiba, response.gomb, response.title);
                            $('#cikk_id_autocomp').addClass('hibas_ide_focus');
                        }

                        return false;
                    }

                    szamlaBetolt(_get('id'), baseName(location.href) + '.php', 'tetel');
                    popupZar();
         		}
         	}
        });
    }

    return false;
}
</script>
