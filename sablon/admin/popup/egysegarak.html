<h2>Egységárak</h2>
<form action="" id="egysegarakForm" class="popupForm" method="post" onsubmit="return egysegarMentes( this );">
    <div id="setEgysegarTablazat" class="kozep" style="min-height: 26rem; width: 50rem"></div>
    <div class="dt egysegarMuv">
        <div class="dtr">
            <div class="dtc">
                Mező<br>
                <select name="egysk_oszlop" onchange="egysegarOszlop( 'egysk_', this.value );">
                    <option value="ear">Egységár</option>
                    <option value="dnem">Deviza</option>
                    <option value="arf">Árfolyam</option>
                </select>
            </div>
            <div class="dtc">
                Minden<br>
                <select name="egysk_ciklus">
                    <option value="1">havi</option>
                    <option value="2">2 havi</option>
                    <option value="3">negyedév</option>
                    <option value="6">félév</option>
                </select>
            </div>
            <div class="dtc">
                legyen<br>
                <div class="egysk_box">
                    <input type="text" name="egysk_ear" class="f_num" data-tort="3" value="0,000">
                </div>
                <div class="egysk_box dn">
                    <input type="text" autocomplete="off" class="csillag autocomp" name="egysk_dnem_autocomp" id="egysk_dnem_autocomp" style="min-width: inherit; width: 6rem;" value="" data-origin-val="">
                    <input type="hidden" name="egysk_dnem" id="egysk_dnem" value="">
                    <script>
                        $(document).ready(function() {
                            $('#egysk_dnem_autocomp').autocomplete({
                                'php_fajl'        : '../autocomplete.php',
                                'tabla'           : 'erteklista',
                                'oszlop_keres'    : 'info',
                                'oszlop_listaz'   : 'info',
                                'csoport'         : 21,
                                'id_kiir'         : 'id',
                                'popupba'         : true
                            });
                        });
                    </script>
                </div>
                <div class="egysk_box dn">
                    <input type="text" name="egysk_arf" class="f_num" data-tort="5" value="1,00000">
                </div>
            </div>
            <div class="dtc">
                Kezdő hónap:<br>
                <select name="egysk_honap">
                    <option value="01">Január</option>
                    <option value="02">Február</option>
                    <option value="03">Március</option>
                    <option value="04">Április</option>
                    <option value="05">Május</option>
                    <option value="06">Június</option>
                    <option value="07">Július</option>
                    <option value="08">Augusztus</option>
                    <option value="09">Szeptember</option>
                    <option value="10">Október</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
            </div>
            <div class="dtc">
                <input type="button" name="" class="gomb" value="Kitölt" onclick="egysegarMuv( 'egysk_', 'kitolt' );">
            </div>
        </div>
        <div class="dtr">
            <div class="dtc">
                <select class="eltol" name="egysv_oszlop" onchange="egysegarOszlop( 'egysv_', this.value );">
                    <option value="ear">Egységár</option>
                    <option value="arf">Árfolyam</option>
                </select>
            </div>
            <div class="dtc">
                <div class="egysv_box">
                    <input type="text" name="egysv_ear" class="f_num eltol" data-tort="3" value="0,000">
                </div>
                <div class="egysv_box dn">
                    <input type="text" name="egysv_arf" class="f_num eltol" data-tort="5" value="1,00000">
                </div>
            </div>
            <div class="dtc">
                legyen visszaosztva<br>
                <select name="egysv_ciklus">
                    <option value="1">havonta</option>
                    <option value="2">2 havonta</option>
                    <option value="3">negyedévente</option>
                    <option value="6">félévente</option>
                </select>
            </div>
            <div class="dtc">
                Kezdő hónap:<br>
                <select name="egysv_honap">
                    <option value="01">Január</option>
                    <option value="02">Február</option>
                    <option value="03">Március</option>
                    <option value="04">Április</option>
                    <option value="05">Május</option>
                    <option value="06">Június</option>
                    <option value="07">Július</option>
                    <option value="08">Augusztus</option>
                    <option value="09">Szeptember</option>
                    <option value="10">Október</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
            </div>
            <div class="dtc">
                <input type="button" name="" class="gomb" value="Visszaosztás" onclick="egysegarMuv( 'egysv_', 'visszaoszt' );">
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="hidden" name="egysegarsor_id" id="egysegarsor_id" value="">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
    </div>
</form>
<script>
$(document).ready(function(){
    $.ajax({
        url : 'energia_terv.php',
        type: 'POST',
        data: {
            recid       : _get('id'),
            get_statusz : Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if(response){
                response = JSON.parse(response);
                if( response.hiba ) {
                    alert2(response.hiba, response.gomb, response.title);
                    popupZar();
                    return false;
                }
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });

    var id = $('.szamla_cont_tabla tr.kijelolve').attr('data-recid');
    $.ajax({
        url : 'energia_terv.php',
        type: 'POST',
        data: {
            id              : id,
            get_egysegarak  : new Date().getTime()
        },
        success: function(response) {
            if(response) {
                response = JSON.parse(response);

                if( response.hiba ) {
                    alert2(response.hiba, response.gomb, 'Hiba');
                    popupZar();
                    return false;
                }

                $('#egysegarsor_id').val(id);
                $('#setEgysegarTablazat').html(response.html);
                $('select[name="egysk_oszlop"]').html(response.egysk_oszlop);
                $('select[name="egysv_oszlop"]').html(response.egysv_oszlop);
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
});

function egysegarMuv( pre, muvelet ) {
    var ciklus  = parseInt($('select[name="' + pre + 'ciklus"]').val()),
        oszlop  = $('select[name="' + pre + 'oszlop"]').val(),
        ertek   = $('input[name="' + pre + oszlop + '"]').val(),
        honap   = $('select[name="' + pre + 'honap"]').val();

    if( oszlop == 'dnem' ) {
        dnemText = $('input[name="' + pre + oszlop + '_autocomp"]').val();
    }

    ertek = ertek.replace(/ /g, '');

    var inputok = $('#setEgysegarTablazat').find('input[name^="' + oszlop + '"]');

    inputok.each(function(index, el) {
        index++;
        var sorszam = ('0' + index).slice(-2);

        if( sorszam == honap ) {
            if( muvelet == 'kitolt' ) {
                for(var i = index; i <= 12; i += ciklus) {
                    var uj_sorszam = ('0' + i).slice(-2);

                    if( oszlop == 'ear' ) {
                        tizedesek = 3;
                    } else {
                        tizedesek = 5;
                    }

                    $('input[name="' + oszlop + uj_sorszam + '"]').val(ezresek(ertek.replace(',', '.'), tizedesek, ',', ' '));

                    if( oszlop == 'dnem' ) {
                        $('input[name="' + oszlop + uj_sorszam + '_autocomp"]').val(dnemText);
                    }
                }
            } else if( muvelet == 'visszaoszt' ) {
                oszto = 12 - parseInt(honap) + 1;

                ertek = (ertek.replace(',', '.') / Math.ceil(oszto / ciklus));

                if( oszlop == 'ear' ) {
                    tizedesek = 3;
                    ertek = ertek.toFixed(tizedesek);
                } else {
                    tizedesek = 5;
                    ertek = ertek.toFixed(tizedesek);
                }

                for( var i = index; i <= 12; i += ciklus ) {
                    var uj_sorszam = ('0' + i).slice(-2);
                    $('input[name="' + oszlop + uj_sorszam + '"]').val(ezresek(ertek, tizedesek, ',', ' '));
                }
            }

            return false;
        }
    });
}

function egysegarOszlop( pre, value ) {
    $('.' + pre + 'box').addClass('dn');
    $('.egysegarMuv input[name="' + pre + value + '"]').parents('.' + pre + 'box').removeClass('dn');
}

function egysegarMentes( that ) {
    if( $(that).length ) {
        $.ajax({
         	url : 'energia_terv.php',
         	type: 'POST',
         	data: $(that).serialize() + '&egysegarMentes=' + new Date().getTime(),
         	success: function(response) {
         		if(response) {
         			response = JSON.parse(response);

         			if( response.hiba ) {
         				alert2(response.hiba, response.gomb, 'Hiba');
         				return false;
         			}

                    popupZar();
                    szamlaBetolt(_get('id'), baseName(location.href) + '.php', 'egysegarak').done(function() {
                        $('.szamla_cont_tabla tr').removeClass('kijelolve');
                        $('#tr_ear_' + response.recid).addClass('kijelolve');
                        $('#tartalomJobb .fht-tbody').scrollTop($('#tr_ear_' + response.recid+'.kijelolve').position().top);
                    });
         		}
         	},
            complete: function(xhr) {
                if( xhr.status != 200 ) {
                    alert2(xhr.responseText, '', 'Hiba');
                }
            }
        });
    }

    return false;
}
</script>
