<h2>Szerződés tételek kezelése</h2>

<div class="kozep" style="min-height: 40rem">

    Szálloda:
    <br>
    <select id="pop_telephely_id"></select>
    <br>Tárgy:
    <br><input type="text" id="pop_targy" class="oriasi csillag">
    <br>Számla várh. érk.
    <br><input type="text" id="pop_szla_varh_erk" class="datepicker_matol csillag">
    <br>Számla várh. értéke:
    <br><input type="text" id="pop_szla_varh_ert" class="f_num csillag" data-tort="0"> <span class="f_penznem"></span>
    <br>Teljesítés dátuma:
    <br><input type="text" id="pop_telj_dt" disabled>
    <br>Nettó érték:
    <br><input type="text" id="pop_ertek" class="f_num" data-tort="0" disabled> <span class="f_penznem"></span>
    <input type="hidden" name="tetel_sor_id" id="tetel_sor_id">
    
    <br><input type="button" id="hozzaad_gomb" class="gomb" value="Új tétel hozzáadása" style="margin-top: 0.3rem" onclick="tetel_hozzaadasa()">
    
    <form action="" enctype="multipart/form-data" method="" id="popup_tetel_sorok">
        <table class="csikos kijCont dn" id="pop_tetelek" style="cursor: default;">
            <thead>
            <tr>
                <th>Szálloda</th>
                <th>Tárgy</th>
                <th>Számla várh. érk.</th>
                <th style="width: 10rem">Számla várh. értéke (<span class="f_penznem"></span>)</th>
                <th>Teljesítés</th>
                <th>Nettó érték (<span class="f_penznem"></span>)</th>
                <!--<th>Szerkesztés</th>-->
                <th>Törlés</th>
            </tr>
            </thead>

            <tbody>
            </tbody>
        </table>
    </form>
    
</div>
<div class="kuldes">
    <input type="button" class="gomb zold dn pop_mentes_megsem" value="Mentés" onclick="tetel_sorok_ment()">
    <input type="button" class="gomb kek dn pop_mentes_megsem" value="Mégsem" onclick="megsem_gomb();">
<!--    <input type="button" class="gomb piros escapes_megsem" value="Bezár" onclick="bezar_gomb();">-->
</div>
<script>
var akt_penznem = $('#kcs_21_autocomp').val();
if( !akt_penznem ) {
    akt_penznem = $('#kcs_21_autocomp_db').val();
}

var kcs_21 = $('#kcs_21').val();
if( !kcs_21 ) {
    kcs_21 = $('#kcs_21_db').val();
}

/* JS-el figyeljük, hogy volt-e bármi változás. Ha igen, akkor Mégsem/Bezár gombra rákérdezünk, hogy biztos-e? */
var van_valtozas = false;
var torolt_sorok = '';

$(document).ready(function () {
    
    /* Popup bezár gombjára visszatesszük az eredeti funkciót, mert a kapcsoló popban felülírtuk egy csoportMuvelet-es utasítással */
    $('#popup .bezar').attr('onclick', '');
    
    /* f_penznem class-ú elemek lecserélése a pénznemre */
    $('.f_penznem').each(function () {
        $(this).replaceWith(akt_penznem);
    });
    if( akt_penznem && akt_penznem != 'HUF' ) {
        $('#pop_szla_varh_ert').attr('data-tort', '2');
    }
    if( akt_penznem && akt_penznem != 'HUF' ) {
        $('#pop_ertek').attr('data-tort', '2');
    }
    
    /* datepicker_matol felkonfigolása */
    $('.datepicker_matol').datetimepicker({
        closeOnDateSelect   : true,
        format              :'Y.m.d',
        mask                : '\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0',
        timepicker          : false,
        validateOnBlur      : false,
        scrollInput         : false,
        minDate             : '-1970/01/02'
    });
    
    $('.datepicker').datetimepicker({
        closeOnDateSelect   : true,
        format              :'Y.m.d',
        mask                : '\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0',
        timepicker          : false,
        validateOnBlur      : false,
        scrollInput         : false,
        onChangeDateTime    : function(){ }
    });
    
    pop_tetelek_feltolt();
    
});

/* Tételt hozzáadó függvény */
function tetel_hozzaadasa() {
    
    var telephely       = $('#pop_telephely_id')    .val();
    var pop_targy       = $('#pop_targy')           .val().trim();
    var pop_varh_erk    = $('#pop_szla_varh_erk')   .val();
    var pop_varh_ert    = $('#pop_szla_varh_ert')   .val();
    var pop_telj_dt     = $('#pop_telj_dt')         .val();
    var ertek           = $('#pop_ertek')           .val();
    var sor_id          = $('#tetel_sor_id')        .val();

    van_valtozas = true;

    /* Üres adatok ellenőrzése */
    if( !telephely ){
        alert2('Kérem válasszon szállodát!', '', 'Hiba');
        $('#pop_telephely_id_autocomp').addClass('hibas_ide_focus');
        return false;
    }
    if( !pop_targy ){
        alert2('Kérem töltse ki a tárgy mezőt!', '', 'Hiba');
        $('#pop_targy').addClass('hibas_ide_focus');
        return false;
    }

    if( !pop_varh_erk || pop_varh_erk == '\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0' ) {
        alert2('Kérem töltse ki a várható érkezést!', '', 'Hiba');
        $('#pop_szla_varh_erk').addClass('hibas_ide_focus');
        return false;
    }

    if( !pop_varh_ert ) {
        alert2('Kérem töltse ki a várható értéket!', '', 'Hiba');
        $('#pop_szla_varh_ert').addClass('hibas_ide_focus');
        return false;
    }

    var id_tmp = new Date().getTime();
    
    /* Ha ismert a sor_id, akkor update */
    if( sor_id ) {

        $('.pop_tetel_'+sor_id+' .pop_telephely').html( $('#pop_telephely_id option:selected').text() );
        $('.pop_tetel_'+sor_id+' .pop_telephely_id').val( $('#pop_telephely_id').val() );
        $('.pop_tetel_'+sor_id+' .pop_targy').html( pop_targy );
        $('.pop_tetel_'+sor_id+' .pop_varh_erk').html( pop_varh_erk );
        $('.pop_tetel_'+sor_id+' .pop_varh_ert').html( pop_varh_ert );
        $('.pop_tetel_'+sor_id+' .pop_telj_dt').html( pop_telj_dt );
        $('.pop_tetel_'+sor_id+' .pop_netto_ert').html( ertek );

    /* Egyébként új sor hozzáadása */
    } else {
        
        var table_sor = '<tr class="pop_tetel_'+id_tmp+'">'+
                            '<td class="pop_telephely l">'+$('#pop_telephely_id option:selected').text()+'</td>'+
                            '<td class="pop_targy l">'+pop_targy + '</td>'+
                            '<td class="pop_varh_erk l">'+pop_varh_erk + '</td>'+
                            '<td class="pop_varh_ert r">'+pop_varh_ert + '</td>'+
                            '<td class="pop_telj_dt l"></td>'+
                            '<td class="pop_netto_ert r"></td>'+
                            /*'<td><a class="szerk" onclick="popup_tetel_sor_szerk(\'pop_tetel_'+id_tmp+'\');">🖉</a></td>'+*/
                            '<td><a onclick="popup_tetel_sor_torol(\'pop_tetel_'+id_tmp+'\');"><span class="icon"><i class="material-icons">delete</i></span></a>'+
                                '<input type="hidden" class="pop_telephely_id" value="'+$('#pop_telephely_id').val()+'">'+
                                '<input type="hidden" class="pop_valtozott" value="1">'+
                                '<input type="hidden" class="pop_recid" name="recid" value="'+sor_id+'">'+        
                            '</td>' +
                        '</tr>';

        $('#pop_tetelek tbody').append( table_sor );
        $('#pop_tetelek').removeClass('dn');
        
    }

    $('#pop_telephely_id').val('');
    $('#pop_targy').val('');
    $('#pop_szla_varh_erk').val('\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0');
    $('#pop_szla_varh_ert').val('');
    $('#pop_ertek').val('');
    $('#pop_telj_dt').val('\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0');
    $('#tetel_sor_id').val('');
    $('#hozzaad_gomb').val('Új tétel hozzáadása');

    $('#pop_telephely_id').focus();
    
    $('.pop_mentes_megsem').removeClass('dn');
    
    /* A tétel sorokat csak Session-ba, kimentjük. DB-be még nem menethetünk csak, ha a Mentés gombra kattintottak. */

}

/* Tétel sor törlése */
function popup_tetel_sor_torol(sor_id, mehet){
    
    van_valtozas = true;
    
    $('.'+sor_id).addClass('torles_elott');
    if(!mehet){
        alert2( 'Szálloda '             + $('.'+sor_id+' .pop_telephely').html() +'<br>' +
                'Teljesítés dátuma: '   + $('.'+sor_id+' .pop_telj_dt').html() +'<br>' +
                'Nettó érték: '         + $('.'+sor_id+' .pop_netto_ert').html() +' ' + akt_penznem + '<br>' +
                'Biztosan törli a szerződés tételt?', '<input type="button" class="gomb zold" value="Igen" onclick="popup_tetel_sor_torol(\''+sor_id+'\', \'mehet\'); alert2();"><input type="button" class="gomb piros escapes_megsem" value="Nem" onclick="alert2(); $(\'.torles_elott\').removeClass(\'torles_elott\');">');
        return false;
    }
    
    /* Sor törlése, újraszámolás */
    $('.'+sor_id).fadeOut('slow', function(){
        $('.'+sor_id).remove();
    });
    
    /* Popup mentésekor ez alapján töröljük ki majd a sort */
    torolt_sorok += sor_id;
    
    $('#pop_targy').focus();
    
    $('.pop_mentes_megsem').removeClass('dn');
    
    /* A tétel sorokat csak Session-ba, kimentjük. DB-be még nem menethetünk csak, ha a Mentés gombra kattintottak. */
}

/* Tétel szerkesztése  */
function popup_tetel_sor_szerk(sor_id){
    
    /* Sor törlése, újraszámolás */
    $('#pop_telephely_id')  .val( $('.'+sor_id+' .pop_telephely_id' ).val() );
    $('#pop_targy')         .val( $('.'+sor_id+' .pop_targy'        ).html() );
    $('#pop_szla_varh_erk') .val( $('.'+sor_id+' .pop_varh_erk'     ).html() );
    $('#pop_szla_varh_ert') .val( $('.'+sor_id+' .pop_varh_ert'     ).html() );
    $('#pop_telj_dt')       .val( $('.'+sor_id+' .pop_telj_dt'      ).html() );
    $('#pop_ertek')         .val( $('.'+sor_id+' .pop_netto_ert'    ).html() );
    $('#tetel_sor_id')      .val( sor_id.replace('pop_tetel_', '') );
    
    $('#hozzaad_gomb').val('Tétel szerkesztése');
    
    $('#pop_telephely_id').focus();
    
}

/* Tétel sor táblázat mentése */
function tetel_sorok_ment(){
    
    var recidk = [];
    $('.pop_recid').each(function() {
        recidk.push( $(this).val() );
    });
    var telephely = [];
    $('.pop_telephely_id').each(function() {
        telephely.push( $(this).val() );
    });
    var targy = [];
    $('.pop_targy').each(function() {
        targy.push( json_spec_karakterek($(this).html()) );
    });
    var varh_erk = [];
    $('.pop_varh_erk').each(function() {
        varh_erk.push( $(this).html() );
    });
    var varh_ert = [];
    $('.pop_varh_ert').each(function() {
        varh_ert.push( $(this).html() );
    });
    var telj_dt = [];
    $('.pop_telj_dt').each(function() {
        telj_dt.push( $(this).html() );
    });
    var netto_ert = [];
    $('.pop_netto_ert').each(function() {
        netto_ert.push( $(this).html().replace(/,/g, '.') );
    });
    var valtozott = [];
    $('.pop_valtozott').each(function() {
        valtozott.push( $(this).val() );
    });
    
    var adatok = [
                    ['recidk',    recidk],
                    ['telephely', telephely],
                    ['targy',     targy],
                    ['varh_erk',  varh_erk],
                    ['varh_ert',  varh_ert],
                    ['telj_dt',   telj_dt],
                    ['netto_ert', netto_ert],
                    ['valtozott', valtozott]
                ];
    
    /* A számla nettó értéke az Adatlapon található mező értéke 
     * De ha nem az adatlapon vagyunk, akkor meg egy rejtett inputban megtaláljuk, hogy a DB-ben mi van letárolva */
    var osszeg_mezo = 'netto';
    if( akt_penznem && akt_penznem != 'HUF' ) {
        osszeg_mezo = 'dev_net';
    }
    var szerzodes_netto_erteke = '';
    if( $('#'+osszeg_mezo).length ){
        szerzodes_netto_erteke = $('#'+osszeg_mezo).val();
    } else {
        szerzodes_netto_erteke = $('#'+osszeg_mezo+'_db').val();
    }
    var nullas = '';
    if( $('#nullas').length ){
        nullas = $('#nullas').prop('checked');
    }

    $.ajax({
        url : 'fenntartasi_szerzodes.php',
        type: 'POST',
        data: {
            adatok                  : JSON.stringify(adatok).replace(/\\"/g, '"'),
            recid                   : _get('id'),
            kcs_21                  : kcs_21,
            torolt_sorok            : torolt_sorok,
            szerzodes_netto_erteke  : szerzodes_netto_erteke,
            nullas                  : nullas,
            tetel_sorok_ment        : Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);
                if( response.hiba ) {
                    alert2(response.hiba, response.gomb, response.title);
                } else {
                    
                    /* Adatlapot csak akkor frissítünk, és popupot csak akkor zárunk ha DB-be is elmentjük */
                    if( _get('tetel') ){
                        szamlaBetolt(_get('id'), 'fenntartasi_szerzodes.php');
                    }
                    popupZar();
                    $('#ossz_'+osszeg_mezo).val( response.netto );
                    
                    /* Ennek köszönhetően lehet majd az adatlapot egyáltalán menteni (új feltöltéskor) */
                    $('#van_tetel').val('1');
                    
                }
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });

}

/* Ha van SESSION-ban adatunk, akkor abból töltsük fel a sorokat */
function pop_tetelek_feltolt(){
    
    var andoc_id = '';
    if( _get('andoc_id') ) {
        andoc_id = _get('andoc_id');
    }
    
    $.ajax({
        url : 'fenntartasi_szerzodes.php',
        type: 'POST',
        data: {
            id                  : _get('id'),
            andoc_id            : andoc_id,
            pop_tetelek_feltolt : Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);
                
                if(response.hiba){
                    alert2(response.hiba, response.gomb, response.title);
                    if( response.focus ){
                        $('#'+response.focus).addClass('hibas_ide_focus');
                    }
                    popupZar();
                    return false;
                }
                
                if(response.html){
                    $('#pop_tetelek tbody').append(response.html);
                    $('#pop_tetelek').removeClass('dn');
                }
                if(response.pr_tetelek){
                    $('#projekt_tetelek').html(response.pr_tetelek);
                }
                if(response.szalloda_select){
                    $('#pop_telephely_id').replaceWith(response.szalloda_select);
                    $('#pop_telephely_id').focus();
                }
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
}


/* Azért van külön függvénye, hogy rá lehessen kérdezni */
function megsem_gomb( mehet ) {
    
    /* Ha volt változtatás, és nem volt még kérdés */
    if( van_valtozas && !mehet ){
        alert2('A változások nincsenek mentve. Folytatja?', '<input type="button" class="gomb zold" value="Igen" onclick="megsem_gomb(\'mehet\')"><input type="button" class="gomb piros escapes_megsem" value="Nem" onclick="alert2();">', 'Kérdés');
    } else {
        csoportMuvelet('fenntartasiszerzodes_tetelek_kezelese');
        alert2();
    }
    
}

/* Azért van külön függvénye, hogy rá lehessen kérdezni */
function bezar_gomb( mehet ) {
    
    /* Ha volt változtatás, és nem volt még kérdés */
    if( van_valtozas && !mehet ){
        alert2('A változások nincsenek mentve. Folytatja?', '<input type="button" class="gomb zold" value="Igen" onclick="bezar_gomb(\'mehet\')"><input type="button" class="gomb piros escapes_megsem" value="Nem" onclick="alert2();">', 'Kérdés');
    } else {
        alert2();
        popupZar();
        /* Ez miért kellett? Csak mert gondot okozott, ha új számlát töltünk fel, bezárjuk a tétel kezelés, és frissíteni az adatlapot, ezért rákérdez, hogy biztosan elhagyjuk-e mentés nélkül... emiatt lett kiszedve.
         * szamlaBetolt(_get('id'), 'projektszamla.php', 'modosit');*/
    }
    
}
</script>
