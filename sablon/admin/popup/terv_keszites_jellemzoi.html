<h2>Terv készítés jellemzői</h2>

<div class="kozep">
    Adja meg a terv készítéséhez szükséges évet!
    <br>
    <br>Évszám: <input type="text" id="popup_ev" maxlength="4" class="f_plus_minus" style="width: 4.5rem"> (év választás +/- billentyűk)
    
    <div class="c" style="margin-top: 2rem">
        <input type="button" class="gomb" value="Üres" onclick="terv_keszit()">
        <input type="button" class="gomb" value="Kijelölt alapján" onclick="terv_keszit('kijelolt')">
    </div>
</div>
<div class="kuldes">
    <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
</div>

<script>
    $(document).ready(function(){
        $('#popup_ev').val( new Date().getFullYear() + 1);
    });
    
    function terv_keszit( kijelolt ){
        $.ajax({
            url : 'energia_terv.php',
            type: 'POST',
            data: {
                recid       : _get('id'),
                kijelolt    : kijelolt,
                ev          : $('#popup_ev').val(),
                terv_keszit : Date.now()
            },
            success: function(response) {
                if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
                response = JSON.parse(response);
                if( response.hiba ) {
                    alert2(response.hiba, response.gomb, response.title);
                    $('#popup_ev').select();
                    return false;
                }else{
                    szurkit();
                    location.href='energia_terv.php?modosit&id='+response.id;
                }
            },
            complete: function(xhr) {
                if( xhr.status != 200 ) {
                    alert2(xhr.responseText, '', 'Hiba');
                }
            }
        });
        
    }
    
    /* Az egységára fülre lépünk */
    function egysegar_fulre_lep(){
        szamlaBetolt(_get('id'), 'energia_terv.php', 'egysegarak');
    }
</script>
