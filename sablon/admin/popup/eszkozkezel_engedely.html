<h2>Engedély dátumok megadása</h2>
<form action="" id="eszkoz_eng_datum" class="popupForm" method="post" onsubmit="return engedelyDatum();">
    <div class="kozep">
        Kérem adja meg a hatályosság kezdeti és végdátumát:
        <table>
            <tr>
                <td class="padd2">Hatályba lépés:</td>
                <td class="padd2"><input type="text" id="esz_eng_kezdet" class="datepicker"></td>
            </tr>
            <tr>
                <td class="padd2">Hatályosság lejárta:</td>
                <td class="padd2"><input type="text" id="esz_eng_veg" class="datepicker"></td>
            </tr>
        </table>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" style="padding: 0.7rem" value="Ok">
        <input type="button" name="elkuld" value="Mégsem" class="gomb piros" onclick="popupZar()">
    </div>
</form>
<script>
    $(document).ready(function () {
        $('.datepicker').datetimepicker({
            closeOnDateSelect   : true,
            format              :'Y.m.d',
            mask                : /*'____.__.__'*/'\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0',
            timepicker          : false,
            validateOnBlur      : false,
            onChangeDateTime    : function(){ $('#mehet_gomb').removeAttr('disabled'); }
        });
    });
    
    

    /* Eszközkezelő engedély dátum megadása */
    function engedelyDatum() {
        
        id = $('#sorrendezes_tobbkep li:last-of-type').attr('id');
        id = id.replace('kep', '');
        
        $.ajax({
            url : 'eszkozkezeles.php',
            type: 'POST',
            data: {
                recid        : id,
                kezdet       : $('#esz_eng_kezdet').val(),
                veg          : $('#esz_eng_veg').val(),
                engedelyDatum: new Date().getTime()
            },
            success: function(response) {
                if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
                if(response) {
                    response = JSON.parse(response);

                    if( response.hiba ) {
                        if( response.gomb ) {
                            alert2(response.hiba, response.gomb);
                        } else {
                            alert2(response.hiba, '', 'Hiba');
                        }

                        return false;
                    }

                }
                szamlaBetolt(_get('id'), baseName(location.href) + '.php', 'engedelyek');
                popupZar(); 
            },
            complete: function(xhr) {
                if( xhr.status != 200 ) {
                    alert2(xhr.responseText, '', 'Hiba');
                }
            }
        });

        return false;
    }
</script>
