<h2>Feldolgozásra váró szerződések</h2>

<div class="kozep" style="max-height: 45rem; overflow-y: auto">
    <div id="feldolgozando_szerzodesek"></div>
</div>
<div class="kuldes">
    <!-- 
    2024.10.06 Volt róla szó, hogy létre kell tudni hozni új üres szerződést is, nem csak Andocból. Sőt, ez lényegében meg is lett csinálva, volt is róla levelezve.
    Végül mégsem kérte a megbízó. Emiatt itt csak a gombot vettük le, ami a folyamat eleje.
    (Erre a "2024.10.06 Volt róla szó, hogy"-ra ha rákeresel találsz még ide vonatkozó kódokat.)
    <input type="button" class="gomb" value="Új üres szerződés" onclick="location.href='fenntartasi_szerzodes.php?uj'">
     -->
    <input type="button" class="gomb zold" value="Ok" onclick="szerzodes_feldolgoz()">
    <input type="button" class="gomb piros escapes_megsem" value="Mégsem" onclick="popupZar();">
</div>
<script>
$(document).ready(function () {
    fenntartasi_szerzodes_get_koztes();
    
    $(document).on('click', '#pop_tetelek tbody tr', function(e) {
        $('#pop_tetelek tbody tr').removeClass('kijelolve');
        $(this).addClass('kijelolve');
    });
});

function szerzodes_feldolgoz() {
    
    if( !$('#pop_tetelek tbody tr.kijelolve').length ) {
        alert2('Kérjük előbb válasszon ki egy szerződést!', '', 'Hiba');
        return false;
    } else {
        var andoc_id = $('#pop_tetelek tbody tr.kijelolve').attr('data-andoc_id');
    }
    
    location.href = 'fenntartasi_szerzodes.php?uj&andoc_id='+andoc_id;
}

/* Ha van SESSION-ban adatunk, akkor abból töltsük fel a sorokat */
function fenntartasi_szerzodes_get_koztes() {
    
    $.ajax({
        url : 'fenntartasi_szerzodes.php',
        type: 'POST',
        data: {
            fenntartasi_szerzodes_get_koztes : Date.now() 
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);
                if(response.hiba){
                    alert2(response.hiba, response.gomb, response.title);
                    popupZar();
                    return false;
                }
                if(response.html){
                    $('#feldolgozando_szerzodesek').html(response.html);
                }
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
}
</script>
