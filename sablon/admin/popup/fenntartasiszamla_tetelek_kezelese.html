<script>
    
var akt_penznem = $('#kcs_21_autocomp').val();
if( !akt_penznem ) {
    akt_penznem = $('#kcs_21_autocomp_db').val();
}

var kcs_21 = $('#kcs_21').val();
if( !kcs_21 ) {
    kcs_21 = $('#kcs_21_db').val();
}

var nullas = $('#nullas').is(':checked');
if( !$('#nullas').length ) {
    nullas = $('#nullas_db').val();
}

/* Ha nem nullás a számla, és nincs kitöltve a nettó, akkor hibaüzenet */
if( !nullas ) {
    var netto_nincs_kitoltve = false;
    if( akt_penznem != 'HUF' && $('#dev_net').val() == '0,00' ) {
        netto_nincs_kitoltve = true;
        var mezo = 'dev_net';
    } 
    if( akt_penznem == 'HUF' && $('#netto').val() == '0' ) {
        netto_nincs_kitoltve = true;
        var mezo = 'netto';
    }
    if( netto_nincs_kitoltve ) {
        setTimeout(function(){ popupZar(); }, 100);

        alert2('Tételek kezelése előtt kérem töltse ki a nettó értéket vagy pipálja be, hogy 0 értékű a számla!', '', 'Hiba');
        $('#'+mezo).addClass('hibas_ide_focus');
    }
}

/* JS-el figyeljük, hogy volt-e bármi változás. Ha igen, akkor Mégsem/Bezár gombra rákérdezünk, hogy biztos-e? */
var van_valtozas = false;
var torolt_sorok = '';

$(document).ready(function () {
    
    /* Popup bezár gombjára visszatesszük az eredeti funkciót, mert a kapcsoló popban felülírtuk egy csoportMuvelet-es utasítással */
    $('#popup .bezar').attr('onclick', '');
    
    /* f_penznem class-ú elemek lecserélése a pénznemre */
    $('.f_penznem').each(function () {
        $(this).replaceWith(akt_penznem);
    });
    if( akt_penznem && akt_penznem != 'HUF' ) {
        $('#pop_ertek').attr('data-tort', '2');
        $('#pop_brutto').attr('data-tort', '2');
    }
    
    pop_tetelek_feltolt();
    
});

/* Tételt hozzáadó függvény */
function tetel_hozzaadasa() {
    
    var targy           = $('#pop_targy').val().trim();
    var ertek           = $('#pop_ertek').val().trim();
    var brutto          = $('#pop_brutto').val().trim();
    var afakod_txt      = $('#afakod_id_autocomp').val().trim();
    var jogcim_txt      = $('#jogcim_id_autocomp').val().trim();
    var ktgnem_txt      = $('#ktgnem_id_autocomp').val().trim();
    var ktghely_txt     = $('#ktghely_id_autocomp').val().trim();
    var afakod_id       = $('#afakod_id').val().trim();
    var jogcim_id       = $('#jogcim_id').val().trim();
    var ktgnem_id       = $('#ktgnem_id').val().trim();
    var ktghely_id      = $('#ktghely_id').val().trim();
    var sor_id          = $('#tetel_sor_id').val().trim();

    van_valtozas = true;

    /* Üres adatok ellenőrzése */
    if( !targy ){
        alert2('Kérem töltse ki a tárgyat!', '', 'Hiba');
        $('#pop_targy').addClass('hibas_ide_focus');
        return false;
    }

    if( !ertek || (!nullas && ( ertek=='0' || ertek=='0,00' ) ) ) {
        alert2('Kérem töltse ki a nettó értéket!', '', 'Hiba');
        $('#pop_ertek').addClass('hibas_ide_focus');
        return false;
    }

    if( !brutto || (!nullas && ( brutto=='0' || brutto=='0,00' ) ) ) {
        alert2('Kérem töltse ki a bruttó értéket!', '', 'Hiba');
        $('#pop_brutto').addClass('hibas_ide_focus');
        return false;
    }
    
    if( !afakod_id ){
        alert2('Kérem töltse ki az áfakódot!', '', 'Hiba');
        $('#afakod_id_autocomp').addClass('hibas_ide_focus');
        return false;
    }
    
    if( !jogcim_id ){
        alert2('Kérem töltse ki a jogcímet!', '', 'Hiba');
        $('#jogcim_id_autocomp').addClass('hibas_ide_focus');
        return false;
    }

    var id_tmp = new Date().getTime();
    
    /* Ha ismert a sor_id, akkor update */
    if( sor_id ) {

        $('.pop_tetel_'+sor_id+' .pop_targy').html( targy );
        $('.pop_tetel_'+sor_id+' .pop_netto_ert').html( ertek );
        $('.pop_tetel_'+sor_id+' .pop_brutto_ert').html( brutto );
        $('.pop_tetel_'+sor_id+' .pop_afakod_autocomp').val( afakod_txt );
        $('.pop_tetel_'+sor_id+' .pop_afakod').val( afakod_id );
        $('.pop_tetel_'+sor_id+' .pop_jogcim_autocomp').val( jogcim_txt );
        $('.pop_tetel_'+sor_id+' .pop_jogcim').val( jogcim_id );
        $('.pop_tetel_'+sor_id+' .pop_valtozott').val( 1 );

    /* Egyébként új sor hozzáadása */
    } else {
        
        var table_sor = '<tr class="pop_tetel_'+id_tmp+'">' +
                            '<td class="pop_targy l">' + targy + '</td>' +
                            '<td class="pop_netto_ert r nowrap">' + ertek + '</td>' +
                            '<td class="pop_brutto_ert r nowrap">' + brutto + '</td>' +
                            '<td class="l pop_jogcim_autocomp">'+jogcim_txt+'</td>' +
                            '<td class="l pop_ktgnem_autocomp">'+ktgnem_txt+'</td>' +
                            '<td class="l pop_ktghely_autocomp">'+ktghely_txt+ '</td>' +
                            '<td></td>' +
                            /*'<td><a class="szerk" onclick="popup_tetel_sor_szerk(\'pop_tetel_'+id_tmp+'\');">🖉</a></td>' +*/
                            '<td><a onclick="popup_tetel_sor_torol(\'pop_tetel_'+id_tmp+'\');"><span class="icon"><i class="material-icons">delete</i></span></a>'+
                                '<input type="hidden" class="pop_afakod_autocomp" name="pop_afakod_autocomp" value="'+afakod_txt+'">' +
                                '<input type="hidden" class="pop_afakod" name="pop_afakod_id" value="'+afakod_id+'">' +
                                '<input type="hidden" class="pop_jogcim" name="pop_jogcim_id" value="'+jogcim_id+'">' +
                                '<input type="hidden" class="pop_valtozott" value="1">' +               
                                '<input type="hidden" class="pop_recid" name="recid" value="'+sor_id+'">' +        
                            '</td>' +
                        '</tr>';

        $('#pop_tetelek tbody').append( table_sor );
        $('#pop_tetelek').removeClass('dn');
        
    }

    $('#pop_targy').val('');
    $('#pop_ertek').val('');
    $('#pop_brutto').val('');
    $('#afakod_id_autocomp').val('');
    $('#afakod_id').val('');
    $('#jogcim_id_autocomp').val('');
    $('#jogcim_id').val('');
    $('#ktgnem_id_autocomp').val('');
    $('#ktgnem_id').val('');
    $('#ktghely_id_autocomp').val('');
    $('#ktghely_id').val('');
    $('#tetel_sor_id').val('');
    $('#hozzaad_gomb').val('Új tétel hozzáadása');

    $('#pop_targy').focus();
    
    $('.pop_mentes_megsem').removeClass('dn');
    
    /* A tétel sorokat csak Session-ba, kimentjük. DB-be még nem menethetünk csak, ha a Mentés gombra kattintottak. */

}

/* Tétel sor törlése */
function popup_tetel_sor_torol(sor_id, mehet){
    
    van_valtozas = true;
    
    $('.'+sor_id).addClass('torles_elott');
    if(!mehet){
        alert2( 'Tárgy: '        + $('.'+sor_id+' .pop_targy')   .html() +'<br>' +
                'Nettó érték: '  + $('.'+sor_id+' .pop_netto_ert').html() +' ' + akt_penznem + '<br>' +
                'Biztosan törli a számla tételt?', '<input type="button" class="gomb zold" value="Igen" onclick="popup_tetel_sor_torol(\''+sor_id+'\', \'mehet\'); alert2();"><input type="button" class="gomb piros escapes_megsem" value="Nem" onclick="alert2(); $(\'.torles_elott\').removeClass(\'torles_elott\');">');
        return false;
    }
    
    /* Sor törlése, újraszámolás */
    $('.'+sor_id).fadeOut('slow', function(){
        $('.'+sor_id).remove();
    });
    
    /* Popup mentésekor ez alapján töröljük ki majd a sort */
    torolt_sorok += sor_id;
    
    $('#pop_targy').focus();
    
    $('.pop_mentes_megsem').removeClass('dn');
    
    /* A tétel sorokat csak Session-ba, kimentjük. DB-be még nem menethetünk csak, ha a Mentés gombra kattintottak. */
}

/* Tétel szerkesztése  */
function popup_tetel_sor_szerk(sor_id){
    
    /* Sor törlése, újraszámolás */
    $('#pop_targy').val( $('.'+sor_id+' .pop_targy').html() );
    $('#pop_ertek').val( $('.'+sor_id+' .pop_netto_ert').html() );
    $('#pop_brutto').val( $('.'+sor_id+' .pop_brutto_ert').html() );
    $('#jogcim_id_autocomp').val( $('.'+sor_id+' .pop_jogcim_autocomp').html() );
    $('#jogcim_id').val( $('.'+sor_id+' .pop_jogcim').val() );
    $('#ktgnem_id_autocomp').val( $('.'+sor_id+' .pop_ktgnem_autocomp').html() );
    $('#ktgnem_id').val( $('.'+sor_id+' .pop_ktgnem').val() );
    $('#ktghely_id_autocomp').val( $('.'+sor_id+' .pop_ktghely_autocomp').html() );
    $('#ktghely_id').val( $('.'+sor_id+' .pop_ktghely').val() );
    $('#tetel_sor_id').val( sor_id.replace('pop_tetel_', '') );
    
    $('#hozzaad_gomb').val('Tétel szerkesztése');
    
    $('#pop_targy').focus();
    
}

/* Tétel sor táblázat mentése */
function tetel_sorok_ment( bezar_nelkul ){
    
    var recidk = [];
    $('.pop_recid').each(function() {
        recidk.push( $(this).val() );
    });
    var targyak = [];
    $('.pop_targy').each(function() {
        targyak.push( $(this).html().replace(/"/g, '{IDEZOJEL}') );
    });
    var netto_ert = [];
    $('.pop_netto_ert').each(function() {
        netto_ert.push( $(this).html().replace(/,/g, '.') );
    });
    var brutto_ert = [];
    $('.pop_brutto_ert').each(function() {
        brutto_ert.push( $(this).html().replace(/,/g, '.') );
    });
    var afakodok = [];
    $('.pop_afakod').each(function() {
        afakodok.push( $(this).val() );
    });
    var jogcimek = [];
    $('.pop_jogcim').each(function() {
        jogcimek.push( $(this).val() );
    });
    var valtozott = [];
    $('.pop_valtozott').each(function() {
        valtozott.push( $(this).val() );
    });
    var szerzodes_recid = [];
    $('.pop_szerzodes_recid').each(function() {
        szerzodes_recid.push( $(this).val() );
    });
    
    var adatok = [
                    ['recidk',          recidk],
                    ['targyak',         targyak],
                    ['netto_ert',       netto_ert],
                    ['brutto_ert',      brutto_ert],
                    ['afakodok',        afakodok],
                    ['jogcimek',        jogcimek],
                    ['valtozott',       valtozott],
                    ['szerzodes_recid', szerzodes_recid]
                ];

    /* A számla nettó értéke az Adatlapon található mező értéke 
     * De ha nem az adatlapon vagyunk, akkor meg egy rejtett inputban megtaláljuk, hogy a DB-ben mi van letárolva */
    var osszeg_mezo     = 'netto';
    var br_osszeg_mezo  = 'brutto';
    if( akt_penznem && akt_penznem != 'HUF' ) {
        osszeg_mezo     = 'dev_net';
        br_osszeg_mezo  = 'dev_br';
    }
    var szamla_netto_erteke = '';
    if( $('#'+osszeg_mezo).length ){
        szamla_netto_erteke = $('#'+osszeg_mezo).val();
    } else {
        szamla_netto_erteke = $('#'+osszeg_mezo+'_db').val();
    }
    var szamla_brutto_erteke = '';
    if( $('#'+br_osszeg_mezo).length ){
        szamla_brutto_erteke = $('#'+br_osszeg_mezo).val();
    } else {
        szamla_brutto_erteke = $('#'+br_osszeg_mezo+'_db').val();
    }
    
    $.ajax({
        url : 'fenntartasi_szamla.php',
        type: 'POST',
        data: {
            adatok              : JSON.stringify(adatok),
            recid               : _get('id'),
            kcs_21              : kcs_21,
            arfolyam            : $('#arfolyam_db').val(),
            torolt_sorok        : torolt_sorok,
            szamla_netto_erteke : szamla_netto_erteke,
            szamla_brutto_erteke: szamla_brutto_erteke,
            tetel_sorok_ment    : Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);
                if( response.hiba ) {
                    alert2(response.hiba, response.gomb, response.title);
                } else {
                    
                    /* Adatlapot csak akkor frissítünk, és popupot csak akkor zárunk ha DB-be is elmentjük */
                    if( _get('tetel') ){
                        szamlaBetolt(_get('id'), 'fenntartasi_szamla.php');
                    }
                    popupZar();
                    $('#ossz_'+osszeg_mezo).val( response.netto );
                    
                }
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });

}

/* Ha van SESSION-ban adatunk, akkor abból töltsük fel a sorokat */
function pop_tetelek_feltolt(){
    
    var andoc_id = '';
    if( _get('andoc_id') ) {
        andoc_id = _get('andoc_id');
    }
    
    $.ajax({
        url : 'fenntartasi_szamla.php',
        type: 'POST',
        data: {
            id                  : _get('id'),
            andoc_id            : andoc_id,
            pop_tetelek_feltolt : Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);
                
                if(response.hiba){
                    alert2(response.hiba, response.gomb, response.title);
                    if( response.focus ){
                        $('#'+response.focus).addClass('hibas_ide_focus');
                    }
                    popupZar();
                    return false;
                }
                
                if(response.html){
                    $('#pop_tetelek tbody').append(response.html);
                    $('#pop_tetelek').removeClass('dn');
                }
                if(response.pr_tetelek){
                    $('#projekt_tetelek').html(response.pr_tetelek);
                }
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
}

/* Ez lényegében ugyanaz mint a csoportMuvelet() JS függvény, csak itt átadunk még egy számla tétel recid-t */
function kapcsolas_popup_nyit( recid ) {
    
    /* Szerződés szám mező aktuális tartalma */
    if( $('#sz_szam').length ){
        sz_szam = $('#sz_szam').val();
        /* Ha az adatlapon vagyunk, és a szerződés szám még nincs mentve, akkor hibát dobunk */
        if( $('#sz_szam').hasClass('mod') ){
            alert2('Kapcsolás előtt mentsen szerződésszámot a számla adatlapján!', '', 'Hiba');
            return false;
        }
    } else {
        sz_szam = $('#sz_szam_db').val();
    }
    
    if( van_valtozas ){
        alert2('Szerződés tételhez kapcsolás előtt mentse a változásokat!', '', 'Hiba');
    }else if(!sz_szam){
