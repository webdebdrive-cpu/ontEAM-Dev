<h2>Társrészlegek kezelése</h2>
<form action="" id="addReszlegForm" class="popupForm" method="post">
    <div class="kozep" style="min-height: 26rem; width: 50rem">
        <div class="dt szalloda_hozzaad">
            <div class="dtr">
                <div class="dtc">
                </div>
                <div class="dtc form_jobb">
                    <div class="szallodak_keret">
                        <div id="addReszlegek" class="dt szallodak"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
    </div>
</form>
<script>
$(document).ready(function(){
    $('#addReszlegForm').attr('onsubmit', 'return addReszleg(\'' + _get('id') + '\', this);');
});
function addReszleg( loginID, that ) {

    var reszlegek = $(that).find('input[name="reszleg[]"]:checked');
    var data = {};
    reszlegek.each(function(i) {
        var value = $(this).val();
        data[i] = value;
    });

    /* Új feltöltéskor csak hidden inputba tesszük az adatokat. */
    if(_get('uj')){
        $('#tarsreszlegek_hidden').val( JSON.stringify(data) );
        popupZar();
        return false;
    }

    if( loginID ) {
        var ajax = $.ajax({
         	url : 'login.php',
         	type: 'GET',
         	data: esamp2es('loginID=' + loginID + '&amp;reszlegIDs=' + JSON.stringify(data) + '&amp;addReszleg=' + new Date().getTime()),
         	success: function(response) {
                if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
         		if( response ) {
                    response = JSON.parse(response);

                    if( response.hiba ) {
                        alert2(response.hiba, response.gomb, response.title);
                        return false;
                    }
                    
                    /* Adatlapon frissítjük a társrészlege listáját */
                    $('#tarsreszlegek').html(response.tarsreszlegek);

                    popupZar();
         		}
         	},
            complete: function(xhr) {
                if( xhr.status != 200 ) {
                    alert2(xhr.responseText, '', 'Hiba');
                }
            }
        });

    }

    return false;
}
</script>
