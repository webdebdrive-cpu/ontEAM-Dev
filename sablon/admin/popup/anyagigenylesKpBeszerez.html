<h2>Készpénzes anyagbeszerzés rögzítése</h2>
<form><!-- A formot ne vedd ki! Kell az enter új mezőbe léptetéséhez!  -->
    <div class="kozep">
        <div class="dt" id="anyagigenylesKpBeszerez" style="width: 65rem">

            <div class="dtr"> 
                <div class="dtc form_bal">Szállító:</div>
                <div class="dtc form_jobb">
                    <input type="text" autocomplete="off" class="oriasi disableNav csillag focus autocomp" name="pop_szallito_autocomp" id="pop_szallito_autocomp" onblur="if(!$(this).val()){ $('#pop_szallito_id').val(''); }" value="">
                    <input type="hidden" name="pop_szallito" id="pop_szallito" value="">
                    <script>
                        $(document).ready(function() {
                            $('#pop_szallito_autocomp').autocomplete({
                                'php_fajl'      : '../autocomplete.php',
                                'tabla'         : 'szallito',
                                'oszlop_keres'  : 'nev',
                                'oszlop_listaz' : 'nev',
                                'id_kiir'       : 'id'
                            });
                        });
                    </script>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Szálloda:</div>
                <div class="dtc form_jobb szalloda_select">
                </div>
                <script>
                    $(document).ready(function() {
                        $.ajax({
                            url : 'esemenyek.php',
                            type: 'POST',
                            data: {
                                get_szalloda_select_options : new Date().getTime()
                            },
                            success: function(response){
                                if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
                                response = JSON.parse(response);
                                $('.szalloda_select').html('<select id="pop_telephely_id" name="pop_telephely_id" class="csillag"><option value="">-Válasszon-</option>'+response.html+'</select>');
                                /* Ha csak egy szálloda van, akkor az legyen is kiválsztva, és a select readonly */
                                if(response.szallodak_szama==1){
                                    $('#pop_telephely_id').val( $('#pop_telephely_id option:last').attr('value') );
                                    $('#pop_telephely_id').attr('readonly', true);
                                }
                            }
                        });
                    });
                </script>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">Cikk:</div>
                <div class="dtc form_jobb">
                    <input type="text" autocomplete="off" class="oriasi disableNav csillag focus autocomp" name="cikk_id_autocomp" id="cikk_id_autocomp" onblur="if(!$(this).val()){ $('#cikk_id').val(''); }" value="">
                    <input type="hidden" name="cikk_id" id="cikk_id" value="">
                    <input type="hidden" name="cikkid_origi" id="cikkid_origi" value="">
                    <script>
                        $(document).ready(function() {
                            $('#cikk_id_autocomp').autocomplete({
                                'php_fajl'      : '../autocomplete.php',
                                'tabla'         : 'cikktorzs',
                                'oszlop_keres'  : 'nev',
                                'oszlop_listaz' : 'nev',
                                'id_kiir'       : 'recid'
                            });
                        });
                    </script>
                </div>
            </div>
            <div class="dtr">
                <div class="dtc form_bal">RB-s anyag:</div>
                <div class="dtc form_jobb wsn">
                    <div class="cb">
                        <input name="pop_kulsosnek" id="pop_kulsosnek" type="checkbox">
                        <label for="pop_kulsosnek"></label>
                    </div>
                </div>
            </div>
        </div>

        <table>
            <tr>
                <td>Mennyiség:</td>
                <td>
                    <input type="text" id="pop_menny" name="pop_menny" class="f_num" data-tort="2" value="0,00" placeholder="" autocomplete="off" style="min-width: 8rem; width: 8rem;">
                    <span class="insertMee"></span>
                </td>

                <td>Nettó egységár:</td>
                <td>
                    <input type="text" id="pop_net_ear" name="pop_net_ear" class="f_num" data-tort="4" value="0,0000" placeholder="" autocomplete="off" style="min-width: 10rem; width: 10rem;"> Ft
                </td>

                <td>Nettó érték:</td>
                <td>
                    <input type="text" id="pop_net_ar" name="pop_net_ar" class="f_num" data-tort="0" value="0" placeholder="" autocomplete="off" style="min-width: 10rem; width: 10rem;"> Ft
                </td>
            </tr>
            <tr>
                <td>ÁFA:</td>
                <td>
                    <input type="text" autocomplete="off" value="27 %" class="oriasi disableNav csillag focus autocomp" name="pop_afa_autocomp" id="pop_afa_autocomp" onblur="if(!$(this).val()){ $('#pop_afa_id').val(''); }" style="min-width: 8rem; width: 8rem;">
                    <input type="hidden" name="pop_afa" id="pop_afa" value="8">
                    <script>
                        $(document).ready(function() {
                            $('#pop_afa_autocomp').autocomplete({
                                'php_fajl'      : '../autocomplete.php',
                                'tabla'         : 'erteklista',
                                'oszlop_keres'  : 'info',
                                'oszlop_listaz' : 'info',
                                'id_kiir'       : 'id',
                                'csoport'       : 22
                            });
                        });
                    </script>
                </td>

                <td>Bruttó egységár:</td>
                <td>
                    <input type="text" id="pop_br_ear" name="pop_br_ear" class="f_num" data-tort="2" value="0,00" placeholder="" autocomplete="off" style="min-width: 10rem; width: 10rem;"> Ft
                </td>

                <td>Bruttó érték:</td>
                <td>
                    <input type="text" id="pop_br_ar" name="pop_br_ar" class="f_num" data-tort="0" value="0" placeholder="" autocomplete="off" style="min-width: 10rem; width: 10rem;"> Ft
                </td>
            </tr>
        </table>

        <div id="insertTable">
            <table class="csikos">
                <tr>
                    <th>Szálloda</th>
                    <th>Cikk</th>
                    <th>Név</th> 
                    <th>RB-s anyag</th>
                    <th class="r">Rendelt mennyiség</th>
                    <th>Mee</th>
                    <th class="r">Nettó egységár</th>
                    <th class="r">Nettó érték</th>
                    <th class="r">Bruttó egységár</th>
                    <th class="r">Bruttó érték</th>
                    <th class="torles"></th>
                </tr>
            </table>
        </div>
    </div>
    <div class="kuldes">
        <input type="button" class="gomb" value="Hozzáad" onclick="munkAnyagKPHozzaad('#anyagigenylesKpBeszerez')" id="kp_hozzaad_gomb">
        <input type="button" class="gomb zold" value="Mentés" onclick="anyagigenylesKPBeszerez('kérdezünk')">
        <input type="button" class="gomb piros" value="Mégsem" onclick="popupZar();" id="nem_gomb">
    </div>
</form>
<script>
/* Mégsem gombon tabozva a feladat inputra érkezzünk vissza */
$(document).on('keydown', '#nem_gomb', function(event) {
    if( event.keyCode == KEY_TAB ) {
        $('#cikk_id_autocomp').focus();
        return false;
    }
});

$(document).on('keyup', '#pop_br_ar', function(e) {
    if (e.which == KEY_ENTER) {
        $('#cikk_id_autocomp').focus();
        $('#kp_hozzaad_gomb').click();
    }
});

$(document).on('keyup', '.f_num', function(e) {
    osszegek_kiszamol($(this));
});
$(document).on('blur', '#pop_afa_autocomp', function(e) {
    osszegek_kiszamol($(this));
});

function osszegek_kiszamol(that){

    /* Kitöltött értékek */
    menny  = $('#pop_menny').val().replace(',', '.').replace(' ', '');
    egyseg = $('#pop_net_ear').val().replace(',', '.').replace(' ', '');
    afa    = $('#pop_afa_autocomp').val().replace('%', '').trim();
    if(afa){
        afa = (afa/100)+1;
    }

    /* Melyik mezőt szerkesztjük */
    id = that.attr('id');

    /* Ha a bruttó mezőben írjuk át az értéket, akkor a nettó egységárat kell meghatározni */
    if(id=='pop_br_ear'){
        egyseg = $('#pop_br_ear').val().replace(',', '.').replace(' ', '')/afa;
        if(menny>0 && egyseg>0 && afa){
            $('#pop_net_ear').val( ezresek(egyseg, 2, ',', ' '));
        }

        $('#pop_br_ar').val( ezresek(menny*egyseg*afa, 0, ',', ' '));
        if(menny>0 && egyseg>0){
            $('#pop_net_ar').val( ezresek(menny*egyseg, 0, ',', ' '));
        }else{
            $('#pop_net_ar').val('0');
        }
    }else if(id=='pop_net_ear'){
        if(menny>0 && egyseg>0 && afa){
            $('#pop_br_ear').val( ezresek(egyseg*afa, 2, ',', ' '));
        }

        $('#pop_br_ar').val( ezresek(menny*egyseg*afa, 0, ',', ' '));
        if(menny>0 && egyseg>0){
            $('#pop_net_ar').val( ezresek(menny*egyseg, 0, ',', ' '));
        }else{
            $('#pop_net_ar').val('0');
        }
    }else if(id=='pop_net_ar'){
        netto_ar = that.val().replace(',', '.').replace(' ', '');
        if(menny>0 && afa){
            $('#pop_net_ear').val( ezresek(netto_ar/menny, 2, ',', ' ') );
            $('#pop_br_ear').val( ezresek(netto_ar/menny*afa, 2, ',', ' ') );
            $('#pop_br_ar').val( ezresek(netto_ar*afa, 0, ',', ' ') );
        }
    }else if(id=='pop_br_ar'){
        pop_br_ar = that.val().replace(',', '.').replace(' ', '');
        if(menny>0 && afa){
            $('#pop_net_ear').val( ezresek(pop_br_ar/menny/afa, 2, ',', ' ') );
            $('#pop_br_ear').val( ezresek(pop_br_ar/menny, 2, ',', ' ') );
            $('#pop_net_ar').val( ezresek(pop_br_ar/afa, 0, ',', ' ') );
        }
    }else if(id=='pop_afa_autocomp'){
        setTimeout(function() {
            afa = $('#pop_afa_autocomp').val().replace('%', '').trim();
            afa = (afa/100)+1;

            if(menny>0 && egyseg>0 && afa){
                $('#pop_br_ear').val( ezresek(egyseg*afa, 2, ',', ' ') );
                $('#pop_br_ar').val( ezresek(menny*egyseg*afa, 2, ',', ' ') );
            }
        }, 1000);
    }
}

/* Készpénzes anyagrendelás táblázat sor hozzáadás */
function munkAnyagKPHozzaad( formID ) {

    var form = $(formID);

    if( !adatellenorzes() ){
        return false;
    }

    rbs = '';
    if($('#pop_kulsosnek').prop('checked')){
        rbs = '<i class="material-icons">done</i>';
    }
    
    id_tmp = new Date().getTime();

    var table_sor = '<tr class="sor_kp_igeny_'+id_tmp+'">' +
                        '<td>' + $('#pop_telephely_id option:selected').text() + '<input type="hidden" name="add_telephely_id[]" value="' + $('#pop_telephely_id').val() + '"></td>' +
                        '<td>' + $('#cikkid_origi').val() + '<input type="hidden" name="addCikkID[]" value="' + $('#cikkid_origi').val() + '"></td>' +
                        '<td>' + $('#cikk_id_autocomp').val() + '</td>' +
                        '<td class="rb">' + rbs + '</td>' +

                        '<td class="r pop_menny">' + $('#pop_menny').val() + '</td>' +
                        '<td>' + form.find('.insertMee').text() + '</td>' +
                        '<td class="r pop_net_ear nowrap" data-afa="'+afa+'">' + $('#pop_net_ear').val() + '</td>' +
                        '<td class="r pop_net_ar nowrap">' + $('#pop_net_ar').val() + '</td>' +
                        '<td class="r nowrap">' + $('#pop_br_ear').val() + '</td>' +
                        '<td class="r nowrap">' + $('#pop_br_ar').val() + '</td>' +

                        '<td><a onclick="munkAnyagKPTorol(\'sor_kp_igeny_'+id_tmp+'\');"><span class="icon"><i class="material-icons">delete</i></span></a></td>' +
                    '</tr>';

    var table_sor_ossz =
                    '<tr class="osseszites" style="border-top: 0.1rem solid #ccc">' +
                        '<td></td>' +
                        '<td></td>' +
                        '<td></td>' +
                        '<td></td>' +

                        '<td class="r"></td>' +
                        '<td></td>' +
                        '<td class="r" style="font-weight: bold">Összesen</td>' +
                        '<td class="r ossz_net nowrap" style="font-weight: bold"></td>' +
                        '<td class="r"></td>' +
                        '<td class="r ossz_br nowrap" style="font-weight: bold"></td>' +

                        '<td></td>' +
                    '</tr>';
            ;

    /* Táblázat összerakása */
    $('#insertTable table.csikos').append(table_sor);
    $('.osseszites').remove();
    $('#insertTable table.csikos').append(table_sor_ossz);

    var ossznett = 0;
    $('.pop_net_ar').each(function() {
        ossznett += Number($(this).html().replace(',', '.').replace(' ', ''));
    });

    $('.ossz_net').html( ezresek(ossznett, 0, ',', ' ') );
    $('.ossz_br').html( ezresek(ossznett*afa, 0, ',', ' ') );

    anyagigenylesKpnullaz(formID);

    document.getElementById('cikk_id_autocomp').select();

    $('#pop_szallito_autocomp').attr('readonly', true);
    $('#pop_telephely_id').attr('readonly', true);

    return false;
}

function anyagigenylesKpnullaz(formID){
    var form = $(formID);

    /* Nullázás */
    $('#cikk_id_autocomp').val('');
    $('#cikk_id').val('');
    $('#cikkid_origi').val('');

    $('#pop_kulsosnek').prop('checked', false);
    $('#pop_menny').val('0,00');
    $('#pop_net_ear').val('0,0000');
    $('#pop_net_ar').val('0');
    $('#pop_br_ear').val('0,00');
    $('#pop_br_ar').val('0');

    form.find('.insertMee').text('');
}
function munkAnyagKPTorol(sor_id, mehet){
    
    $('.'+sor_id).addClass('torles_elott');
    if(!mehet){
        alert2('Biztosan törli ezt az anyagbeszerzést?', '<input type="button" class="gomb zold" value="Igen" onclick="munkAnyagKPTorol(\''+sor_id+'\', \'mehet\'); alert2();"><input type="button" class="gomb piros" value="Nem" onclick="alert2(); $(\'.torles_elott\').removeClass(\'torles_elott\');">');
        return false;
    }
    
    $('.'+sor_id).remove();
    if(!$('input[name="addCikkID[]"]').length){
        $('#pop_szallito_autocomp').attr('readonly', false);
        $('#pop_telephely_id').attr('readonly', false);
    }
}
function adatellenorzes(){
    volt_hiba = false;
    $('input[name="addCikkID[]"]').each(function () {
        if( $(this).val() == $('#cikkid_origi').val() ) {

            alert2('Ez az anyag már hozzá van adva a munkalaptételhez!', '', 'Hiba');
            anyagigenylesKpnullaz(formID);
            $('#cikk_id_autocomp').select();
            volt_hiba = true;


        }
    });
    if(volt_hiba){
        return false;
    }

    if( !$('#pop_szallito_autocomp').val() || !$('#pop_szallito').val() ) {
        $('#pop_szallito_autocomp').addClass('hibas_ide_focus');
        alert2('Válassza ki a szállítót!', '', 'Hiba');
        return false;
    }

    if( !$('#pop_telephely_id').val() ) {
        $('#pop_telephely_id').addClass('hibas_ide_focus');
        alert2('Válassza ki a szállodát!', '', 'Hiba');
        return false;
    }

    if( !$('#cikk_id_autocomp').val() || !$('#cikk_id').val() ) {
        $('#cikk_id_autocomp').addClass('hibas_ide_focus');
        alert2('Válassza ki a cikket!', '', 'Hiba');
        return false;
    }

    if( !$('#pop_menny').val() || $('#pop_menny').val()=='0,00' ) {
        $('#pop_menny').addClass('hibas_ide_focus');
        alert2('Adja meg a rendelt mennyiséget!');
        return false;
    }

    if( !$('#pop_net_ear').val() || $('#pop_net_ear').val()=='0,0000' ) {
        $('#pop_net_ear').addClass('hibas_ide_focus');
        alert2('Adja meg a nettó egységárat!');
        return false;
    }

    if( !$('#pop_afa_autocomp').val() ) {
        $('#pop_afa_autocomp').addClass('hibas_ide_focus');
        alert2('Adja meg az ÁFA-t!');
        return false;
    }

    return true;
}

/* Készpénzes anyagbeszerzés mentése */
function anyagigenylesKPBeszerez(csak_kerdezünk){

    if(csak_kerdezünk){
        tetelek = $('input[name="addCikkID[]"]').length;
        if(!tetelek){
            if( !adatellenorzes() ){
                return false;
            }
            tetelek = 1;
        }
        alert2('A számlán '+tetelek+' db tétel szerepel. Biztosan rögzíti a számlát?', '<input type="button" value="Igen" class="gomb" onclick="anyagigenylesKPBeszerez(); alert2();"> <input type="button" value="Nem" class="gomb piros" onclick="alert2();">');
        return false;
    }

    var anyagok = {};
    var i = 0;
    $('#insertTable table tr').each(function() {
        if(i>0){
            rb = $(this).find('td.rb').html();
            if(rb){
                rb = 1;
            }
            anyagok[i]  =   {
                                cikkszam: $(this).find('input[name="addCikkID[]"]').val(),
                                rb      : rb,
                                menny   : $(this).find('td.pop_menny').html(),
                                ear     : $(this).find('td.pop_net_ear').html(),
                            };
        }
        i++;
    });

    /* Ha üres a táblázat, akkor a mezőben levő adatokból dolgozunk */
    if(!anyagok.length){

            rb = $('#pop_kulsosnek').prop('checked');
            if(rb){
                rb = 1;
            }
            anyagok[i]  =   {
                                cikkszam: $('#cikkid_origi').val(),
                                rb      : rb,
                                menny   : $('#pop_menny').val(),
                                ear     : $('#pop_net_ear').val(),
                            };
    }

    $.ajax({
        url : 'anyagigenyles.php',
        type: 'POST',
        data: {
            szallito_id             : $('#pop_szallito').val(),
            telephely_id            : $('#pop_telephely_id').val(),
            anyagok                 : JSON.stringify(anyagok),
            anyagigenylesKPBeszerez : new Date().getTime()
        },
        success: function(response){
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if(response){
                response = JSON.parse(response);

                if( response.hiba ) {
                    alert2(response.hiba, response.gomb, 'Hiba');
                    return false;
                }

                if( response.alert ) {
                    alert2(response.alert, response.gomb);
                }

                popupZar();
            }
        }
    });

}
</script>
