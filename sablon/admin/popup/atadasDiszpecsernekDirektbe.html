<script>
/* Felvéve státusz alatt ki kell írni, hogy mely anyagok vannak szükséges mennyiséggel, mert ezek törlésre kerülnek */
$(document).ready(function(){
    
    /* Munkalap visszaadás adatok lekérése */
    get_ml_visszavetelezes_input_tartalmak();
    get_csatolmanyok( baseName( location.href ), _get('id') );
    
    $.ajax({
        url : 'munkalap.php',
        type: 'POST',
        data: {
            recid                       : _get('id'),
            szukseges_anyagok_listaja   : Date.now()
        },
        success: function(response){
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if(response){
                response = JSON.parse(response);
                $('#visszaadas_kerdes').html(response.kerdes).css({'margin-top':'2rem'});
            }
        }
    });
});

/* Átadás diszpécsernek */
function atadasDiszpecsernekDirektbe( that ) {
    if(balnav_kijelol_ell()){
        var erteklista_id = $(that).find('input[name="erteklista_id"]'),
                     memo = $(that).find('textarea[name="atadas_memo"]');

        if( erteklista_id ) {
            $.ajax({
                url : 'munkalap.php',
                type: 'POST',
                data: {
                    recid                       : _get('id'),
                    erteklista_id               : erteklista_id.val(),
                    memo                        : memo.val(),
                    email                       : $('#email_kuldessel').val(),
                    mehet                       : $('#mehet_mail_nelkul').val(),
                    cimzett                     : $('#pop_cimzett').val(),
                    masolat                     : $('#pop_masolat').val(),
                    targy                       : $('#pop_targy').val(),
                    uzenet                      : $('#pop_uzenet').val(),
                    atadasDiszpecsernekDirektbe : new Date().getTime()
                },
                success: function(response) {
                    if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
                    if(response) {
                        response = JSON.parse(response);

                        if( response.hiba ) {
                            if( response.gomb ) {
                                alert2(response.hiba, response.gomb, response.title);
                            } else {
                                alert2(response.hiba, response.gomb, response.title);
                                $('#erteklista_id_autocomp').addClass('hibas_ide_focus');
                            }
                            $('#email_kuldessel').val('0');
                            return false;
                        }

                        szurkit();
                        location.reload();
                    }
                }
            });
        } else {
            alert2('Adja meg az átadás okát!', '', 'Hiba');
            $('#erteklista_id_autocomp').addClass('hibas_ide_focus');
        }
    }

    return false;
}

/* Címzett/másolat mezőkhöz adjuk a kiválasztott mailcímet */
function cimzett_add( mezo ){
    
    if(!$('#pop_cimzett_loginbol_autocomp').val()){
        alert2('Kérem előbb válasszon címzettet!', '', 'Hiba');
        return false;
    }
    
    if(!$('#pop_cimzett_loginbol').val()){
        alert2($('#pop_cimzett_loginbol_autocomp').val()+' felhasználónak nem ismert a mailcíme!', '', 'Hiba');
        $('#pop_cimzett_loginbol_autocomp').addClass('hibas_ide_focus');
        return false;
    }
    
    if(mezo=='cimzett'){
        mailcim_hozzafuz( $('#pop_cimzett') );
    }
    if(mezo=='masolat'){
        mailcim_hozzafuz( $('#pop_masolat') );
    }
    
    
    $('#pop_cimzett_loginbol').val('');
    $('#pop_cimzett_loginbol_autocomp').val('').focus();
    
}
/* cimzett_add() függvény kiegészítője: mailcím hozáfűrzése vesszővel elválasztva: ha van vessző ha nincs, mindig jól fűződjön hozzá */
function mailcim_hozzafuz( that ){
    mezo_tartalma = that.val().trim();
    if( that.val() ){
        if( mezo_tartalma.slice(-1) != ',' ){
            mezo_tartalma += ', ';
        }else{
            mezo_tartalma += ' ';
        }
    }
    mezo_tartalma += $('#pop_cimzett_loginbol').val();
    that.val( mezo_tartalma );
}

/* Beolvasás */
$( document ).on('change','#jsff_mailcsatolmany_input' , function(){
    alert2('Feltöltés...', '&nbsp;', 'Információ');
});
var jsff_mailcsatolmany = document.getElementById('jsff_mailcsatolmany'),
    tests_mailcsatolmany_popup = {
        filereader  : typeof FileReader != 'undefined',
        dnd         : 'draggable' in document.createElement('span'),
        formdata    : !!window.FormData,
        progress    : 'upload' in new XMLHttpRequest
    },
    kepformatumok_mailcsatolmany = {
        'image/png' : true,
        'image/jpeg': true,
        'image/gif' : true
    };
function beolvasas_mailcsatolmany_popup(fajlok, ellenorzes_kihagy) {

    var voltmar = [];

    var formData        = tests_mailcsatolmany_popup.formdata ? new FormData() : null;
    var fajlok_kesz     = 0;

    for (var i = 0; i < fajlok.length; i++){

        formData.append('file', fajlok[i]);
        /* Kép megjelenítése egyből: */
        /*elonezet_mailcsatolmany_popup(fajlok[i]);*/

        fajl = fajlok[i];

        var progress_id = 'jsff_mailcsatolmany_popup_' + i;
        var pg = $('<progress id="'+progress_id+'" min="0" max="100" value="0">0</progress>');
        $('#jsff_mailcsatolmany_popup').append(pg);

        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'feltolt_mailcsatolmany.php');

        (function(progress_id, fajl, i){
            xhr.upload.onprogress = function(e){
                var percent = parseInt(e.loaded / e.total * 100);
                $('#' + progress_id).val(percent);
            };
            xhr.onload = function(){
                fajlok_kesz++;
                $('#' + progress_id).val(100);
                $('#' + progress_id).fadeOut(2000, function(){ $('#' + progress_id).next('br').remove(); });

                if(this.responseText.substring(0,5)=='Hiba!') {
                    if( this.responseText.substring(5) == 'A fájl létezik!' ) {
                        voltmar[i] = fajl;
                    } else {
                        alert2(this.responseText.substring(5), '', 'Hiba');
                    }
                }else{
                    /* Csatolmányok kiíratása */
                    get_csatolmanyok( baseName( location.href ), _get('id') );
                    if (fajlok_kesz == fajlok.length){
                        minden_fajl_kesz_mailcsatolmany_popup();
                    }
                }

                if(fajlok_kesz == fajlok.length){
                    if( voltmar.length ) {
                        fajl_feluliras_alert_mailcsatolmany_popup(voltmar);
                        $('#jsff_mailcsatolmany_popup progress').hide();
                    }
                }
            };
        }(progress_id, fajl, i));

        var parameterek = {'megnevezes':'mailcsatolmany_popup', 'konyvtar':'munkalap', 'sorid':_get('id')};
        $.each(parameterek, function(kulcs, ertek){
            formData.append(kulcs, ertek);
        });

        formData.append('ellenorzes_kihagy', ellenorzes_kihagy);

        xhr.send(formData);

    }

    if( ellenorzes_kihagy ) {
        alert2('');
    }
}
felulirando_fajlok = false;
function fajl_feluliras_alert_mailcsatolmany_popup(tomb) {
    if( tomb ) {
        nevek = 'A következő fájlok már léteznek, felülírja őket?';
        for (var i = 0; i < tomb.length; i++){
            nevek += '<p>' + tomb[i].name + '</p>';
        }

        $('#jsff_mailcsatolmany_popup progress').hide();

        felulirando_fajlok = tomb;
        alert2(nevek, '<input class="gomb zold" value="Igen" onclick="fajl_feluliras_mailcsatolmany_popup();" type="button"><input class="gomb piros" value="Nem" onclick="alert2()" type="button">', 'Hiba');
    }
}

function fajl_feluliras_mailcsatolmany_popup() {
    beolvasas_mailcsatolmany_popup(felulirando_fajlok, true);

    felulirando_fajlok = false;
}

/* Ha minden fájl feltöltése kész, akkor itt adhat meg további utasítás */
function minden_fajl_kesz_mailcsatolmany_popup(){
    alert2('');
    $('#jsff_mailcsatolmany_popup').find('progress').fadeOut(2000, function(){ $('#' + progress_id).next('br').remove(); });

}

/* Ha működik a drag&drop, akkor a CSS class-t megváltoztatjuk draghoverre */
if(tests_mailcsatolmany_popup.dnd){

    jsff_mailcsatolmany.ondragover = function(){
        this.className = 'jsff hover';
        return false;
    };

    jsff_mailcsatolmany.ondragleave = function(){
        this.className = 'jsff';
        return false;
    };

    jsff_mailcsatolmany.ondrop = function(e){
        this.className = 'jsff';
        e.preventDefault();
        beolvasas_mailcsatolmany_popup(e.dataTransfer.files, false);
    };

}
</script>
