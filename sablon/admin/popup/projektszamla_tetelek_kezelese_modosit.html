<h2>Számla tételek kezelése</h2>

<div class="kozep">
    
    <div class="grid2o" style="width: 28rem">
        <div class="b">Számla összege:</div>
        <div class="b r"><span id="pop_szamla_netto"></span></div>
        <div class="b">Tételek  összege:</div>
        <div class="b r"><span id="pop_tetelek_ossz"></span></div>
        <div class="b">Különbség:</div>
        <div class="b r"><span id="pop_kulonbseg"></span></div>
    </div>
    
    <br>Tárgy:
    <br><input type="text" id="pop_targy" class="oriasi csillag">
    <br>Nettó érték:
    <br><input type="text" id="pop_ertek" class="f_num csillag" data-tort="0"> <span class="f_penznem"></span>
    
    <br><input type="button" class="gomb" value="Új tétel hozzáadása" style="margin-top: 0.3rem" onclick="tetel_hozzaadasa()">
    
    <form action="" enctype="multipart/form-data" method="" id="popup_tetel_sorok">
        <table class="csikos kijCont dn" id="pop_tetelek" style="cursor: default;">
            <thead>
            <tr>
                <th>Tárgy</th>
                <th>Nettó érték (<span class="f_penznem"></span>)</th>
                <th>Szerződés tétel</th>
                <th>Törlés</th>
            </tr>
            </thead>

            <tbody>
            </tbody>
        </table>
    </form>
    
</div>
<div class="kuldes">
    <input type="button" class="gomb zold dn pop_mentes_megsem" value="Mentés" onclick="tetel_sorok_ment('bezárás nélkül')">
    <input type="button" class="gomb kek dn pop_mentes_megsem" value="Mégsem" onclick="megsem_gomb();">
    <input type="button" class="gomb piros escapes_megsem" value="Bezár" onclick="bezar_gomb();">
</div>
<script>
var akt_penznem = $('#kcs_21_autocomp').val();
if( !akt_penznem ) {
    akt_penznem = $('#kcs_21_autocomp_db').val();
}

var kcs_21 = $('#kcs_21').val();
if( !kcs_21 ) {
    kcs_21 = $('#kcs_21_db').val();
}

/* JS-el figyeljük, hogy volt-e bármi változás. Ha igen, akkor Mégsem/Bezár gombra rákérdezünk, hogy biztos-e? */
var van_valtozas = false;

$(document).ready(function () {
    
    /* Popup bezár gombjára visszatesszük az eredeti funkciót, mert a kapcsoló popban felülírtuk egy csoportMuvelet-es utasítással */
    $('#popup .bezar').attr('onclick', '');
    
    /* f_penznem class-ú elemek lecserélése a pénznemre */
    $('.f_penznem').each(function () {
        $(this).replaceWith(akt_penznem);
    });
    
    pop_tetelek_feltolt();
    
});

/* Tételt hozzáadó függvény */
function tetel_hozzaadasa() {
    
    var targy       = $('#pop_targy').val().trim();
    var ertek       = $('#pop_ertek').val().trim();
    
    van_valtozas = true;

    /* Üres adatok ellenőrzése */
    if( !targy ){
        alert2('Kérem töltse ki a tárgyat!', '', 'Hiba');
        $('#pop_targy').addClass('hibas_ide_focus');
        return false;
    }

    if( !ertek /*|| ertek=='0' A nulla megengedett a 0-ás számák miatt */ ){
        alert2('Kérem töltse ki a nettó értéket!', '', 'Hiba');
        $('#pop_ertek').addClass('hibas_ide_focus');
        return false;
    }

    var id_tmp = new Date().getTime();

    var table_sor = '<tr class="pop_tetel_'+id_tmp+'">' +
                        '<td class="pop_targy l">' + targy + '</td>' +
                        '<td class="pop_netto_ert r">' + ertek + '</td>' +
                        '<td></td>' + 
                        '<td><a onclick="popup_tetel_sor_torol(\'pop_tetel_'+id_tmp+'\');"><span class="icon"><i class="material-icons">delete</i></span></a></td>' +
                    '</tr>';

    $('#pop_tetelek tbody').append( table_sor );
    $('#pop_tetelek').removeClass('dn');

    $('#pop_targy').val('');
    $('#pop_ertek').val('');

    tetelek_kiszamol();

    $('#pop_targy').focus();
    
    $('.pop_mentes_megsem').removeClass('dn');
    
    /* A tétel sorokat csak Session-ba, kimentjük. Ez azért van, mert a tételek kezelése popupra rányitjuk a kapcsolás popupot, majd visszatérve ide (azaz újra betöltve) 
     * SESSION-ből lehessen reprodukálni, de DB-be még nem menethetünk csak, ha a Mentés gombra kattintottak. */

}

/* Tétel sor törlése */
function popup_tetel_sor_torol(sor_id, mehet){
    
    van_valtozas = true;
    
    $('.'+sor_id).addClass('torles_elott');
    if(!mehet){
        alert2( 'Tárgy: '        + $('.'+sor_id+' .pop_targy')   .html() +'<br>' +
                'Nettó érték: '  + $('.'+sor_id+' .pop_netto_ert').html() +' ' + akt_penznem + '<br>' +
                'Biztosan törli a számla tételt?', '<input type="button" class="gomb zold" value="Igen" onclick="popup_tetel_sor_torol(\''+sor_id+'\', \'mehet\'); alert2();"><input type="button" class="gomb piros escapes_megsem" value="Nem" onclick="alert2(); $(\'.torles_elott\').removeClass(\'torles_elott\');">');
        return false;
    }
    
    /* Sor törlése, újraszámolás */
    $('.'+sor_id).fadeOut('slow', function(){
        $('.'+sor_id).remove();
        tetelek_kiszamol();
    });
    
    $('#pop_targy').focus();
    
    $('.pop_mentes_megsem').removeClass('dn');
    
    /* A tétel sorokat csak Session-ba, kimentjük. Ez azért van, mert a tételek kezelése popupra rányitjuk a kapcsolás popupot, majd visszatérve ide (azaz újra betöltve) 
     * SESSION-ből lehessen reprodukálni, de DB-be még nem menethetünk csak, ha a Mentés gombra kattintottak. */
}

/* Tétel sor táblázat mentése */
function tetel_sorok_ment( bezar_nelkul ){
    
    var recidk = [];
    $('.pop_recid').each(function() {
        recidk.push( $(this).html() );
    });
    var targyak = [];
    $('.pop_targy').each(function() {
        targyak.push( $(this).html().replace(/"/g, '{IDEZOJEL}') );
    });
    var netto_ert = [];
    $('.pop_netto_ert').each(function() {
        netto_ert.push( $(this).html().replace(/,/g, '.') );
    });
    var pr_tetel = [];
    $('.pop_pr_tetel').each(function() {
        pr_tetel.push( $(this).attr('data-pr_tetel_recid') );
    });
    
    var adatok = [
                    ['recidk',    recidk],
                    ['targyak',   targyak],
                    ['netto_ert', netto_ert],
                    ['pr_tetel',  pr_tetel]
                ];
    
    /* A szerződés összege az Adatlapon található mező értéke 
     * De ha nem az adatlapon vagyunk, akkor meg egy rejtett inputban megtaláljuk, hogy a DB-ben mi van letárolva */
    var osszeg_mezo = 'netto';
    if( akt_penznem && akt_penznem != 'HUF' ) {
        osszeg_mezo = 'dev_net';
    }
    var szamla_netto_erteke = '';
    if( $('#'+osszeg_mezo).length ){
        szamla_netto_erteke = $('#'+osszeg_mezo).val();
    } else {
        szamla_netto_erteke = $('#'+osszeg_mezo+'_db').val();
    }
    
    $.ajax({
        url     : 'projektszamla.php',
        type    : 'POST',
        data: {
            adatok                  : JSON.stringify(adatok),
            recid                   : _get('id'),
            kcs_21                  : kcs_21,
            szamla_netto_erteke     : szamla_netto_erteke,
            tetel_sorok_ment_modosit: Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);
                if( response.hiba ) {
                    alert2(response.hiba, response.gomb, response.title);
                } else {
                    
                    /* Adatlapot csak akkor frissítünk, és popupot csak akkor zárunk ha DB-be is elmentjük */
                    if( _get('tetel') ){
                        szamlaBetolt(_get('id'), 'projektszamla.php', 'tetel');
                    }
                    if( !bezar_nelkul ){
                        popupZar();
                    } else {
                        csoportMuvelet('projektszamla_tetelek_kezelese_modosit');
                    }

                }
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });

}

/* Ha van SESSION-ban adatunk, akkor abból töltsük fel a sorokat */
function pop_tetelek_feltolt(){
    
    /* Nettó érték mező aktuális tartalma */
    if( $('#netto').length ) {
        netto = $('#netto').val().replace(/ /g, '');
    } else {
        netto = $('#netto_db').val().replace(/ /g, '');
    }
    
    /* Deviza nettó érték mező aktuális tartalma */
    if( $('#dev_net').length ) {
        dev_net = $('#dev_net').val().replace(/ /g, '');
    } else {
        dev_net = $('#dev_net_db').val().replace(/ /g, '');
    }
    
    /* Deviza nettó érték mező aktuális tartalma */
    if( $('#kcs_21').length ) {
        kcs_21 = $('#kcs_21').val().replace(/ /g, '');
    } else {
        kcs_21 = $('#kcs_21_db').val().replace(/ /g, '');
    }
    
    /* Szerződés szám mező aktuális tartalma */
    if( $('#sz_szam').length ) {
        sz_szam = $('#sz_szam').val();
    } else {
        sz_szam = $('#sz_szam_db').val();
    }
    
    $.ajax({
        url : 'projektszamla.php',
        type: 'POST',
        data: {
            id                          : _get('id'),
            sz_szam                     : sz_szam,
            netto                       : netto,
            dev_net                     : dev_net,
            kcs_21                      : kcs_21,
            pop_tetelek_feltolt_modosit : Date.now()
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);
                
                if(response.hiba){
                    alert2(response.hiba, response.gomb, response.title);
                    if( response.focus ){
                        $('#'+response.focus).addClass('hibas_ide_focus');
                    }
                    popupZar();
                    return false;
                }
                
                if(response.html){
                    $('#pop_tetelek tbody').append(response.html);
                    $('#pop_tetelek').removeClass('dn');
                }
                if(response.pr_tetelek){
                    $('#projekt_tetelek').html(response.pr_tetelek);
                }
                tetelek_kiszamol();
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
}

/*  Tételek kiszámítása, lássuk hol járunk a számla nettó értékéhez képest */
function tetelek_kiszamol() {
    
    /* HUF esetén nem törtet írunk ki, deviza esetén viszont törtet + "Számla várh. értéke" mező is törté kell alakítani */
    var osszeg_mezo = 'netto';
    var tizedesek   = 0;
    if( akt_penznem && akt_penznem != 'HUF' ) {
        osszeg_mezo = 'dev_net';
        tizedesek   = 2;
        $('#pop_ertek').attr('data-tort', '2');
    }

    if( $('#'+osszeg_mezo).length ){
        szamla_netto_erte = $('#'+osszeg_mezo).val().replace(/ /g, '').replace(/,/g, '.');
    } else {
        szamla_netto_erte = $('#'+osszeg_mezo+'_db').val().replace(/ /g, '').replace(/,/g, '.');
    }
    $('#pop_szamla_netto').html( ezresek(szamla_netto_erte, tizedesek, ',', ' ')+' '+akt_penznem );
    
    tetelek_ossz = 0;
    $('.pop_netto_ert').each(function() {
        tetelek_ossz += Number( $(this).html().replace(/ /g, '').replace(/,/g, '.') );
    });
    kulonbseg = Number(szamla_netto_erte) - Number(tetelek_ossz);

    kulonbseg = ezresek( kulonbseg, tizedesek, ',', ' ' );
    if( !kulonbseg ) {
        kulonbseg = '0';
    }
    
    tetelek_ossz = ezresek(tetelek_ossz, tizedesek, ',', ' ');
    if( !tetelek_ossz ) {
        tetelek_ossz = '0';
    }
    $('#pop_tetelek_ossz').html( tetelek_ossz+' '+akt_penznem );

    $('#pop_kulonbseg').html( kulonbseg+' '+akt_penznem );
    $('#pop_kulonbseg').removeClass('piros');
    if( kulonbseg!=0 && kulonbseg!='0,00' ) {
        $('#pop_kulonbseg').addClass('piros');
    }
}

/* Ez lényegében ugyanaz mint a csoportMuvelet() JS függvény, csak itt átadunk még egy számla tétel recid-t */
function kapcsolas_popup_nyit( recid ) {
    
    /* Szerződés szám mező aktuális tartalma */
    if( $('#sz_szam').length ){
        sz_szam = $('#sz_szam').val();
        /* Ha az adatlapon vagyunk, és a szerződés szám még nincs mentve, akkor hibát dobunk */
        if( $('#sz_szam').hasClass('mod') ){
            alert2('Kapcsolás előtt mentsen szerződésszámot a számla adatlapján!', '', 'Hiba');
            return false;
        }
    } else {
        sz_szam = $('#sz_szam_db').val();
    }
    
    if( van_valtozas ){
        alert2('Szerződés tételhez kapcsolás előtt mentse a változásokat!', '', 'Hiba');
    }else if(!sz_szam){
        alert2('Tételek kapcsolásához kérem előbb adjon egy szerződést a projekt számlához!', '', 'Hiba');
    } else {
        $.get('../sablon/admin/popup/projektszamla_kapcsolas.html?cache=' + new Date().getTime(), function( data ) {
            $('#popupTart').html( data.replace('{SZAMLA_TETEL_RECID}', recid) );
            popupNyit();
        });
    }
    
    
}

/* Azért van külön függvénye, hogy rá lehessen kérdezni */
function megsem_gomb( mehet ) {
    
    /* Ha volt változtatás, és nem volt még kérdés */
    if( van_valtozas && !mehet ){
        alert2('A változások nincsenek mentve. Folytatja?', '<input type="button" class="gomb zold" value="Igen" onclick="megsem_gomb(\'mehet\')"><input type="button" class="gomb piros escapes_megsem" value="Nem" onclick="alert2();">', 'Kérdés');
    } else {
        csoportMuvelet('projektszamla_tetelek_kezelese_modosit');
        alert2();
    }
    
}

/* Azért van külön függvénye, hogy rá lehessen kérdezni */
function bezar_gomb( mehet ) {
    
    /* Ha volt változtatás, és nem volt még kérdés */
    if( van_valtozas && !mehet ){
        alert2('A változások nincsenek mentve. Folytatja?', '<input type="button" class="gomb zold" value="Igen" onclick="bezar_gomb(\'mehet\')"><input type="button" class="gomb piros escapes_megsem" value="Nem" onclick="alert2();">', 'Kérdés');
    } else {
        alert2();
        popupZar();
        /* Ez miért kellett? Csak mert gondot okozott, ha új számlát töltünk fel, bezárjuk a tétel kezelés, és frissíteni az adatlapot, ezért rákérdez, hogy biztosan elhagyjuk-e mentés nélkül... emiatt lett kiszedve.
         * szamlaBetolt(_get('id'), 'projektszamla.php', 'modosit');*/
    }
    
}
</script>
