<h2>Új megjegyzés hozzáadása</h2>
<form action="" id="addMegjegyzes" class="popupForm" method="post">
    <div class="kozep">
        <div class="dt">
            <div class="dtr"> 
                <div class="dtc form_bal">Megjegyzés:</div>
                <div class="dtc form_jobb">
                    <textarea name="megjegyzes" id="megjegyzes" class="gombm disableNav focus csillag" onkeyup="if( $(this).val().trim()=='' ){ $(this).val(''); }"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
    </div>
</form>
