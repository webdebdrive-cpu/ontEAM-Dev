<h2>Új Szálloda hozzáadása</h2>
<form action="" id="addSzallodaForm" class="popupForm" method="post">
    <div class="kozep" style="min-height: 26rem; width: 50rem">
        <div class="dt szalloda_hozzaad">
            <div class="dtr">
                <div class="dtc">
                    <input type="button" name="megsem" class="gomb" value="Pesti szállodák" onclick="szallodakJelol( 'pesti' );" style="width: 13rem">
                    <input type="button" name="megsem" class="gomb" value="Vidéki szállodák" onclick="szallodakJelol( 'videki' );" style="width: 13rem">
                    <input type="button" name="megsem" class="gomb" value="Mind jelölése" onclick="szallodakJelol( 'mind' );" style="width: 13rem">
                    <input type="button" name="megsem" class="gomb" value="Mind ürítése" onclick="szallodakJelol( 'urit' );" style="width: 13rem">
                </div>
                <div class="dtc form_jobb">
                    <div class="szallodak_keret">
                        <div id="addSzallodak" class="dt szallodak"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
    </div>
</form>
