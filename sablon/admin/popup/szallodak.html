<h2>Új Szálloda hozzáadása</h2>
<form id="addSzallodaForm" class="popupForm" method="post">
    <div class="kozep" style="min-height: 26rem; width: 72rem">
        <div class="dt szalloda_hozzaad">
            <div class="dtr">
                <div class="dtc">
                    <input type="button" name="megsem" class="gomb" value="Pesti szállodák" onclick="szallodakJelol( 'pesti' );" style="width: 13rem">
                    <input type="button" name="megsem" class="gomb" value="Vidéki szállodák" onclick="szallodakJelol( 'videki' );" style="width: 13rem">
                    <input type="button" name="megsem" class="gomb" value="Mind jelölése" onclick="szallodakJelol( 'mind' );" style="width: 13rem">
                    <input type="button" name="megsem" class="gomb" value="Mind ürítése" onclick="szallodakJelol( 'urit' );" style="width: 13rem">
                </div>
                <div class="dtc form_jobb">
                    <div class="szallodak_keret">
                        <div id="addSzallodak" class="dt szallodak"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
    </div>
</form>
<script>
$(document).ready(function(){
    $('#addSzallodaForm').attr('onsubmit', 'return addSzalloda(\'' + _get('id') + '\', this);');

    // Egy szállodánál ugyanaz a felhasználó nem lehet elsődleges és másodlagos aláíró is
    $('#addSzallodaForm').on('change', 'input[name="alairo1[]"], input[name="alairo2[]"]', function() {
        if( $(this).is(':checked') ) {
            var masik = $(this).attr('name') == 'alairo1[]' ? 'alairo2[]' : 'alairo1[]';
            $('#addSzallodaForm input[name="' + masik + '"][value="' + $(this).val() + '"]').prop('checked', false);
        }
    });
});
function addSzallodaPipak( that, nev ) {
    var data = {};
    $(that).find('input[name="' + nev + '"]:checked').each(function(i) {
        data[i] = $(this).val();
    });
    return data;
}
function addSzalloda( loginID, that, felulir ) {

    var data = addSzallodaPipak(that, 'telephely[]');

    /* Új feltöltéskor csak hidden inputba tesszük az adatokat. */
    if(_get('uj')){
        $('#szallodak_hidden').val( JSON.stringify(data) );
        popupZar();
        return false;
    }

    // Beszerzési aláírók (csak létező felhasználónál vannak ilyen pipák)
    var alairo_jeloles = $(that).find('input[name="alairo1[]"]').length > 0;
    var alairo_param   = '';
    if( alairo_jeloles ) {
        alairo_param = '&amp;alairo1=' + JSON.stringify(addSzallodaPipak(that, 'alairo1[]')) + '&amp;alairo2=' + JSON.stringify(addSzallodaPipak(that, 'alairo2[]'));
        if( felulir ) {
            alairo_param += '&amp;felulir=1';
        }
    }

    if( loginID && (objLength(data) || alairo_jeloles) ) {
        var ajax = $.ajax({
         	url : 'login.php',
         	type: 'GET',
         	data: esamp2es('loginID=' + loginID + '&amp;szallIDs=' + JSON.stringify(data) + alairo_param + '&amp;addSzalloda=' + new Date().getTime()),
         	success: function(html) {
                if(html.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
         		if( html ) {
                    html = JSON.parse(html);

                    if( html.statusz == 'hiba' ) {
                        alert2(html.uzi, '', 'Hiba');
                        return false;
                    }

                    // Másik felhasználó már aláíró az adott szállodánál: megerősítés után felülírjuk
                    if( html.statusz == 'megerosites' ) {
                        alert2(html.uzi, '<input type="button" class="gomb zold" value="Igen" onclick="alert2(); addSzalloda(\'' + loginID + '\', $(\'#addSzallodaForm\')[0], 1);"><input type="button" class="gomb piros" value="Nem" onclick="alert2()">');
                        return false;
                    }

         			szamlaBetolt(loginID, PHP_SELF, 'szallodak').done(function() {

                    });

                    popupZar();
         		}
         	},
            complete: function(xhr) {
                if( xhr.status != 200 ) {
                    alert2(xhr.responseText, '', 'Hiba');
                }
            }
        });

        $.when( ajax ).then(function() {
            $(that).find('input[name="addSzalloda"]').val('');
            $(that).find('input[name="addSzalloda_autocomp"]').val('');
        });
    }

    return false;
}
</script>
