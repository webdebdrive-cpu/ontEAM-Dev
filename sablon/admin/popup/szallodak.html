<h2>Új Szálloda hozzáadása</h2>
<form action="" id="addSzallodaForm" class="popupForm" method="post">
    <div class="kozep" style="min-height: 26rem; width: 50rem">
        <div class="dt szalloda_hozzaad">
            <div class="dtr">
                <div class="dtc">
                    <input type="button" name="megsem" class="gomb" value="Pesti szállodák" onclick="szallodakJelol( 'pesti' );" style="width: 13rem">
                    <input type="button" name="megsem" class="gomb" value="Vidéki szállodák" onclick="szallodakJelol( 'videki' );" style="width: 13rem">
                    <input type="button" name="megsem" class="gomb" value="Mind jelölése" onclick="szallodakJelol( 'mind' );" style="width: 13rem">
                    <input type="button" name="megsem" class="gomb" value="Mind ürítése" onclick="szallodakJelol( 'urit' );" style="width: 13rem">
                </div>
                <div class="dtc form_jobb">
                    <div class="szallodak_keret">
                        <div id="addSzallodak" class="dt szallodak"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
    </div>
</form>
<script>
$(document).ready(function(){
    $('#addSzallodaForm').attr('onsubmit', 'return addSzalloda(\'' + _get('id') + '\', this);');
});
function addSzalloda( loginID, that ) {

    var telephelyek = $(that).find('input[name="telephely[]"]:checked');
    var data = {};
    telephelyek.each(function(i) {
        var value = $(this).val();
        data[i] = value;
    });

    /* Új feltöltéskor csak hidden inputba tesszük az adatokat. */
    if(_get('uj')){
        $('#szallodak_hidden').val( JSON.stringify(data) );
        popupZar();
        return false;
    }

    if( loginID && objLength(data) ) {
        var ajax = $.ajax({
         	url : 'login.php',
         	type: 'GET',
         	data: esamp2es('loginID=' + loginID + '&amp;szallIDs=' + JSON.stringify(data) + '&amp;addSzalloda=' + new Date().getTime()),
         	success: function(html) {
                if(html.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
         		if(html) {
                    html = JSON.parse(html);

                    if( html.statusz == 'hiba' ) {
                        alert2(html.uzi, '', 'Hiba');
                        return false;
                    }

         			szamlaBetolt(loginID, baseName(location.href) + '.php', 'szallodak').done(function() {

                    });

                    popupZar();
         		}
         	}
        });

        $.when( ajax ).then(function() {
            $(that).find('input[name="addSzalloda"]').val('');
            $(that).find('input[name="addSzalloda_autocomp"]').val('');
        });
    }

    return false;
}
</script>
