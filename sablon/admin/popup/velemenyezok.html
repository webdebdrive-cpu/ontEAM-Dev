<h2>Új véleményező hozzáadása</h2>
<form id="addVelemenyezokForm" class="popupForm" method="post" onsubmit="return addVelemenyezoFg();">
    <div class="kozep" style="min-height: 26rem">
        <div class="dt"> 
            <div class="dtr">
                <div class="dtc">Véleményező:</div>
                <div class="dtc form_jobb">
                    <input type="text" name="addVelemenyezo_autocomp" id="velemenyezoKeres" class="gombm disableNav focus" value="" placeholder="Véleményező keresése..." autocomplete="off">
                    <input type="hidden" name="addVelemenyezo" id="addVelemenyezo" value="">

                    <script>
                        $(document).ready(function() {
                            $('#velemenyezoKeres').autocomplete({
                                'php_fajl'        : '../velemeny_autocomplete.php',
                                'tabla'           : 'login',
                                'oszlop_keres'    : 'teljes_nev',
                                'oszlop_listaz'   : 'teljes_nev',
                                'id_kiir'         : 'recid',
                                'recid'           : $('#priRecid').val()
                            });
                        });
                    </script>
                </div>
            </div>
        </div>
    </div>
    <div class="kuldes">
        <input type="submit" name="elkuld" value="Mentés">
        <input type="button" name="megsem" class="gombb_alert" value="Mégsem" onclick="popupZar();">
        <input type="hidden" id="korabbi_velemeny_torlesevel">
    </div>
</form>
<script>
    
$(document).ready(function(){
    $.ajax({
        url  : 'projektigenyles.php',
        type : 'POST',
        data: {
            recid                   : _get('id'),
            velemenyezok_status_ell : new Date().getTime()
        },
        success: function (response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if (response) {
                response = JSON.parse(response);
                if( response.hiba ) {
                    alert2(response.hiba, response.gomb, response.title);
                    popupZar();
                    return false;
                }
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
});
    
/* Véleményező hozzáadása projektigényléshez */
function addVelemenyezoFg() {
    
    var pr_igeny_recid = _get('id');
    var login_recid = $('#addVelemenyezo').val();

    if( pr_igeny_recid ) {
        var ajax = $.ajax({
         	url : 'projektigenyles.php',
         	type: 'POST',
         	data: esamp2es('login_recid=' + login_recid + '&amp;pr_igeny_recid=' + pr_igeny_recid + '&amp;korabbi_velemeny_torlesevel=' + $('#korabbi_velemeny_torlesevel').val() + '&amp;addVelemenyezo=' + new Date().getTime()),
         	success: function(response) {
                if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
         		if( response ) {
                    response = JSON.parse(response);

                    if( response.hiba ) {
                        alert2(response.hiba, response.gomb, 'Hiba');
                        return false;
                    }

         			szamlaBetolt(pr_igeny_recid, PHP_SELF, 'velemenyezok').done(function() {
                        $('#naploSor-' + response.kapcsID).addClass('uj');
                    });

                    popupZar();
         		}
         	},
            complete: function(xhr) {
                if( xhr.status != 200 ) {
                    alert2(xhr.responseText, '', 'Hiba');
                }
            }
        });
    }

    return false;
}
</script>
