<script>
/* Véleményező hozzáadása projektigényléshez */
function addVelemenyezoFg( pr_igeny_recid, that ) {

    var login_recid = $('#addVelemenyezo').val();

    if( pr_igeny_recid ) {
        var ajax = $.ajax({
         	url : 'projektigenyles.php',
         	type: 'POST',
         	data: esamp2es('login_recid=' + login_recid + '&amp;pr_igeny_recid=' + pr_igeny_recid + '&amp;korabbi_velemeny_torlesevel=' + $('#korabbi_velemeny_torlesevel').val() + '&amp;addVelemenyezo=' + new Date().getTime()),
         	success: function(response) {
                if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
         		if(response) {
                    response = JSON.parse(response);

                    if( response.hiba ) {
                        alert2(response.hiba, response.gomb, 'Hiba');
                        return false;
                    }

         			szamlaBetolt(pr_igeny_recid, baseName(location.href) + '.php', 'velemenyezok').done(function() {
                        $('#naploSor-' + response.kapcsID).addClass('uj');
                    });

                    popupZar();
         		}
         	}
        });
    }

    return false;
}
</script>
