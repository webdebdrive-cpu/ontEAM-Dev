<h2>Munkalap csatolása számlához</h2>

<div class="kozep" style="max-height: 45rem; overflow-y: auto">
    <div id="ml_lista"></div>
</div>
<div class="kuldes">
    <div>
        <input type="button" class="gomb" value="Keresés archívban" onclick="get_ml_lista('-archivum-')" id="ml_keres_gomb">
    </div>
    <div>
        <input type="button" class="gomb zold" value="Ok" onclick="mlok_csatolasa()" id="ml_csatol_gomb">
        <input type="button" class="gomb piros escapes_megsem" value="Mégsem" onclick="popupZar();">
    </div>
</div>
<style>
    #popup div.popup_tart div.kuldes {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 2rem 2.6rem;
    }
</style>
<script>
$(document).ready(function () {
    get_ml_lista();
});

// Munkalapok kilistázása
function get_ml_lista(archivum = '') {
    
    $.ajax({
        url : 'munkalap.php',
        type: 'POST',
        data: {
            archivum     : archivum,
            szamla_id    : _get('id'),
            get_ml_lista : Date.now() 
        },
        success: function(response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if( response ) {
                response = JSON.parse(response);
                if(response.hiba){
                    alert2(response.hiba, response.gomb, response.title);
                    popupZar();
                    return false;
                }
                if(response.html){
                    $('#ml_lista').html(response.html);
                }

                if( archivum ) {
                    $('#ml_keres_gomb').val('Keresés élőben').attr('onclick', 'get_ml_lista()');
                    $('#ml_csatol_gomb').attr('onclick', 'mlok_csatolasa(\'-archivum-\')');
                } else {
                    $('#ml_keres_gomb').val('Keresés archívban').attr('onclick', 'get_ml_lista(\'-archivum-\')');
                    $('#ml_csatol_gomb').attr('onclick', 'mlok_csatolasa()');
                }
            }
        },
        complete: function(xhr) {
            if( xhr.status != 200 ) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
}

// Munkalapok csatolása
function mlok_csatolasa(archivum = '') {
    
    var ml_idk = [];
    $('#ml_lista tr.kijelolve').each(function() {
        ml_idk.push( $(this).data('id') );
    });
    
    if( !ml_idk.length ) {
        alert2('Kérjük jelölje meg a csatolni kívánt munkalapok sorait!', '', 'Hiba');
        return false;
    }
    
    $.ajax({
        url : 'munkalap.php',
        type: 'POST',
        data: {
            szl_id          : _get('id'),
            idk             : JSON.stringify(ml_idk),
            archivum        : archivum,
            mlok_csatolasa  : Date.now()
        },
        success: function (response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if (response) {
                response = JSON.parse(response);
                if (response.hiba) {
                    alert2(response.hiba, response.gomb, response.title);
                    return false;
                }
                if (response.siker) {
                    setTimeout(function(){ szurkit(); }, 100);
                    szamlaBetolt(_get('id'), 'fenntartasi_szamla.php', 'munkalapok').done(function() {
                        popupZar();
                    });
                }
            }
        },
        complete: function (xhr) {
            if (xhr.status != 200) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
}

// Munkalap csatolás bontása
function ml_bontasa(id, archivum = '', mehet = '') {
    
    if( !mehet ) {
        // $('#ml_sor_'+id).addClass('torles_elott'); // Ez itt felesleges
        alert2('Biztosan törölhető a munkalap csatolás?', '<input type="button" class="gomb zold" value="Igen" onclick="ml_bontasa(\''+id+'\', \''+archivum+'\', \'-mehet-\')"><input type="button" class="gomb piros" value="Nem" onclick="alert2()">');
        return false;
    }
    
    $.ajax({
        url : 'munkalap.php',
        type: 'POST',
        data: {
            id          : id,
            archivum    : archivum,
            ml_bontasa  : Date.now()
        },
        success: function (response) {
            if(response.substring(0, 6)=='SESKIL'){ location.href = 'index.php'; }
            if (response) {
                response = JSON.parse(response);
                if (response.hiba) {
                    alert2(response.hiba, response.gomb, response.title);
                    return false;
                }
                if (response.siker) {
                    setTimeout(function(){ szurkit(); }, 100);
                    szamlaBetolt(_get('id'), 'fenntartasi_szamla.php', 'munkalapok').done(function() {
                        popupZar();
                    });
                }
            }
        },
        complete: function (xhr) {
            if (xhr.status != 200) {
                alert2(xhr.responseText, '', 'Hiba');
            }
        }
    });
}
</script>
