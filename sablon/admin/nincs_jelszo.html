<!DOCTYPE html>
<html>
<head>
    <title>Beléptetés</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <link rel="stylesheet" href="../css/nullaz.css" type="text/css">
    <link rel="stylesheet" href="../css/admin.css" type="text/css">
    <link rel="stylesheet" href="../css/alert_admin.css" type="text/css">
</head>
<body onload="if(document.getElementById('nev')){document.getElementById('nev').focus();}" style="overflow: scroll; height: 60rem">
    <div style="height: 60rem">
        <div class="noFooter rFalse alert2" style="max-width: 40rem; margin: auto; position: relative;">
            <div class="figy">
                <div class="header">{FELIRAT}</div>
                <div class="tart">
                    <span style="font-weight: normal; font-size: 1.1rem; line-height: 1.3; display: block; margin: 0 0 1rem 1.5rem">
                        A jelszó hossza minimum 8, maximum 20 karakter hosszú lehet!
                        <br>Ügyeljen, hogy a jelszó számokat és betűket is tartalmazzon!
                    </span>
                    <form method="post" action="{SELF}" onsubmit="return jelszo_ell()">
                        <table class="auto">
                            <tr>
                                <td class="p c">
                                    <input type="password" id="jlsz" name="jlsz" placeholder="Jelszó" autofocus maxlength="20">
                                </td>
                            </tr>
                            <tr>
                                <td class="p c">
                                    <input type="password" id="jlsz2" name="jlsz2" placeholder="Jelszó megerősítése" maxlength="20" autocomplete="off">
                                </td>
                            </tr>
                            <tr>
                                <td class="p c">
                                    <input class="gombb zold" type="submit" name="jelszo_csere" value="Mentés">
                                    <br><input class="gomb" type="button" name="jelszo_csere" value="Vissza a bejelentkezéshez" onclick="megsem()" style="margin-top: 0.7rem; font-size: 1.4rem; padding: 0.7rem">
                                </td>
                            </tr>
                        </table>
                    </form>
                </div>
                <div class="f_footer"></div>
            </div>
        </div>
</div>
    <script>
        function jelszo_ell(){
            
            if( !$('#jlsz').val() ){
                alert2('Kérem válasszon jelszót!');
                return false;
            }
            if( $('#jlsz').val()!=$('#jlsz2').val() ){
                alert2('A két jelszó nem egyezik!', '', 'Hiba');
                return false;
            }
            if( $('#jlsz').val().length<8 || $('#jlsz').val().length>20 ){
                alert2('A jelszó hossza 8 és 20 karakter között legyen!', '', 'Hiba');
                return false;
            }
            jelszo = $('#jlsz').val();
            if( jelszo.search(/[a-zA-Z]/) == -1 || jelszo.search(/[0-9]/) == -1 ){
                alert2('A jelszó betűket és számokat is tartalmazzon!', '', 'Hiba');
                return false;
            }
            
            return true;
        }
        
        function megsem(){
            $.ajax({
                url : 'beleptetes.php',
                type: 'POST',
                data: {
                    megsem   : Date.now()
                },
                success: function(response){
                    szurkit();
                    location.href='/';
                },
                complete: function(xhr) {
                    if( xhr.status != 200 ) {
                        alert2(xhr.responseText, '', 'Hiba');
                    }
                }
            });
        }
    </script>
</body>
</html>
