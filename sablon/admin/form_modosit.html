<div class="dtr">
    <div class="dtc">
        {JS}
        {CK_EDITOR}
        <form id="szerk_form" action="{ACTION}" enctype="multipart/form-data" method="post" onsubmit="javascript:return form_ell_admin_elott()">
            <div class="dt full">
                {MEZOK}
            </div>
            <script>

                function form_ell_admin_elott(){
                    {JS_SUBMIT_ELOTT}
                }

                $(document).ready(function () {
                    $('.datepicker').datetimepicker({
                        closeOnDateSelect   : true,
                        format              :'Y.m.d',
                        mask                : /*'____.__.__'*/'\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0',
                        timepicker          : false,
                        validateOnBlur      : false,
                        onChangeDateTime    : function(){ $('#mehet_gomb').removeAttr('disabled').addClass('gombb_alert'); }
                    });
                    $('.datetimepicker').datetimepicker({
                        closeOnDateSelect   : true,
                        format              :'Y.m.d H:i',
                        mask                : /*'____.__.__ __:__'*/'\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0\xa0\xa0\xa0:\xa0\xa0',
                        timepicker          : true,
                        step                : 60,
                        validateOnBlur      : false,
                        onChangeDateTime    : function(dp, $input){
                            $('#mehet_gomb').removeAttr('disabled').addClass('gombb_alert');
                            /* Órapontosak vagyunk */
                            $input.val( $input.val().substring(0, 14)+'00' );
                        }
                    });
                    $('.ora_perc').datetimepicker({
                        closeOnDateSelect   : true,
                        datepicker          : false,
                        format              :'H:i',
                        mask                : /*'__:__'*/'\xa0\xa0:\xa0\xa0',
                        step                : 60,
                        validateOnBlur      : false,
                        onChangeDateTime    : function(dp, $input){
                            $('#mehet_gomb').removeAttr('disabled').addClass('gombb_alert');
                            /* Órapontosak vagyunk */
                            $input.val( $input.val().substring(0, 3)+'00' );
                        }
                    });
                    
                    $(document).on('blur', '.datepicker, .datetimepicker', function(e) {
                        if( !Date.parse( $(this).val().replace(/\./gi, '-') ) ){
                            alert2('Helytelen dátum!', '', 'Hiba');
                        }
                    });
                            

                    /* Ha az űrlapnak nincs submit-ja, akkor minden mezőjét tiltunk.  */
                    if(!$('#szerk_form').parent().find('input.mentes_gomb').length){
                        $('#szerk_form input, #szerk_form textarea, #szerk_form select').attr('disabled', true);
                        $('#szerk_form input.f_nem_rejt').attr('disabled', false);
                        $('#szerk_form input.foGomb').removeAttr('disabled');
                    }
                    /* Ha a helyiség input tiltott, akkor az ikonja is legyen az */
                    if($('#obj_id_autocomp').is(':disabled')){
                        $('.obj_gen').hide();
                    }

                });

            </script>
            <div>
                <input type="hidden" name="{MEGNEVEZES}lista">
                <input type="hidden" id="{MEGNEVEZES}ujkent_szerk" name="{MEGNEVEZES}ujkent_szerk" value="">
            </div>
        </form>
        {GOMBOK}
        {KEP}
    </div>
</div>
