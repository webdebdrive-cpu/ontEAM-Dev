<div class="dtr">
    <div class="dtc">
        {JS}
        {CK_EDITOR}
        <form id="szerk_form" action="{ACTION}" enctype="multipart/form-data" method="post" onsubmit="javascript:return form_ell_admin_elott()">
            <div class="dt full">
                {MEZOK}
            </div>
            <script>

                function form_ell_admin_elott(){
                    {JS_SUBMIT_ELOTT}
                }

                $(document).ready(function () {
                    $('.datepicker').datetimepicker({
                        closeOnDateSelect   : true,
                        format              :'Y.m.d',
                        mask                : '\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0',
                        timepicker          : false,
                        validateOnBlur      : false,
                        scrollInput         : false,
                        onChangeDateTime    : function(){ $('#mehet_gomb').removeAttr('disabled').addClass('gombb_alert'); $('#megsem_gomb').removeAttr('disabled'); }
                    });
                    $('.datepicker_tegnapig').datetimepicker({
                        closeOnDateSelect   : true,
                        format              :'Y.m.d',
                        mask                : '\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0',
                        timepicker          : false,
                        validateOnBlur      : false,
                        scrollInput         : false,
                        maxDate             : '+1970/01/02',
                        onChangeDateTime    : function(){ $('#mehet_gomb').removeAttr('disabled').addClass('gombb_alert'); $('#megsem_gomb').removeAttr('disabled'); }
                    });
                    $('.datepicker_matol').datetimepicker({
                        closeOnDateSelect   : true,
                        format              :'Y.m.d',
                        mask                : '\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0',
                        timepicker          : false,
                        validateOnBlur      : false,
                        scrollInput         : false,
                        minDate             : '-1970/01/02',
                        onChangeDateTime    : function(){ $('#mehet_gomb').removeAttr('disabled').addClass('gombb_alert'); $('#megsem_gomb').removeAttr('disabled'); }
                    });
                    $('.datetimepicker').datetimepicker({
                        closeOnDateSelect   : false,
                        format              :'Y.m.d H:i',
                        mask                : '\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0\xa0\xa0:\xa0\xa0',
                        timepicker          : true,
                        step                : 60,
                        validateOnBlur      : false,
                        scrollInput         : false,
                        onChangeDateTime    : function(dp, $input){
                            $('#mehet_gomb').removeAttr('disabled').addClass('gombb_alert');
                            $('#megsem_gomb').removeAttr('disabled');
                            /* Órapontosak vagyunk */
                            $input.val( $input.val().substring(0, 14)+'00' );
                        }
                    });
                    $('.ora_perc').datetimepicker({
                        closeOnDateSelect   : true,
                        datepicker          : false,
                        format              :'H:i',
                        mask                : /*'__:__'*/'\xa0\xa0:\xa0\xa0',
                        step                : 60,
                        validateOnBlur      : false,
                        scrollInput         : false,
                        onChangeDateTime    : function(dp, $input){
                            $('#mehet_gomb').removeAttr('disabled').addClass('gombb_alert');
                            $('#megsem_gomb').removeAttr('disabled');
                            /* Órapontosak vagyunk */
                            $input.val( $input.val().substring(0, 3)+'00' );
                        }
                    });
                    $('.ora_perc_felora').datetimepicker({
                        closeOnDateSelect   : true,
                        datepicker          : false,
                        format              :'H:i',
                        mask                : /*'__:__'*/'\xa0\xa0:\xa0\xa0',
                        step                : 30,
                        validateOnBlur      : false,
                        scrollInput         : false,
                        onChangeDateTime    : function(dp, $input){
                            $('#mehet_gomb').removeAttr('disabled').addClass('gombb_alert');
                            $('#megsem_gomb').removeAttr('disabled');
                            /* Órapontosak vagyunk */
                            $input.val( $input.val().substring(0, 3)+'00' );
                        }
                    });
                    
                    /* Escape-ra záródjonbe */
                    $(document).on('keyup', function(e) {
                        if( e.keyCode == KEY_ESCAPE ) {
                            $('.xdsoft_datetimepicker').hide();
                        }
                    });

                    /* Ha az űrlapnak nincs submit-ja, akkor minden mezőjét tiltunk.  */
                    if( !$('#szerk_form').parent().find('input.mentes_gomb').length ){
                        adatlap_minden_inputjat_disabled();
                    }

                    /* Ha a helyiség input tiltott, akkor az ikonja is legyen az */
                    var readonly_e = $('#obj_id_autocomp').attr('readonly');
                    if(typeof readonly_e !== typeof undefined && readonly_e !== false){
                        $('.obj_gen').hide();
                    }
                    
                    /* Readonly mezőkre ne lehessen tabozni */
                    $('#szerk_form input').filter("[readonly='readonly']").each(function() {
                        $(this).attr('tabindex', '-1');
                    });

                });

            </script>
            <div>
                <input type="hidden" name="update_dt" id="update_dt" value="{UPDATE_DT}">
                <input type="hidden" name="{MEGNEVEZES}lista">
                <input type="hidden" id="{MEGNEVEZES}ujkent_szerk" name="{MEGNEVEZES}ujkent_szerk" value="">
            </div>
        </form>
        {GOMBOK}
        {KEP}
    </div>
</div>
