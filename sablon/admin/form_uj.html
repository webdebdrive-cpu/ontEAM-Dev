<div class="dtr">
    <div class="dtc">
        {JS}
        {CK_EDITOR}
        <form id="szerk_form" action="{ACTION}?modosit" enctype="multipart/form-data" method="post" onsubmit="return form_ell_admin_elott()">
            <div class="dt full">
                {MEZOK}
            </div>
            <script>

                function form_ell_admin_elott() {
                    {JS_SUBMIT_ELOTT}
                }

                $(document).ready(function () {
                    $('.datepicker').datetimepicker({
                        closeOnDateSelect   : true,
                        format              :'Y.m.d',
                        mask                : '\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0',
                        timepicker          : false,
                        validateOnBlur      : false,
                        onChangeDateTime    : function(){ $('#mehet_gomb').removeAttr('disabled').addClass('gombb_alert'); $('#megsem_gomb').removeAttr('disabled'); }
                    });
                    $('.datepicker_tegnapig').datetimepicker({
                        closeOnDateSelect   : true,
                        format              :'Y.m.d',
                        mask                : '\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0',
                        timepicker          : false,
                        validateOnBlur      : false,
                        scrollInput         : false,
                        maxDate             : '+1970/01/02',
                        onChangeDateTime    : function(){ $('#mehet_gomb').removeAttr('disabled').addClass('gombb_alert'); $('#megsem_gomb').removeAttr('disabled'); }
                    });
                    $('.datepicker_matol').datetimepicker({
                        closeOnDateSelect   : true,
                        format              :'Y.m.d',
                        mask                : '\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0',
                        timepicker          : false,
                        validateOnBlur      : false,
                        scrollInput         : false,
                        minDate             : '-1970/01/02',
                        onChangeDateTime    : function(){ $('#mehet_gomb').removeAttr('disabled').addClass('gombb_alert'); $('#megsem_gomb').removeAttr('disabled'); }
                    });
                    $('.datetimepicker').datetimepicker({
                        closeOnDateSelect   : false,
                        format              :'Y.m.d H:i',
                        mask                : '\xa0\xa0\xa0\xa0.\xa0\xa0.\xa0\xa0\xa0\xa0:\xa0\xa0',
                        timepicker          : true,
                        step                : 60,
                        validateOnBlur      : false,
                        onChangeDateTime    : function(dp, $input){
                            $('#mehet_gomb').removeAttr('disabled').addClass('gombb_alert');
                            $('#megsem_gomb').removeAttr('disabled');
                            /* Órapontosak vagyunk */
                            $input.val( $input.val().substring(0, 14)+'00' );
                        }
                    });
                    $('.ora_perc').datetimepicker({
                        closeOnDateSelect   : true,
                        datepicker          : false,
                        format              :'H:i',
                        mask                : '\xa0\xa0:\xa0\xa0',
                        step                : 60,
                        validateOnBlur      : false,
                        onChangeDateTime    : function(dp, $input){
                            $('#mehet_gomb').removeAttr('disabled').addClass('gombb_alert');
                            $('#megsem_gomb').removeAttr('disabled');
                            /* Órapontosak vagyunk */
                            $input.val( $input.val().substring(0, 3)+'00' );
                        }
                    });
                    
                    /* Fókuszálás az űrlap első nem disabled mezőjére */
                    /* A késleletés azért kell, mert a gyors szűrő érték mezőjére is ráfókuszálunk, de új feltöltéskor az adatlap első elemére fókuszálni fontosabb. */
                    setTimeout(function(){ 
                        $('#szerk_form input:text, #szerk_form textarea, #szerk_form select').filter(':not(:disabled)').filter(":not([readonly='readonly'])").first().focus().select();
                    }, 1000);

                    /* Readonly mezőkre ne lehessen tabozni */
                    $('#szerk_form input').filter("[readonly='readonly']").each(function() {
                        $(this).attr('tabindex', '-1');
                    });

                });
            </script>
            <div>
                <input type="hidden" name="uj{MEGNEVEZES}">
            </div>
            {GOMBOK}
        </form>
    </div>
</div>
