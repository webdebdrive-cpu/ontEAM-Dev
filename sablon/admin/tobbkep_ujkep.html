<a name="kepek"></a>
<div id="jsff_{MEGN}" class="jsff">
    <span class="uzenet">
        <span class="f15">Húzza ide a fájlokat</span>
        <br>vagy tallózza be az alábbi gombbal:
    </span>
    <span class="hiba"></span>
    <br>
    <div class="talloz">
        <div>
            <span>{GOMB_NEVE}</span> <input type="file" name="files[]"{MULTIPLE} onchange="beolvasas_{MEGN}(this.files, false);"{ENG_KIT}>
        </div>
    </div>
</div>

<script>
var jsff_{MEGN} = document.getElementById('jsff_{MEGN}'),
    tests_{MEGN} = {
        filereader  : typeof FileReader != 'undefined',
        dnd         : 'draggable' in document.createElement('span'),
        formdata    : !!window.FormData,
        progress    : 'upload' in new XMLHttpRequest
    },
    kepformatumok_{MEGN} = {
        'image/png' : true,
        'image/jpeg': true,
        'image/gif' : true
    };

/* Előnézet */
function elonezet_{MEGN}(file){

    /* Ha van filereader, és képelemről van szó, akkor készítünk egy thumbnailt */
    if (tests_{MEGN}.filereader === true && kepformatumok_{MEGN}[file.type] === true) {
        var reader = new FileReader();
        reader.onload = function (event) {
            var image   = new Image();
            image.src   = event.target.result;
            jsff_{MEGN}.appendChild(image);
        };
        reader.readAsDataURL(file);

    /* Egyébként csak egy sort írunk */
    }else{
        jsff_{MEGN}.innerHTML += 'Feltöltve ' + file.name + ' ' + (file.size ? (file.size/1024|0) + 'K' : '') + '<br>';
    }

}

/* Beolvasás */
function beolvasas_{MEGN}(fajlok, ellenorzes_kihagy) {

    var voltmar = [];

    var formData        = tests_{MEGN}.formdata ? new FormData() : null;
    var fajlok_kesz     = 0;

    for (var i = 0; i < fajlok.length; i++){

        formData.append('file', fajlok[i]);
        /* Kép megjelenítése egyből: */
        /*elonezet_{MEGN}(fajlok[i]);*/

        fajl = fajlok[i];

        progress_id = 'jsff_{MEGN}_' + i;
        var pg = $('<progress id="'+progress_id+'" min="0" max="100" value="0">0</progress>');
        $('#jsff_{MEGN}').append(pg);

        var xhr = new XMLHttpRequest();
        xhr.open('POST', '{PHP_FAJL}');

        (function(progress_id, fajl, i){
            xhr.upload.onprogress = function(e){
                var percent = parseInt(e.loaded / e.total * 100);
                $('#' + progress_id).val(percent);
            };
            xhr.onload = function(){
                fajlok_kesz++;
                $('#' + progress_id).val(100);
                $('#' + progress_id).fadeOut(2000, function(){ $('#' + progress_id).next('br').remove(); });

                var nem_irhato_felul = false;
                /* Ha a 'frissit' szót kaptunk válaszul, akkor újra betöltjük a dokumentumok felület tartalmát (pl. lehet megváltoztak a nyomógombok a feltöltés hatására) */
                if( this.responseText.substring(0,7)== 'frissit' ) {
                    if(fajlok_kesz == fajlok.length) {
                        szamlaBetolt(_get('id'), baseName(location.href) + '.php', 'dokumentumok');
                    }
                } else {
                    /* Hibakezelés */
                    if(this.responseText.substring(0,5)=='Hiba!') {
                        
                        if( this.responseText.substring(5) == 'A fájl létezik!' ) {
                            voltmar[i] = fajl;
                        } else {
                            alert2(this.responseText.substring(5), '', 'Hiba');
                        }
                        
                    /* Dokumentum tipus beállítás + fájl kiíratása. (Pl. projektigényeknél) */
                    }else if(this.responseText.substring(0,13)=='tipus_beallit'){
                        
                        $('#sorrendezes_tobbkep').append(this.responseText.substring(13));
                        if (fajlok_kesz == fajlok.length){
                            minden_fajl_kesz_{MEGN}();
                        }

                        /* A tipusválasztáson felül még a továbbléptetést is felajánjuk, ha a 'tipus_beallit'-on felül még a 'leptessuk_e_tovabb' is a visszatérési értékben van. */
                        leptessuk_e_tovabb = '';
                        if(this.responseText.substring(13,31)=='leptessuk_e_tovabb'){
                            leptessuk_e_tovabb = 'igen';
                        }
                        
                        /* Tipus választó popup megnyitása */
                        $.get('../sablon/admin/popup/dokumentum_tipus_valaszt.html?cache=' + new Date().getTime(), function( data ) {
                            $('#popupTart').html(data);
                            popupNyit();
                        });
                        
                    /* Projekteknél, sikeres fájlfetöltés után rákérdezünk, hogy léptessük-e tovább következő státusba */
                    }else if(this.responseText.substring(0,18)=='leptessuk_e_tovabb'){
                        
                        $('#sorrendezes_tobbkep').append(this.responseText.substring(18));
                        if (fajlok_kesz == fajlok.length){
                            minden_fajl_kesz_{MEGN}();
                        }
                        
                        nem_irhato_felul = true;
                        
                        /* Ezzel hívjuk meg a popupot */
                        projekt_fajfeltoltes_utan_tovabb();
                        
                    /* Simán fájl kiíratása */
                    }else{
                        
                        $('#sorrendezes_tobbkep').append(this.responseText);
                        if (fajlok_kesz == fajlok.length){
                            minden_fajl_kesz_{MEGN}();
                        }
                        
                    }

                    if(fajlok_kesz == fajlok.length){
                        if( voltmar.length ) {
                            fajl_feluliras_alert_{MEGN}(voltmar);
                        }
                    }
                }
            };
        }(progress_id, fajl, i));

        var parameterek = {{PARAMETEREK}};
        $.each(parameterek, function(kulcs, ertek){
            formData.append(kulcs, ertek);
        });

        formData.append('ellenorzes_kihagy', ellenorzes_kihagy);

        xhr.send(formData);

    }

    if( ellenorzes_kihagy ) {
        alert2('');
    }
}
felulirando_fajlok = false;
function fajl_feluliras_alert_{MEGN}(tomb) {
    
    /* Projekteknél nem írunk felül fájlokat. */
    if( baseName(location.href) == 'projektkezeles' ){
        alert2(tomb[0].name+' fájl már létezik, kérem nevezze át az új fájlt egy másik névre!', '', 'Hiba');
        return false;
    }
    
    if( tomb ) {
        nevek = 'A következő fájlok már léteznek, felülírja őket?';
        for (var i = 0; i < tomb.length; i++){
            nevek += '<p>' + tomb[i].name + '</p>';
        }

        felulirando_fajlok = tomb;
        alert2(nevek, '<input class="gomb zold" value="Igen" onclick="fajl_feluliras_{MEGN}();" type="button"><input class="gomb piros" value="Nem" onclick="alert2()" type="button">', 'Hiba');
    }
}

function fajl_feluliras_{MEGN}() {
    beolvasas_{MEGN}(felulirando_fajlok, true);

    felulirando_fajlok = false;
}

/* Ha minden fájl feltöltése kész, akkor itt adhat meg további utasítás */
function minden_fajl_kesz_{MEGN}(){
    {MINDEN_KESZ}
    $('#jsff_{MEGN}').find('progress').fadeOut(2000, function(){ $('#' + progress_id).next('br').remove(); });
    
    szamlaSorFrissit(baseName(location.href), _get('id'));
}

/* Ha működik a drag&drop, akkor a CSS class-t megváltoztatjuk draghoverre */
if(tests_{MEGN}.dnd){

    jsff_{MEGN}.ondragover = function(){
        this.className = 'jsff hover';
        return false;
    };

    jsff_{MEGN}.ondragleave = function(){
        this.className = 'jsff';
        return false;
    };

    jsff_{MEGN}.ondrop = function(e){
        this.className = 'jsff';
        e.preventDefault();
        beolvasas_{MEGN}(e.dataTransfer.files, false);
    };

}
</script>
