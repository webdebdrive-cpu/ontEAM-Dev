<link rel="stylesheet" href="../css/nullaz.css" type="text/css">
<link rel="stylesheet" href="../css/admin.css" type="text/css">
<link rel="stylesheet" href="../css/alert_admin.css" type="text/css">

<div class="noFooter rFalse alert2" style="width: 40rem; margin: auto; position: relative; box-shadow: 0rem 0.1rem 0.2rem 0rem #ccc">
    <div class="figy">
        <div class="header">{FELIRAT}</div>
        <div class="tart">
            <form method="post" action="{SELF}">
                <table class="auto">
                    <tr>
                        <td class="p">
                            <input type="text" name="nev" id="nev" placeholder="Felhasználó név" autocomplete="off" autofocus>
                        </td>
                    </tr>
                    <tr>
                        <td class="p">
                            <input type="password" name="jelszo" placeholder="Jelszó">
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="p c">
                            <input class="gombb zold" type="submit" name="login" value="Belépés">
                        </td>
                    </tr>
                </table>
            </form>
        </div>
        <div class="f_footer"></div>
    </div>
</div>

<div class="c" style="margin-top: 2rem">
    <input type="button" class="gomb" value="Elfelejtettem a jelszavam" onclick="elf_jelszo()">
</div>
<script>
	function elf_jelszo(){
        if( !$('#nev').val().trim() ){
            alert2('Kérem adja meg a felhasználói nevét!');
            $('#nev').addClass('hibas_ide_focus');
            return false;
        }
        
        alert2('Elfelejtett jelszó küldése...', '', 'Információ');
        $.ajax({
            url : 'esemenyek.php',
            type: 'POST',
            data: {
                nev                 : $('#nev').val(),
                elfelejtett_jelszo  : Date.now()
            },
            success: function(response){
                if(response){
                    response = JSON.parse(response);
                }
                if( response.hiba ) {
                    alert2(response.hiba, response.gomb, 'Hiba');
                }else{
                    alert2('Kérése feldolgozás alatt, értesítést fog kapni új jelszaváról!', '', 'Információ');
                }
            }
        });

    }
</script>
